# star's live MASON configuration for the shadow period, running beside starpipe: MASON claims only
# issues labelled `mason`. Inventory and decisions: brianm998/mason docs/stages/s27.md.
#
# direct-ci: ready tasks are merged into one disposable branch, the suites run over the union,
# the branch is pushed as `mason/ci/<batch>`, CI is dispatched on it, and a green result
# fast-forwards `develop`. No pull request is opened, which is star's "No pull requests for
# internal work" rule. Which workflow is dispatched is in the project registration, not here:
# `[ci] workflow = "pr-gate.yml"` in docs/examples/star.project.toml.
#
# direct-ci dispatches ONE workflow with no inputs. starpipe also dispatched macos-gate.yml and, per
# ticket, gherkin.yml with a `features` input. How those two are covered is an owner decision
# (docs/decisions/0119, decisions 1 and 2); nothing in this file covers them. The full Gherkin matrix is covered
# nightly, after landing, by .github/workflows/gherkin-nightly.yml (a GitHub schedule); per-task feature runs before
# landing are still not wired.
mode = "direct-ci"
base = "develop"
window = "20m"
max_size = 0

# The batch tier: suites run over the batch's union diff, picked by the [impact] map, so only a batch
# touching star-desktop/** (or an unmapped path) pays for it. A task's test step narrows test-desktop to
# the classes naming a changed file, so the whole-tree guard tests (NoHardCodedStringsTest, IdRegistryTest,
# StarArtTest) never ran before landing; task #249 turned Kotlin Client red that way (run 43714730672).
# Without this tier a batch runs no local suites at all. Task #441.
[[tier]]
name = "batch"
suites = ["test-desktop"]

[on_red]
# A red CI run is rerun once (the whole run: MASON does not tell an infrastructure red from a real one).
ladder = ["rerun-failed", "blame-by-impact", "bisect", "ask"]
