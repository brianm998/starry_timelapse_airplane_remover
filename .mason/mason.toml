# SPDX-License-Identifier: GPL-3.0-or-later
# star's live MASON configuration for the shadow period, running beside starpipe: MASON claims only
# issues labelled `mason`. Inventory and decisions: brianm998/mason docs/stages/s27.md.
#
# Every suite runs through MASON's own queue (masond): no suite is wrapped in `starpipe heavy` any
# more. starpipe is a client of masond too (`mason run --pipeline starpipe`, ticket #169), so the two
# pipelines share one queue there, and a suite asks for the machine's own classes below.
#
# Two things in this file are temporary or undecided, and each can be found by searching:
#   `STAR_USE_GPU_FOR_MERGE=0`  the CPU-merge key every suite sets. star honours it for every caller
#                       (GPUCapability.mergeForcedOff; docs/decisions/0119, decision 4).
#   `UNMEASURED`        a minimum test count of 1 until the first shadow runs give a real one.
schema = 1
start = "explore"
# A ticket that carries a `## Plan` skips exploring (starpipe's plan.py).
explored_entry = "setup"

# Agent profiles. Sonnet by default; the deep tier is left out until the owner allows it
# (decision 4, "deep tier"). Add `[agent.deep] tier = "deep"` and point `develop` at it to allow it.
[agent.light]
tier = "light"
effort = "medium"

[agent.review]
tier = "light"
effort = "low"

[step.explore]
type = "agent"
category = "exploring"
agent = "light"
next = "setup"

# The worktree needs star's gitignored build artifacts; see scripts/link-artifacts.sh.
[step.setup]
type = "command"
category = "developing"
command = "bash .mason/scripts/link-artifacts.sh"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "light"
budget = "4h"
next = "test"

[step.test]
type = "test"
category = "testing"
# The suites that may run are the ones listed here (every [suite.*] table below, levels t0 and t1); MASON
# runs only a step's own list, and the bindings and impact map choose among them for the diff.
# Without this list the registration's `test =` command runs instead.
suites = [
  "t0-diff-check",
  "t0-i18n",
  "t0-pipeline-static",
  "t0-proto-sync",
  "t0-gherkin-generated",
  "build-logging",
  "build-StarCpp",
  "build-StarCore",
  "build-cli",
  "build-daemon",
  "build-trail_tools",
  "build-decision_tree_generator",
  "build-monitor",
  "build-gui",
  "build-desktop",
  "test-logging",
  "test-monitor",
  "test-StarCpp",
  "test-StarCpp-qos",
  "test-StarCpp-wgpu",
  "test-StarCore",
  "test-daemon",
  "test-cli",
  "test-trail_tools",
  "test-decision_tree_generator",
  "test-gherkin",
  "test-gui",
  "test-desktop",
  "test-pipeline",
]
max_rounds = 3
on_red = "develop"
next = "review"

[step.review]
type = "agent"
category = "review"
agent = "review"
max_rounds = 2
on_red = "develop"
next = "land"

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"

# The base branch's own CI (docs/decisions/0149 in brianm998/mason): MASON files the
# ticket when a workflow goes red on develop, and a red `pr-gate` freezes landing until it is green again.
# starpipe's watch_develop no longer files tickets (it keeps its baseline and stop_line for its own train).
# Gherkin is watched like the rest: its nightly now comes from .github/workflows/gherkin-nightly.yml (a GitHub schedule),
# and MASON files its reds through the long-red rule (about 3h after a red run ends). The agreement rule (2 runs),
# the long-red threshold (3h) and the cap (2 open, then proposed) are MASON's defaults, left unset.
[watch.ci]
enabled = true
gate = "pr-gate"
exclude = []

# Build fail_regex anchors "error: " to a diagnostic (line start or after ": "): a bare "error:" matched
# benign output (warning text, test names) and failed a build whose exit status was 0 (#598).
# Machine classes (masond's own, the ones starpipe's heavy jobs queue in too). `compile`: builds run side
# by side. `test-suite`: two test suites at a time beside builds. `exclusive`: the whole machine (star runs, the display-owning gui
# tests, Gherkin, and any suite that measures time, QoS or memory). The owner's resources.toml holds
# the real counts; these are the counts the definition asks for.
[resource.compile]
count = 3

# Two suites at once (#597, decision 0610): at one, test-suite waits were 27% of task time (1074 h in 7 days).
# Two still keeps the heavy ones (StarCore, daemon, desktop) from all running together, and the timing- and
# memory-sensitive suites stay on `exclusive`. The owner's resources.toml holds the real count and wins.
[resource.test-suite]
count = 2

[resource.exclusive]
count = 1

# ---------------------------------------------------------------------------------------------
# Levels: t0 is the cheap static tier, t1 the builds and unit suites (starpipe's `check` tiers).
# ---------------------------------------------------------------------------------------------
[binding.t0]
when = ["development", "test_step", "batch"]

[binding.t1]
when = ["test_step", "batch"]

# ---------------------------------------------------------------------------------------------
# Suites that stay on this Mac (`remote = false`, owner's decision, docs/decisions/1129). A node has
# no linked OpenCV or StarDecisionTrees (link-artifacts.sh links them from the main checkout, #1175),
# so nothing that builds StarCpp or a dependent can compile there; the desktop suites name Android
# Studio's JDK and the gui suites sign with the owner's certificate. Drop a line only once a node is
# provisioned for it. pipeline/tests/test_mason_toml_nodes.py pins this.
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# T0: static checks. Never heavy except proto-sync and the Gherkin generator (a build).
# ---------------------------------------------------------------------------------------------
[suite.t0-diff-check]
command = "export STAR_USE_GPU_FOR_MERGE=0 && git diff --check $(git merge-base HEAD origin/develop) && echo T0-DIFF-OK"
parser = "regex"
pass_regex = "^T0-DIFF-OK$"
level = "t0"

[suite.t0-i18n]
command = "export STAR_USE_GPU_FOR_MERGE=0 && python3 i18n/check.py && echo T0-I18N-OK"
parser = "regex"
pass_regex = "^T0-I18N-OK$"
level = "t0"

[suite.t0-pipeline-static]
# Local only: node marmot has no uv (exit 127, task #1131 run 6765). Remove once every node daemon's PATH has uv.
remote = false
command = "export STAR_USE_GPU_FOR_MERGE=0 && uv run --project pipeline ruff check pipeline && uv run --project pipeline pyright --project pipeline/pyproject.toml && echo T0-PIPELINE-OK"
parser = "regex"
pass_regex = "^T0-PIPELINE-OK$"
level = "t0"

[suite.t0-proto-sync]
remote = false # needs Android Studio's JAVA_HOME; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 JAVA_HOME=\"/Applications/Android Studio.app/Contents/jbr/Contents/Home\" star-desktop/gradlew -p star-desktop checkProtoSync --no-daemon 2>&1 && echo T0-PROTO-OK"
parser = "regex"
pass_regex = "^T0-PROTO-OK$"
level = "t0"
uses = { compile = 1 }

[suite.t0-gherkin-generated]
command = "env STAR_USE_GPU_FOR_MERGE=0 gherkin/generate.sh 2>&1 && git diff --exit-code -- gherkin && echo T0-GHERKIN-OK"
parser = "regex"
pass_regex = "^T0-GHERKIN-OK$"
level = "t0"
uses = { compile = 1 }

# ---------------------------------------------------------------------------------------------
# T1 builds (starpipe `build:*`). The dependents of a changed package are built too (impact map).
# ---------------------------------------------------------------------------------------------
[suite.build-logging]
command = "env STAR_USE_GPU_FOR_MERGE=0 swift build --disable-build-manifest-caching --package-path logging 2>&1 && echo BUILD-build-logging-OK"
parser = "regex"
pass_regex = "^BUILD-build-logging-OK$"
fail_regex = "(^|: )error: |Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-StarCpp]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 swift build --disable-build-manifest-caching --package-path StarCpp 2>&1 && echo BUILD-build-StarCpp-OK"
parser = "regex"
pass_regex = "^BUILD-build-StarCpp-OK$"
fail_regex = "(^|: )error: |Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-StarCore]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 swift build --disable-build-manifest-caching --package-path StarCore 2>&1 && echo BUILD-build-StarCore-OK"
parser = "regex"
pass_regex = "^BUILD-build-StarCore-OK$"
fail_regex = "(^|: )error: |Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-cli]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 swift build --disable-build-manifest-caching --package-path cli 2>&1 && echo BUILD-build-cli-OK"
parser = "regex"
pass_regex = "^BUILD-build-cli-OK$"
fail_regex = "(^|: )error: |Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-daemon]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 swift build --disable-build-manifest-caching --package-path daemon -c release 2>&1 && echo BUILD-build-daemon-OK"
parser = "regex"
pass_regex = "^BUILD-build-daemon-OK$"
fail_regex = "(^|: )error: |Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-trail_tools]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 swift build --disable-build-manifest-caching --package-path trail_tools 2>&1 && echo BUILD-build-trail_tools-OK"
parser = "regex"
pass_regex = "^BUILD-build-trail_tools-OK$"
fail_regex = "(^|: )error: |Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-decision_tree_generator]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 swift build --disable-build-manifest-caching --package-path decision_tree_generator 2>&1 && echo BUILD-build-decision_tree_generator-OK"
parser = "regex"
pass_regex = "^BUILD-build-decision_tree_generator-OK$"
fail_regex = "(^|: )error: |Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-monitor]
command = "env STAR_USE_GPU_FOR_MERGE=0 swift build --disable-build-manifest-caching --package-path pipeline/monitor 2>&1 && echo BUILD-build-monitor-OK"
parser = "regex"
pass_regex = "^BUILD-build-monitor-OK$"
fail_regex = "(^|: )error: |Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-gui]
remote = false # needs this Mac's signing identity; see "Suites that stay on this Mac"
# Builds the app only. It runs no tests, so it never touches the display.
# Signed with the owner's Apple Development certificate, not ad hoc (`-`): an ad-hoc build's identity is its
# cdhash, new every build, so the "access files on a removable volume" Allow (worktrees are on /Volumes/sp)
# never sticks. test-gui signs the same way. See LOCAL_SIGNING in pipeline/src/starpipe/adapter_star.py.
command = "env STAR_USE_GPU_FOR_MERGE=0 .mason/scripts/xcodebuild-signed.sh -project gui/star.xcodeproj -scheme star -configuration Debug -derivedDataPath .build/gui-dd build 2>&1 && .mason/scripts/check-gui-signing.sh && echo BUILD-build-gui-OK"
parser = "regex"
pass_regex = "^BUILD-build-gui-OK$"
fail_regex = "(^|: )error: |BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-desktop]
remote = false # needs Android Studio's JAVA_HOME; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 JAVA_HOME=\"/Applications/Android Studio.app/Contents/jbr/Contents/Home\" star-desktop/gradlew -p star-desktop compileKotlin compileTestKotlin --no-daemon 2>&1 && echo BUILD-build-desktop-OK"
parser = "regex"
pass_regex = "^BUILD-build-desktop-OK$"
fail_regex = "FAILURE: Build failed|(^|: )error: "
level = "t1"
uses = { compile = 1 }

# ---------------------------------------------------------------------------------------------
# T1 tests (starpipe `test:*`). Minimum counts are starpipe's own, from adapter_star.py's comments
# (StarCore 1,625, daemon 314, StarCpp 254). The others are floors from a static count of test functions.
# ---------------------------------------------------------------------------------------------
[suite.test-logging]
command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path logging 2>&1"
parser = "xctest"
min_tests = 60 # floor: ~90% of a static count of test functions (2026-11, #601)
level = "t1"
uses = { test-suite = 1 }

[suite.test-monitor]
command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path pipeline/monitor 2>&1"
parser = "xctest"
min_tests = 80 # floor: ~90% of a static count of test functions (2026-11, #601)
level = "t1"
uses = { test-suite = 1 }

# StarCpp: parallel, with the one class that measures QoS skipped here and run alone below.
[suite.test-StarCpp]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path StarCpp --filter StarCppBridgeTests --parallel --num-workers 8 --xunit-output .build/test-StarCpp.xml --skip OpenCVQoSTests 2>&1"
parser = "junit"
results_file = ".build/test-StarCpp.xml"
min_tests = 254
level = "t1"
uses = { test-suite = 1 }
# In a task's test step, only the XCTest classes the change needs (classes holding an edited line or naming a
# changed file). The whole suite runs once at landing instead: the batch tier in landing.toml (pr-gate runs no StarCpp tests).
narrow_command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path StarCpp --parallel --num-workers 8 --xunit-output .build/test-StarCpp.xml --skip OpenCVQoSTests {tests} 2>&1"
narrow_tests = "StarCpp/Tests/StarCppBridgeTests/*.swift"
narrow_split = "(?m)^\\s*(?:@\\w+\\s+)*(?:(?:public|internal|private|final|open)\\s+)*class (\\w+)\\s*:\\s*\\w*TestCase"
narrow_each = "--filter StarCppBridgeTests.{}"
narrow_never = ["StarCpp/Package.swift", "StarCpp/Package.resolved", "StarCpp/Tests/StarCppBridgeTests/KeypointFootprintMeasurement.swift"]
whole_later = "batch"

[suite.test-StarCpp-qos]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
# OpenCVQoSTests measures QoS-dependent worker counts: timing sensitivity. Any other load on the
# cores changes the counts it observes, so it keeps the whole machine (exclusive, kept on purpose).
command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path StarCpp --filter OpenCVQoSTests 2>&1"
parser = "xctest"
min_tests = 3 # floor: ~90% of a static count of test functions (2026-11, #601)
level = "t1"
uses = { exclusive = 1 }

# STAR_WGPU=1: the wgpu tests skip without it, and wgpu-native (wgpu/fetch.sh) is linked into
# worktrees by link-artifacts.sh. Measured 2026-11-14: 20 tests, 2 benchmarks skipped (STAR_WGPU_BENCH),
# 18 run. The two Metal comparisons hold to the CPU bounds when the CPU merge is forced (#352).
[suite.test-StarCpp-wgpu]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 STAR_WGPU=1 swift test --disable-build-manifest-caching --package-path StarCpp --filter StarCppWGPUTests 2>&1"
parser = "xctest"
min_tests = 18
level = "t1"
uses = { test-suite = 1 }

# StarCore and daemon run as class shards (scripts/shards.py): one build, several `xcrun xctest`
# processes, JUnit out. A class named in no shard runs in the catch-all shard, so none is lost.
[suite.test-StarCore]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 python3 .mason/scripts/shards.py --package-path StarCore --junit .build/test-StarCore.xml --workers 8 --shard HorizonConsensusTests --shard VideoFrameSourceTests --shard TemporalHorizonDetectorTests,FullFrameBlobberIdentityTests,VideoConvertTests --serial-shard MemoryMonitorTests 2>&1"
parser = "junit"
results_file = ".build/test-StarCore.xml"
min_tests = 1550 # measured 1563 test cases on 2026-11-11; 1625 was unreachable
level = "t1"
uses = { test-suite = 1 }
# In a task's test step, only the XCTest classes the change needs (classes holding an edited line or naming a
# changed file). The whole suite runs once at landing instead: pr-gate.yml:255 and :332 run the whole package.
narrow_command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path StarCore --parallel --xunit-output .build/test-StarCore.xml {tests} 2>&1"
narrow_tests = "StarCore/Tests/StarCoreTests/*.swift"
narrow_split = "(?m)^\\s*(?:@\\w+\\s+)*(?:(?:public|internal|private|final|open)\\s+)*class (\\w+)\\s*:\\s*\\w*TestCase"
narrow_each = "--filter StarCoreTests.{}"
narrow_never = ["StarCore/Package.swift", "StarCore/Package.resolved", "StarCore/Tests/StarCoreTests/FrameHarness.swift", "StarCore/Tests/StarCoreTests/Legacy*.swift", "StarCore/Tests/StarCoreTests/*Measurement.swift", "StarCore/Tests/StarCoreTests/StuckExtractionRepro.swift"]
# The narrowed run is plain `swift test --parallel` (no class shards: the junit file then holds just the narrowed cases).
# The smoke classes are the whole-tree guards that must run on every StarCore change.
narrow_smoke = ["LocalizationTests", "ConfigRoundTripTests", "ArtifactInputsTests"]
whole_later = "ci" # pr-gate.yml:255 (static job, StarCore package tests) and :332 (macos job)

[suite.test-daemon]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 python3 .mason/scripts/shards.py --package-path daemon --junit .build/test-daemon.xml --workers 8 --shard ExportSequenceTests --shard ExportVideoAudioTests,SessionConfigPersistenceTests --serial-shard BackgroundExtractionSessionTests 2>&1"
parser = "junit"
results_file = ".build/test-daemon.xml"
min_tests = 313 # measured 2026-11-12: 316 test cases, 3 skipped, 313 run; the junit count excludes skips
level = "t1"
uses = { test-suite = 1 }
# In a task's test step, only the XCTest classes the change needs (classes holding an edited line or naming a
# changed file). The whole suite runs once at landing instead: pr-gate.yml:258 runs the whole package.
narrow_command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path daemon --parallel --xunit-output .build/test-daemon.xml {tests} 2>&1"
narrow_tests = "daemon/Tests/StarDaemonTests/*.swift"
narrow_split = "(?m)^\\s*(?:@\\w+\\s+)*(?:(?:public|internal|private|final|open)\\s+)*class (\\w+)\\s*:\\s*\\w*TestCase"
narrow_each = "--filter StarDaemonTests.{}"
narrow_never = ["daemon/Package.swift", "daemon/Package.resolved", "daemon/Tests/StarDaemonTests/TestTimeout.swift", "daemon/Tests/StarDaemonTests/ExportEndToEndTestCase.swift", "daemon/proto/**"]
whole_later = "ci" # pr-gate.yml:258 (daemon package tests)

[suite.test-cli]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path cli --skip GherkinTests 2>&1"
parser = "xctest"
min_tests = 70 # floor: ~90% of the 78 starTests functions on develop (GherkinTests is skipped and not counted; #937)
level = "t1"
uses = { test-suite = 1 }
# In a task's test step, only the XCTest classes the change needs (classes holding an edited line or naming a
# changed file). The whole suite runs once at landing instead: the batch tier in landing.toml (pr-gate runs no cli tests).
narrow_command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path cli --skip GherkinTests {tests} 2>&1"
narrow_tests = "cli/Tests/starTests/*.swift"
narrow_split = "(?m)^\\s*(?:@\\w+\\s+)*(?:(?:public|internal|private|final|open)\\s+)*class (\\w+)\\s*:\\s*\\w*TestCase"
narrow_each = "--filter starTests.{}"
narrow_never = ["cli/Package.swift", "cli/Package.resolved"]
whole_later = "batch"

[suite.test-trail_tools]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path trail_tools 2>&1"
parser = "xctest"
min_tests = 22 # floor: ~90% of a static count of test functions (2026-11, #601)
level = "t1"
uses = { test-suite = 1 }

[suite.test-decision_tree_generator]
remote = false # needs the linked OpenCV/StarDecisionTrees artifacts; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path decision_tree_generator 2>&1"
parser = "xctest"
min_tests = 1 # floor: ~90% of a static count of test functions (2026-11, #601)
level = "t1"
uses = { test-suite = 1 }

# The Gherkin step-coverage package: it needs the machine to itself (EXCLUSIVE_TEST_MARKERS).
# Why exclusive (kept on purpose): memory and timing. Its scenarios run the full star pipeline on
# image sequences, holding many GB resident (peak compressor size is the OOM signal here), and
# beside another suite they swap and miss their deadlines.
[suite.test-gherkin]
command = "env STAR_USE_GPU_FOR_MERGE=0 swift test --disable-build-manifest-caching --package-path gherkin/StarGherkin 2>&1"
parser = "xctest"
min_tests = 1 # floor: ~90% of a static count of test functions (2026-11, #601)
level = "t1"
uses = { exclusive = 1 }

# The macOS gui's unit tests only: `-only-testing:starTests`. NEVER starUITests (they drive the real
# mouse and wake the display; those stay on CI), and never wrap this in `caffeinate -d -u`, whose
# `-u` turns a sleeping display on. It needs no display: StarMain hosts it in a background-only app.
# One test-suite slot, not the whole machine (#467): the only reason it was exclusive was that
# starpipe classes every `xcodebuild test` that way. starTests is hosted in a background-only app
# with no windows, drives no mouse or keyboard, and asserts no time budget, so it needs neither the
# display nor the cores. The display stays untouched whatever the share.
[suite.test-gui]
remote = false # needs this Mac's signing identity; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 .mason/scripts/xcodebuild-signed.sh -project gui/star.xcodeproj -scheme star -configuration Debug -derivedDataPath .build/gui-dd -only-testing:starTests test 2>&1"
parser = "xctest"
min_tests = 340 # floor: ~90% of a static count of test functions (2026-11, #601)
level = "t1"
uses = { test-suite = 1 }
# In a task's test step, only the XCTest classes the change needs (MASON s386): classes holding an
# edited line, or naming a changed file. Nothing before landing runs these tests whole: pr-gate has no xcodebuild
# (its macOS job runs only the StarCore and daemon package tests), so the batch tier in landing.toml runs them whole once
# per batch (whole_later = "batch"). Shared code, the project, assets and strings run the smoke classes in a task's test step.
narrow_command = "env STAR_USE_GPU_FOR_MERGE=0 .mason/scripts/xcodebuild-signed.sh -project gui/star.xcodeproj -scheme star -configuration Debug -derivedDataPath .build/gui-dd {tests} test 2>&1"
narrow_tests = "gui/starTests/*.swift"
narrow_split = "(?m)^(?:@MainActor\\s+)?(?:final )?class (\\w+)\\s*:\\s*XCTestCase"
narrow_each = "-only-testing:starTests/{}"
narrow_never = ["gui/star.xcodeproj/**", "gui/Assets.xcassets/**", "gui/star/Info.plist", "gui/star/*.entitlements", "StarCore/**", "StarCpp/**", "logging/**", "i18n/**"]
narrow_smoke = ["NoHardCodedStringsTests", "IdRegistryTests"]
whole_later = "batch"

[suite.test-desktop]
remote = false # needs Android Studio's JAVA_HOME; see "Suites that stay on this Mac"
command = "env STAR_USE_GPU_FOR_MERGE=0 JAVA_HOME=\"/Applications/Android Studio.app/Contents/jbr/Contents/Home\" star-desktop/gradlew -p star-desktop test --rerun --no-daemon 2>&1"
parser = "junit"
# results_file is a literal path, not a glob: MASON reads it with fs::read.
results_file = "star-desktop/build/test-results/test-all.xml"
min_tests = 700 # floor: ~90% of a static count of test functions (2026-11, #601)
level = "t1"
# One test-suite slot, not the whole machine (2026-11-14): the tests run with java.awt.headless=true,
# the Compose UI tests render offscreen, and no test asserts a time budget (only 30-120 s deadlines).
# As `exclusive` it drained the machine for every desktop change.
uses = { test-suite = 1 }
# In a task's test step, only the test classes the change needs (MASON s386): edited test files, and
# tests that name a changed file. The landing batch also runs them all, whole, because of the
# `batch` tier in landing.toml (task #441), and pr-gate.yml:204 runs `gradlew test` whole. Build files, resources, strings
# and the proto run them all.
narrow_command = "env STAR_USE_GPU_FOR_MERGE=0 JAVA_HOME=\"/Applications/Android Studio.app/Contents/jbr/Contents/Home\" star-desktop/gradlew -p star-desktop test {tests} --rerun --no-daemon 2>&1"
narrow_tests = "star-desktop/src/test/kotlin/**/*Test.kt"
narrow_root = "star-desktop/src/test/kotlin/"
narrow_each = "--tests {}"
narrow_never = ["star-desktop/*.kts", "star-desktop/gradle/**", "star-desktop/gradle.properties", "star-desktop/src/main/resources/**", "star-desktop/src/test/resources/**", "daemon/proto/**", "i18n/**"]
narrow_smoke = ["com.star.desktop.ui.NoHardCodedStringsTest", "com.star.desktop.ui.app.IdRegistryTest", "com.star.desktop.ui.components.StarArtTest"]
whole_later = "ci" # pr-gate.yml:204 (desktop job, gradlew test on both OSes)

[suite.test-pipeline]
# Local only: node marmot has no uv (exit 127, task #1131 run 6765). Remove once every node daemon's PATH has uv.
remote = false
command = "cd pipeline && STAR_USE_GPU_FOR_MERGE=0 uv run pytest -v 2>&1"
parser = "pytest"
min_tests = 480 # floor: ~90% of a static count of test functions (2026-11, #601)
level = "t1"
# In a task's test step, only the test files the change reaches: files edited, or naming the changed module's stem
# (`adapter_star` for pipeline/src/starpipe/adapter_star.py). pr-gate.yml:163 runs `uv run pytest -q` whole.
narrow_command = "cd pipeline && STAR_USE_GPU_FOR_MERGE=0 uv run pytest -v {tests} 2>&1"
narrow_tests = "pipeline/tests/**/test_*.py"
narrow_root = "pipeline/"
narrow_each = "{}"
narrow_never = ["pipeline/pyproject.toml", "pipeline/uv.lock", "pipeline/tests/conftest.py"]
whole_later = "ci" # pr-gate.yml:163 (static job, uv run pytest)

# ---------------------------------------------------------------------------------------------
# Impact map. Entries are unioned and an unmapped path selects every suite, so a package's path
# names its own tests and the builds of everything downstream of it (logging -> StarCpp -> StarCore
# -> cli, daemon, gui). Paths that need no check map to nothing, as starpipe's NO_CHECK_* did.
# Difference from starpipe: its i18n-only rule skipped the StarCore tests, but a union cannot take
# a path out of `StarCore/**`, so a catalogue change here also runs test-StarCore (stricter, slower).
# ---------------------------------------------------------------------------------------------
[impact]
"logging/**" = ["test-logging", "build-logging", "build-StarCpp", "build-StarCore", "build-cli", "build-daemon", "build-gui"]
"StarCpp/**" = ["test-StarCpp", "test-StarCpp-qos", "test-StarCpp-wgpu", "build-StarCpp", "build-StarCore", "build-cli", "build-daemon", "build-gui"]
"StarCore/**" = ["test-StarCore", "build-StarCore", "build-cli", "build-daemon", "build-gui"]
"StarCore/Sources/StarCore/Resources/Localizations/**" = ["t0-i18n"]
"cli/**" = ["test-cli", "build-cli"]
"gherkin/**" = ["t0-gherkin-generated"]
"gherkin/StarGherkin/**" = ["test-gherkin"]
"gherkin/steps.json" = ["test-gherkin"]
"gherkin/features/**" = ["test-gherkin"]
"gherkin/generated/**" = ["test-gherkin"]
"daemon/**" = ["test-daemon", "build-daemon"]
"daemon/proto/**" = ["build-desktop", "t0-proto-sync"]
# gui/ is listed by subtree and file, not `gui/**`: the map is a union, so a gui/** entry would pull test-gui
# in for the release shell scripts too (t485). Shell scripts and entitlements map to nothing.
"gui/star/**" = ["test-gui", "build-gui"]
"gui/starTests/**" = ["test-gui", "build-gui"]
"gui/starUITests/**" = ["test-gui", "build-gui"]
"gui/star.xcodeproj/**" = ["test-gui", "build-gui"]
"gui/Assets.xcassets/**" = ["test-gui", "build-gui"]
"gui/images/**" = ["test-gui", "build-gui"]
"gui/mri" = ["test-gui", "build-gui"]
"gui/Info.plist" = ["test-gui", "build-gui"]
"gui/Makefile" = ["test-gui", "build-gui"]
"gui/appstore.xcconfig" = ["test-gui", "build-gui"]
"gui/star_works.json" = ["test-gui", "build-gui"]
"gui/.star_custom_processing_steps.json" = ["test-gui", "build-gui"]
"gui/.periphery.yml" = ["test-gui", "build-gui"]
"gui/*.sh" = []
"gui/*.entitlements.plist" = []
"gui/app_specific_password.txt" = []
"star-desktop/**" = ["test-desktop", "build-desktop", "t0-proto-sync"]
"trail_tools/**" = ["test-trail_tools", "build-trail_tools"]
"decision_tree_generator/**" = ["test-decision_tree_generator", "build-decision_tree_generator"]
"pipeline/**" = ["test-pipeline", "t0-pipeline-static"]
"pipeline/monitor/**" = ["test-monitor", "build-monitor"]
"i18n/**" = ["t0-i18n"]
".claude/**" = []
# MASON configuration and exit scripts: pipeline tooling, no star code to build or run on a GPU.
".mason/**" = ["test-pipeline", "t0-pipeline-static"]
"scripts/**" = ["test-pipeline", "t0-pipeline-static"]
"CLAUDE.md" = []
".github/**" = []
"docs/**" = []
"plans/**" = []
"ffmpeg/**" = []
"opencv/**" = []
"wgpu/**" = []
"external_binaries/**" = []
"StarDecisionTrees/**" = []
"logging-objc/**" = []
"removal_tools/**" = []
"horizon_test_bench/**" = []
"outlier_feature_data_classifier/**" = []
"tile_extractor/**" = []
"tools/**" = []
"packaging/**" = []
"demo_videos/**" = []
"test_data/**" = []
# Paths every task touches that run no code of their own. Unmapped, each selected every suite
# (~2,300 tests a round): on 2026-11-12, 10 of 13 star task branches ran everything only for these.
"scripts/exit/**" = []   # each task's own exit script; no suite runs them (scripts/** above still adds the pipeline suites)
"art/**" = []            # source art and its export script; exported images land under gui/ and star-desktop/, which are mapped
".gitattributes" = []
"**/*.md" = []
"emacs_load_swift.sh" = []
