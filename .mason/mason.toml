# SPDX-License-Identifier: GPL-3.0-or-later
# star's live MASON configuration for the shadow period, running beside starpipe: MASON claims only
# issues labelled `mason`. Inventory and decisions: brianm998/mason docs/stages/s27.md.
#
# Three things in this file are temporary or undecided, and each can be found by searching:
#   `s27-shadow`        a suite that runs through `pipeline/bin/starpipe heavy --`, so MASON and
#                       starpipe share one queue while both run. Remove the wrapper at the switch.
#   `STAR_USE_GPU_FOR_MERGE=0`  the CPU-merge key every suite sets. star honours it for every caller
#                       (GPUCapability.mergeForcedOff; docs/decisions/0119, decision 4).
#   `UNMEASURED`        a minimum test count of 1 until the first shadow runs give a real one.
schema = 1
start = "explore"
# A ticket that carries a `## Plan` skips exploring (starpipe's plan.py).
explored_entry = "setup"

# Agent profiles. Sonnet by default; the deep tier is left out until the owner allows it
# (decision 4, "deep tier"). Add `[agent.deep] tier = "deep"` and point `develop` at it to allow it.
[agent.light]
tier = "light"
effort = "medium"

[agent.review]
tier = "light"
effort = "low"

[step.explore]
type = "agent"
category = "exploring"
agent = "light"
next = "setup"

# The worktree needs star's gitignored build artifacts; see scripts/link-artifacts.sh.
[step.setup]
type = "command"
category = "developing"
command = "bash .mason/scripts/link-artifacts.sh"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "light"
budget = "4h"
next = "test"

[step.test]
type = "test"
category = "testing"
# The suites that may run are the ones listed here (every [suite.*] table below, levels t0 and t1); MASON
# runs only a step's own list, and the bindings and impact map choose among them for the diff.
# Without this list the registration's `test =` command runs instead.
suites = [
  "t0-diff-check",
  "t0-i18n",
  "t0-pipeline-static",
  "t0-proto-sync",
  "t0-gherkin-generated",
  "build-logging",
  "build-StarCpp",
  "build-StarCore",
  "build-cli",
  "build-daemon",
  "build-trail_tools",
  "build-decision_tree_generator",
  "build-monitor",
  "build-gui",
  "build-desktop",
  "test-logging",
  "test-monitor",
  "test-StarCpp",
  "test-StarCpp-qos",
  "test-StarCpp-wgpu",
  "test-StarCore",
  "test-daemon",
  "test-cli",
  "test-trail_tools",
  "test-decision_tree_generator",
  "test-gherkin",
  "test-gui",
  "test-desktop",
  "test-pipeline",
]
max_rounds = 3
on_red = "develop"
next = "review"

[step.review]
type = "agent"
category = "review"
agent = "review"
max_rounds = 2
on_red = "develop"
next = "land"

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"

# Machine classes (starpipe's heavy.py classes). `compile`: builds run side by side. `test`: one test
# suite at a time beside builds. `exclusive`: the whole machine (star runs, the display-owning gui
# tests, Gherkin, and any suite that measures time, QoS or memory). The owner's resources.toml holds
# the real counts; these are the counts the definition asks for.
[resource.compile]
count = 3

[resource.test]
count = 1

[resource.exclusive]
count = 1

# ---------------------------------------------------------------------------------------------
# Levels: t0 is the cheap static tier, t1 the builds and unit suites (starpipe's `check` tiers).
# ---------------------------------------------------------------------------------------------
[binding.t0]
when = ["development", "test_step", "batch"]

[binding.t1]
when = ["test_step", "batch"]

# ---------------------------------------------------------------------------------------------
# T0: static checks. Never heavy except proto-sync and the Gherkin generator (a build).
# ---------------------------------------------------------------------------------------------
[suite.t0-diff-check]
command = "export STAR_USE_GPU_FOR_MERGE=0 && git diff --check $(git merge-base HEAD origin/develop) && echo T0-DIFF-OK"
parser = "regex"
pass_regex = "^T0-DIFF-OK$"
level = "t0"

[suite.t0-i18n]
command = "export STAR_USE_GPU_FOR_MERGE=0 && python3 i18n/check.py && echo T0-I18N-OK"
parser = "regex"
pass_regex = "^T0-I18N-OK$"
level = "t0"

[suite.t0-pipeline-static]
command = "export STAR_USE_GPU_FOR_MERGE=0 && uv run --project pipeline ruff check pipeline && uv run --project pipeline pyright --project pipeline/pyproject.toml && echo T0-PIPELINE-OK"
parser = "regex"
pass_regex = "^T0-PIPELINE-OK$"
level = "t0"

[suite.t0-proto-sync]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 JAVA_HOME=\"/Applications/Android Studio.app/Contents/jbr/Contents/Home\" star-desktop/gradlew -p star-desktop checkProtoSync --no-daemon 2>&1 && echo T0-PROTO-OK"
parser = "regex"
pass_regex = "^T0-PROTO-OK$"
level = "t0"
uses = { compile = 1 }

[suite.t0-gherkin-generated]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 gherkin/generate.sh 2>&1 && git diff --exit-code -- gherkin && echo T0-GHERKIN-OK"
parser = "regex"
pass_regex = "^T0-GHERKIN-OK$"
level = "t0"
uses = { compile = 1 }

# ---------------------------------------------------------------------------------------------
# T1 builds (starpipe `build:*`). The dependents of a changed package are built too (impact map).
# ---------------------------------------------------------------------------------------------
[suite.build-logging]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift build --package-path logging 2>&1"
parser = "regex"
fail_regex = "error:|Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-StarCpp]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift build --package-path StarCpp 2>&1"
parser = "regex"
fail_regex = "error:|Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-StarCore]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift build --package-path StarCore 2>&1"
parser = "regex"
fail_regex = "error:|Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-cli]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift build --package-path cli 2>&1"
parser = "regex"
fail_regex = "error:|Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-daemon]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift build --package-path daemon -c release 2>&1"
parser = "regex"
fail_regex = "error:|Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-trail_tools]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift build --package-path trail_tools 2>&1"
parser = "regex"
fail_regex = "error:|Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-decision_tree_generator]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift build --package-path decision_tree_generator 2>&1"
parser = "regex"
fail_regex = "error:|Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-monitor]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift build --package-path pipeline/monitor 2>&1"
parser = "regex"
fail_regex = "error:|Compiling failed|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-gui]
# s27-shadow: remove at the switch
# Builds the app only. It runs no tests, so it never touches the display.
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 xcodebuild -project gui/star.xcodeproj -scheme star -configuration Debug -derivedDataPath .build/gui-dd CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build 2>&1"
parser = "regex"
fail_regex = "error:|BUILD FAILED"
level = "t1"
uses = { compile = 1 }

[suite.build-desktop]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 JAVA_HOME=\"/Applications/Android Studio.app/Contents/jbr/Contents/Home\" star-desktop/gradlew -p star-desktop compileKotlin compileTestKotlin --no-daemon 2>&1"
parser = "regex"
fail_regex = "FAILURE: Build failed|error:"
level = "t1"
uses = { compile = 1 }

# ---------------------------------------------------------------------------------------------
# T1 tests (starpipe `test:*`). Minimum counts are starpipe's own, from adapter_star.py's comments
# (StarCore 1,625, daemon 314, StarCpp 254). Every other count is UNMEASURED: 1 until shadow runs.
# ---------------------------------------------------------------------------------------------
[suite.test-logging]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift test --package-path logging 2>&1"
parser = "xctest"
min_tests = 1 # UNMEASURED
level = "t1"
uses = { test = 1 }

[suite.test-monitor]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift test --package-path pipeline/monitor 2>&1"
parser = "xctest"
min_tests = 1 # UNMEASURED
level = "t1"
uses = { test = 1 }

# StarCpp: parallel, with the one class that measures QoS skipped here and run alone below.
[suite.test-StarCpp]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift test --package-path StarCpp --filter StarCppBridgeTests --parallel --num-workers 8 --xunit-output .build/test-StarCpp.xml --skip OpenCVQoSTests 2>&1"
parser = "junit"
results_file = ".build/test-StarCpp.xml"
min_tests = 254
level = "t1"
uses = { test = 1 }

[suite.test-StarCpp-qos]
# s27-shadow: remove at the switch
# OpenCVQoSTests measures QoS-dependent worker counts: never beside other tests.
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift test --package-path StarCpp --filter OpenCVQoSTests 2>&1"
parser = "xctest"
min_tests = 1 # UNMEASURED
level = "t1"
uses = { exclusive = 1 }

[suite.test-StarCpp-wgpu]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift test --package-path StarCpp --filter StarCppWGPUTests 2>&1"
parser = "xctest"
min_tests = 1 # UNMEASURED
level = "t1"
uses = { test = 1 }

# StarCore and daemon run as class shards (scripts/shards.py): one build, several `xcrun xctest`
# processes, JUnit out. A class named in no shard runs in the catch-all shard, so none is lost.
[suite.test-StarCore]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 python3 .mason/scripts/shards.py --package-path StarCore --junit .build/test-StarCore.xml --workers 8 --shard HorizonConsensusTests --shard VideoFrameSourceTests --shard TemporalHorizonDetectorTests,FullFrameBlobberIdentityTests,VideoConvertTests --serial-shard MemoryMonitorTests 2>&1"
parser = "junit"
results_file = ".build/test-StarCore.xml"
min_tests = 1625
level = "t1"
uses = { test = 1 }

[suite.test-daemon]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 python3 .mason/scripts/shards.py --package-path daemon --junit .build/test-daemon.xml --workers 8 --shard ExportSequenceTests --shard ExportVideoAudioTests,SessionConfigPersistenceTests --serial-shard BackgroundExtractionSessionTests 2>&1"
parser = "junit"
results_file = ".build/test-daemon.xml"
min_tests = 314
level = "t1"
uses = { test = 1 }

[suite.test-cli]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift test --package-path cli --skip GherkinTests 2>&1"
parser = "xctest"
min_tests = 1 # UNMEASURED
level = "t1"
uses = { test = 1 }

[suite.test-trail_tools]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift test --package-path trail_tools 2>&1"
parser = "xctest"
min_tests = 1 # UNMEASURED
level = "t1"
uses = { test = 1 }

[suite.test-decision_tree_generator]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift test --package-path decision_tree_generator 2>&1"
parser = "xctest"
min_tests = 1 # UNMEASURED
level = "t1"
uses = { test = 1 }

# The Gherkin step-coverage package: it needs the machine to itself (EXCLUSIVE_TEST_MARKERS).
[suite.test-gherkin]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 swift test --package-path gherkin/StarGherkin 2>&1"
parser = "xctest"
min_tests = 1 # UNMEASURED
level = "t1"
uses = { exclusive = 1 }

# The macOS gui's unit tests only: `-only-testing:starTests`. NEVER starUITests (they drive the real
# mouse and wake the display; those stay on CI), and never wrap this in `caffeinate -d -u`, whose
# `-u` turns a sleeping display on. It needs no display: StarMain hosts it in a background-only app.
# Exclusive because starpipe classes every `xcodebuild test` that way.
[suite.test-gui]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 xcodebuild -project gui/star.xcodeproj -scheme star -configuration Debug -derivedDataPath .build/gui-dd CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= -only-testing:starTests test 2>&1"
parser = "xctest"
min_tests = 1 # UNMEASURED
level = "t1"
uses = { exclusive = 1 }

[suite.test-desktop]
# s27-shadow: remove at the switch
command = "pipeline/bin/starpipe heavy -- env STAR_USE_GPU_FOR_MERGE=0 JAVA_HOME=\"/Applications/Android Studio.app/Contents/jbr/Contents/Home\" star-desktop/gradlew -p star-desktop test --no-daemon 2>&1"
parser = "junit"
results_file = "star-desktop/build/test-results/test/*.xml"
min_tests = 1 # UNMEASURED
level = "t1"
uses = { exclusive = 1 }

[suite.test-pipeline]
command = "cd pipeline && STAR_USE_GPU_FOR_MERGE=0 uv run pytest -q 2>&1"
parser = "pytest"
min_tests = 1 # UNMEASURED
level = "t1"

# ---------------------------------------------------------------------------------------------
# Impact map. Entries are unioned and an unmapped path selects every suite, so a package's path
# names its own tests and the builds of everything downstream of it (logging -> StarCpp -> StarCore
# -> cli, daemon, gui). Paths that need no check map to nothing, as starpipe's NO_CHECK_* did.
# Difference from starpipe: its i18n-only rule skipped the StarCore tests, but a union cannot take
# a path out of `StarCore/**`, so a catalogue change here also runs test-StarCore (stricter, slower).
# ---------------------------------------------------------------------------------------------
[impact]
"logging/**" = ["test-logging", "build-logging", "build-StarCpp", "build-StarCore", "build-cli", "build-daemon", "build-gui"]
"StarCpp/**" = ["test-StarCpp", "test-StarCpp-qos", "test-StarCpp-wgpu", "build-StarCpp", "build-StarCore", "build-cli", "build-daemon", "build-gui"]
"StarCore/**" = ["test-StarCore", "build-StarCore", "build-cli", "build-daemon", "build-gui"]
"StarCore/Sources/StarCore/Resources/Localizations/**" = ["t0-i18n"]
"cli/**" = ["test-cli", "build-cli"]
"gherkin/**" = ["t0-gherkin-generated"]
"gherkin/StarGherkin/**" = ["test-gherkin"]
"gherkin/steps.json" = ["test-gherkin"]
"gherkin/features/**" = ["test-gherkin"]
"gherkin/generated/**" = ["test-gherkin"]
"daemon/**" = ["test-daemon", "build-daemon"]
"daemon/proto/**" = ["build-desktop", "t0-proto-sync"]
"gui/**" = ["test-gui", "build-gui"]
"star-desktop/**" = ["test-desktop", "build-desktop", "t0-proto-sync"]
"trail_tools/**" = ["test-trail_tools", "build-trail_tools"]
"decision_tree_generator/**" = ["test-decision_tree_generator", "build-decision_tree_generator"]
"pipeline/**" = ["test-pipeline", "t0-pipeline-static"]
"pipeline/monitor/**" = ["test-monitor", "build-monitor"]
"i18n/**" = ["t0-i18n"]
".claude/**" = []
".github/**" = []
"docs/**" = []
"plans/**" = []
"ffmpeg/**" = []
"opencv/**" = []
"wgpu/**" = []
"external_binaries/**" = []
"StarDecisionTrees/**" = []
"logging-objc/**" = []
"removal_tools/**" = []
"horizon_test_bench/**" = []
"outlier_feature_data_classifier/**" = []
"tile_extractor/**" = []
"tools/**" = []
"packaging/**" = []
"demo_videos/**" = []
"test_data/**" = []
"**/*.md" = []
"emacs_load_swift.sh" = []
