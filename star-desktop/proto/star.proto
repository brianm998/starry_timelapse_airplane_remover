syntax = "proto3";
package star.v1;

// Swift daemon uses swift_prefix; Java/Kotlin uses java_package + java_multiple_files.
option swift_prefix       = "Star_V1_";
option java_package       = "com.star.proto";
option java_multiple_files = true;

// ---- Transport ----

message Envelope {
  uint64 id = 1;
  Kind   kind    = 2;
  string method  = 3;
  bytes  payload = 4;
  string error   = 5;
  int32  error_code = 6;

  enum Kind {
    REQUEST      = 0;
    RESPONSE     = 1;
    ERROR        = 2;
    STREAM_ITEM  = 3;
    STREAM_END   = 4;
    CANCEL       = 5;
    NOTIFICATION = 6;
  }
}

// ---- Daemon ----

message HelloRequest  { string client_version = 1; }
message HelloResponse { string daemon_version = 1; string scratch_dir = 2; }
message ShutdownRequest {}
message ShutdownResponse {}

// ---- Session ----

message OpenVideoRequest    { string video_path = 1; Config initial_config = 2; }
message OpenSequenceRequest { string sequence_dir = 1; Config initial_config = 2; }
message OpenConfigRequest   { string config_json_path = 1; }

message OpenProgress {
  oneof kind {
    IoProgress   progress = 1;
    SessionInfo  done     = 2;
  }
}

// Encode settings. codec/encoder/pixel_format/muxer are StarCore FFmpeg* enum rawValue strings.
// frame_rate is FrameRate.rawValue (double). An empty string field means "use the session config default".
message VideoEncodeSettings {
  double frame_rate   = 1;  // e.g. 24, 29.97, 30, 60
  string codec        = 2;  // FFmpegCodec.rawValue
  string encoder      = 3;  // FFmpegEncoder.rawValue
  string pixel_format = 4;  // FFmpegPixelFormat.rawValue
  string muxer        = 5;  // FFmpegMuxer.rawValue — also the output container extension
}

// Mirrors StarCore.VideoInfo.
message VideoInfo {
  VideoEncodeSettings settings  = 1;
  bool                has_audio = 2;
}

message SessionInfo {
  string    session_id            = 1;
  int32     frame_count           = 2;
  int32     image_width           = 3;
  int32     image_height          = 4;
  int32     components_per_pixel  = 5;
  Config    config                = 6;
  string    scratch_session_dir   = 7;
  VideoInfo source_video_info     = 8;  // set iff opened from a video (Session.OpenVideo); else default
}

message CloseSessionRequest  { string session_id = 1; }
message CloseSessionResponse {}
message ListSessionsRequest  {}
message ListSessionsResponse { repeated SessionInfo sessions = 1; }
message SessionRef           { string session_id = 1; }

// ---- Config ----

message UpdateConfigRequest { string session_id = 1; Config config = 2; }

message Config {
  string        output_path                              = 1;
  string        temp_output_path                         = 2;
  CleanMethod   clean_method                             = 3;
  DetectionType detection_type                           = 4;
  bool          horizon_detection_enabled                = 5;
  bool          tripod_head_was_moving                   = 6;
  int32         number_of_frames_to_process_concurrently = 7;
  int32         ignore_lower_pixels                      = 8;   // -1 = unset
  map<int32, CleanMethod> pixel_replacement_overrides    = 9;
  map<int32, int32>       static_neighbor_frame_overrides   = 10;
  map<int32, int32>       aligned_neighbor_frame_overrides  = 11;
  bool                    write_outlier_group_files          = 12;
  bool                    write_frame_preview_files          = 13;
  VideoEncodeSettings     video                             = 14;  // persisted encode settings
}

enum CleanMethod {
  CLEAN_AUTOMATIC      = 0;
  CLEAN_AUTOMATIC_TRUE = 1;
  CLEAN_SELECTIVE      = 2;
}

enum DetectionType {
  DETECTION_MILD      = 0;
  DETECTION_STRONG    = 1;
  DETECTION_STRONGER  = 2;
  DETECTION_EXCESSIVE = 3;
  DETECTION_CUSTOM    = 4;
}

// ---- Frame ----

message FrameRef { string session_id = 1; int32 frame_index = 2; }

message FrameInfo {
  int32                frame_index             = 1;
  FrameProcessingState state                   = 2;
  int32                num_positive_outliers   = 3;
  int32                num_negative_outliers   = 4;
  int32                num_undecided_outliers  = 5;
  CleanMethod          clean_method            = 6;
}

message GetFramePreviewRequest {
  string        session_id  = 1;
  int32         frame_index = 2;
  FrameViewMode view_mode   = 3;
}

enum FrameViewMode {
  VIEW_ORIGINAL    = 0;
  VIEW_PROCESSED   = 1;
  VIEW_SUBTRACTION = 2;
  VIEW_VALIDATION  = 3;
}

message ImageRef { string path = 1; int32 width = 2; int32 height = 3; string format = 4; }

message SetFrameCleanMethodRequest {
  string      session_id  = 1;
  int32       frame_index = 2;
  CleanMethod clean_method = 3;
}

enum FrameProcessingState {
  FPS_UNPROCESSED                 = 0;
  FPS_HORIZON_DETECTION           = 1;
  FPS_HORIZON_DETECTED            = 2;
  FPS_MERGING_HORIZON             = 3;
  FPS_EARTH_ALIGNMENT_START       = 4;
  FPS_EARTH_ALIGNMENT_BASE_KP     = 5;
  FPS_EARTH_ALIGNMENT_BASE_KP_DONE = 6;
  FPS_EARTH_ALIGNMENT_ALIGNING    = 7;
  FPS_EARTH_ALIGNMENT_LOADING     = 8;
  FPS_EARTH_ALIGNMENT_COMPLETE    = 9;
  FPS_CREATING_EARTH_ALIGNED      = 10;
  FPS_STAR_KEYPOINTS              = 11;
  FPS_EARTH_KEYPOINTS             = 12;
  FPS_STAR_KEYPOINTS_FOUND        = 13;
  FPS_EARTH_KEYPOINTS_FOUND       = 14;
  FPS_STAR_ALIGNMENT_START        = 15;
  FPS_STAR_ALIGNMENT_BASE_KP      = 16;
  FPS_STAR_ALIGNMENT_BASE_KP_DONE = 17;
  FPS_STAR_ALIGNMENT_ALIGNING     = 18;
  FPS_STAR_ALIGNMENT_LOADING      = 19;
  FPS_STAR_ALIGNMENT_COMPLETE     = 20;
  FPS_STAR_ALIGNMENT_FAILED       = 21;
  FPS_CREATING_STAR_ALIGNED       = 22;
  FPS_SUBTRACTING_NEIGHBOR        = 23;
  FPS_ASSEMBLING_PIXELS           = 24;
  FPS_SORTING_PIXELS              = 25;
  FPS_DETECTING_BLOBS             = 26;
  FPS_FILTER_1                    = 27;
  FPS_FILTER_2                    = 28;
  FPS_FILTER_3                    = 29;
  FPS_FILTER_4                    = 30;
  FPS_FILTER_5                    = 31;
  FPS_FILTER_6                    = 32;
  FPS_FILTER_7                    = 33;
  FPS_FILTER_8                    = 34;
  FPS_FIRST_CLASSIFICATION        = 35;
  FPS_READY_FOR_INTER_FRAME       = 36;
  FPS_SECOND_CLASSIFICATION       = 37;
  FPS_OUTLIER_PROCESSING_COMPLETE = 38;
  FPS_FINISHING                   = 39;
  FPS_USER_MODIFIED               = 40;
  FPS_WRITING_OUTLIER_VALUES      = 41;
  FPS_WAITING_TO_LOAD_IMAGES      = 42;
  FPS_LOADING_IMAGES              = 43;
  FPS_LOADING_IMAGES_1            = 44;
  FPS_CREATING_REMOVAL_MASK       = 45;
  FPS_ASSEMBLING_PROCESSED_FRAME  = 46;
  FPS_WRITING_OUTPUT_FILE         = 47;
  FPS_COMPLETE                    = 48;
}

// ---- Outlier ----

message OutlierGroupList { repeated OutlierGroup groups = 1; }

message OutlierGroup {
  uint32      id                   = 1;
  uint64      size                 = 2;
  BoundingBox bounds               = 3;
  uint64      brightness           = 4;
  RemoveReason should_remove       = 5;
  double      classification_score = 6;
  Line        line                 = 7;
}

message BoundingBox { int32 min_x = 1; int32 min_y = 2; int32 max_x = 3; int32 max_y = 4; }
message Line        { double theta = 1; double rho = 2; int32 votes = 3; }

enum RemoveReason {
  RR_UNDECIDED         = 0;
  RR_USER_REMOVE       = 1;
  RR_USER_KEEP         = 2;
  RR_CLASSIFIER_REMOVE = 3;
  RR_CLASSIFIER_KEEP   = 4;
}

message SetOutlierDecisionsRequest {
  string                  session_id  = 1;
  int32                   frame_index = 2;
  repeated OutlierDecision decisions  = 3;
  bool                    rerender    = 4;
}

message OutlierDecision  { uint32 group_id = 1; RemoveReason decision = 2; }
message SetOutlierDecisionsResponse { FrameInfo frame = 1; ImageRef preview = 2; }

// ---- Processing / Export ----

message StartProcessingRequest  { string session_id = 1; int32 start_index = 2; int32 end_index = 3; }
message StartProcessingResponse {}
message CancelResponse          {}

message ProgressEvent {
  oneof kind {
    FrameStateEvent    frame_state         = 1;
    FrameSavingEvent   frame_saving_state  = 2;
    int32              frame_existing      = 3;
    OutliersLoaded     outliers_loaded     = 4;
    IoProgress         io_progress         = 5;
    SequenceStateEvent sequence_state      = 6;
  }
}

message FrameStateEvent    { int32 frame_index = 1; FrameProcessingState state = 2; }
message FrameSavingEvent   { int32 frame_index = 1; int32 old_state = 2; int32 new_state = 3; }
message OutliersLoaded     { int32 frame_index = 1; int32 state = 2; }
message IoProgress         { int32 current = 1; int32 total = 2; string output_dir = 3; }
message SequenceStateEvent { string state = 1; }

message ExportVideoRequest {
  string              session_id        = 1;
  string              output_video_path = 2;  // empty → daemon derives "<basename>.<muxer>"
  VideoEncodeSettings settings          = 3;  // defaults to the session config's persisted settings
}

// Drives the Render Video dialog's cascading pickers. Built from StarCore's enum relationships.
message GetVideoCapabilitiesRequest {}
message VideoCapabilities {
  repeated double     frame_rates = 1;  // FrameRate.allCases rawValues
  repeated CodecCaps  codecs      = 2;
}
message CodecCaps   { string codec    = 1; repeated EncoderCaps encoders = 2; }
message EncoderCaps { string encoder  = 1; repeated string pixel_formats = 2; repeated string muxers = 3; }
