syntax = "proto3";
package star.v1;
option swift_prefix = "Star_V1_";

// ---- Transport ----

message Envelope {
  uint64 id = 1;
  Kind   kind    = 2;
  string method  = 3;
  bytes  payload = 4;
  string error   = 5;
  int32  error_code = 6;

  enum Kind {
    REQUEST      = 0;
    RESPONSE     = 1;
    ERROR        = 2;
    STREAM_ITEM  = 3;
    STREAM_END   = 4;
    CANCEL       = 5;
    NOTIFICATION = 6;
  }
}

// ---- Daemon ----

// `locale` is the BCP-47 tag the client's UI is showing (e.g. "pt-BR"), or empty to let the
// daemon follow its own machine. The daemon localizes everything it sends back — Warning
// text, error strings — into it, so the two processes cannot end up speaking different
// languages at the same user. One client per daemon, so this is process-wide.
message HelloRequest  { string client_version = 1; string locale = 2; }
// `locale` echoes back the language the daemon actually resolved to, which may not be the
// one asked for: the client can request a language star has no translation for, and this is
// how it finds out it got the fallback.
message HelloResponse { string daemon_version = 1; string scratch_dir = 2; string locale = 3; }
// Change how much the daemon logs while it runs (macOS Debug window's "Log Level" and "Log to file at level"). `level` is what it writes to stderr,
// which the client keeps in its engine log and shows in its own debug window; the file is a log of the daemon's own, in `<scratch>/logs`, at
// `file_level`. A field left out (an empty level, an unset `file_enabled`) keeps what it was. Levels are verbose, debug, info, warn and error.
message SetLogLevelRequest {
  string        level        = 1;
  optional bool file_enabled = 2;
  string        file_level   = 3;
}
message SetLogLevelResponse {
  string level         = 1;   // in force now
  bool   file_enabled  = 2;
  string file_level    = 3;
  string file_log_path = 4;   // the file being written, or empty when there is none
}

message ShutdownRequest {}
message ShutdownResponse {}

// ---- Notifications (daemon → client, unsolicited) ----

// A machine-level condition the user should know about before it becomes a failure: memory
// pressure, a process footprint past its budget, output that could not be written, a disk
// with no room for the run. Mirrors StarCore.StarWarning.
//
// Sent as an Envelope with kind = NOTIFICATION and method = "Star.Warning". There is no
// request, no id to correlate and no response — the daemon originates it whenever it notices
// something. A client that ignores NOTIFICATION is still correct, it just says less.
//
// Before this the daemon's warnings went only to stderr, which the desktop client drains into
// a sink that in a packaged app goes nowhere a user can read.
message Warning {
  string kind       = 1;  // StarWarning.Kind rawValue, e.g. "memoryPressure"
  string severity   = 2;  // "warning" | "critical"
  string title      = 3;  // short heading, e.g. "Low Memory"
  string message    = 4;  // what happened, in a sentence
  string suggestion = 5;  // what to do about it, may be empty
  // For a report of a run that was killed (kind "previousRunDied", sent right after Daemon.Hello): the config that run can be picked back up from,
  // which is on disk (it is checked). Empty for every other warning. Opening it and processing again is "Restart Now".
  string restartable_config_path = 6;
  // True for a state of the machine that passes on its own (memory pressure, low system memory, footprint over budget): a banner about it should
  // come down by itself after a while, where one about something that happened, which stays true, stays until dismissed. StarWarning.describesAPassingCondition.
  bool   passing_condition       = 7;
}

// ---- Session ----

// What the frames of an imported video are written as.  The default (0) is 16 bit tiff, what star always wrote before this choice existed.
enum FrameFormat {
  FRAME_FORMAT_TIFF16 = 0;
  FRAME_FORMAT_TIFF8  = 1;
  FRAME_FORMAT_JPEG   = 2;
}

// How the tiff frames of an imported video are compressed.  Both are lossless and give the same picture; uncompressed is read about twice
// as fast while star processes the frames, for roughly 10% more disk.  The default (0) is what every import before the choice wrote.
enum TiffCompression {
  TIFF_COMPRESSION_PACKBITS = 0;
  TIFF_COMPRESSION_NONE     = 1;
}

// How many ffmpeg processes may extract ahead of the in-order extraction.  0 in either field means StarCore's default.
message ExtractionSettings {
  int32 max_jump_workers          = 1;   // on a video that can give up any frame quickly (ProRes and other intra-only formats)
  int32 max_long_gop_jump_workers = 2;   // on H.264, H.265 and the like, where only the frame the user is looking at starts one
}

message OpenVideoRequest {
  string      video_path     = 1;
  Config      initial_config = 2;
  FrameFormat frame_format   = 3;   // default TIFF16
  int32       jpeg_quality   = 4;   // 1..100, only for JPEG; 0 (unset) → 80
  // Answer once the first frame is out instead of the last: the rest are extracted while the session is open (SessionInfo.extraction, and
  // the ProgressEvents frame_extraction / frames_available say how far).
  bool            extract_in_background = 5;
  TiffCompression tiff_compression      = 6;
  ExtractionSettings extraction_settings = 7;
}

// Session.ProbeVideo: what the video's header says, without decoding it, so a dialog can tell the user how much disk the frames will take.
message ProbeVideoRequest  { string video_path = 1; }
message ProbeVideoResponse {
  bool   known       = 1;   // false when the video could not be read; nothing else is set then
  int32  width       = 2;
  int32  height      = 3;
  int32  frame_count = 4;   // 0 when the file does not say how many frames it has
  // Estimated bytes one pixel of a frame takes on disk, so a client can work out the size for whatever it is showing:
  // width * height * frame_count * bytes_per_pixel.  The estimates lean high, since they are for deciding whether there is room.
  double          tiff16_bytes_per_pixel = 5;
  double          tiff8_bytes_per_pixel  = 6;
  repeated double jpeg_bytes_per_pixel   = 7;   // [i] is quality i + 1, so 100 entries
  // Whether every frame is a keyframe, so that any one can be extracted on its own (ProRes, DNxHD, MJPEG, intra-only H.264...).  The default for
  // "extract in background" is on for these and off for the rest.  seekable_known is false when the packets could not be examined.
  bool   seekable       = 8;
  bool   seekable_known = 9;
  // The same estimate for uncompressed tiff, which is exact.  The tiff16/tiff8 fields above stay PackBits, so an older client reads what it did.
  double tiff16_raw_bytes_per_pixel = 10;
  double tiff8_raw_bytes_per_pixel  = 11;
  // Whether frame_count is the video's own count rather than an estimate from its duration.
  bool   frame_count_exact = 12;
}
message OpenSequenceRequest { string sequence_dir = 1; Config initial_config = 2; }
message OpenConfigRequest   { string config_json_path = 1; }

// What opening a source is doing, for the loading screen (macOS ImageSequenceLoadingView).  A video is examined, then its frames are
// extracted (IoProgress, below), then every source has its frames loaded (FramesLoaded).
enum OpenStage {
  OPEN_STAGE_UNSPECIFIED       = 0;
  OPEN_STAGE_EXAMINING_VIDEO   = 1;   // counting what is in the video before any of it is decoded; nothing to measure yet
  OPEN_STAGE_EXTRACTING_FRAMES = 2;   // IoProgress carries how many
  OPEN_STAGE_LOADING_FRAMES    = 3;   // FramesLoaded carries how many
}
message OpenStageEvent {
  OpenStage stage = 1;
  string    name  = 2;   // what is being opened, for the title (the sequence's folder, or the video's file); empty when this event has no new name
}
message FramesLoaded { int32 loaded = 1; int32 total = 2; }

// The stream of Session.OpenVideo, Session.OpenSequenceStream and Session.OpenConfigStream: stage and progress events, then `done` last.
// Cancelling the call (a transport CANCEL) stops the open, stops ffmpeg if it was decoding, and leaves no session behind.
message OpenProgress {
  oneof kind {
    IoProgress     progress = 1;
    SessionInfo    done     = 2;
    OpenStageEvent stage    = 3;
    FramesLoaded   loaded   = 4;
  }
}

// Encode settings. codec/encoder/pixel_format/muxer are StarCore FFmpeg* enum rawValue strings
// (those enums have 1000+ cases — proto enums would be unmaintainable; the daemon maps via init?(rawValue:)).
// frame_rate is FrameRate.rawValue (double). An empty string field means "use the session config default".
message VideoEncodeSettings {
  double frame_rate   = 1;  // e.g. 24, 29.97, 30, 60
  string codec        = 2;  // FFmpegCodec.rawValue
  string encoder      = 3;  // FFmpegEncoder.rawValue
  string pixel_format = 4;  // FFmpegPixelFormat.rawValue
  string muxer        = 5;  // FFmpegMuxer.rawValue — also the output container extension
  int32  output_height = 6; // scale the video to this height in pixels, width following the aspect ratio; 0 = as the frames are
}

// Mirrors StarCore.VideoInfo.
message VideoInfo {
  VideoEncodeSettings settings  = 1;
  bool                has_audio = 2;
}

message SessionInfo {
  string    session_id            = 1;
  int32     frame_count           = 2;
  int32     image_width           = 3;
  int32     image_height          = 4;
  int32     components_per_pixel  = 5;
  Config    config                = 6;
  string    scratch_session_dir   = 7;
  VideoInfo source_video_info     = 8;  // set iff opened from a video (Session.OpenVideo); else default
  // Where this session's config.json actually lives — the file the daemon saves to, and the
  // one to hand back to Session.OpenConfig to resume it. For a session opened from a
  // sequence or a video that is `<temp output dir>/config.json`, beside the session's output
  // where the macOS app keeps it, so it can be recorded and opened again from either client; for
  // one opened from a config it is the caller's own file. Neither is in the scratch dir, which is
  // different on every open. Clients used to build the scratch path themselves, which named a file
  // nothing ever wrote.
  string    config_json_path      = 9;
  // How far extracting the video's frames has got, for a session whose frames are still arriving; absent (or complete) otherwise.
  FrameExtraction extraction      = 10;
}

message FrameRange { int32 start = 1; int32 end = 2; }   // [start, end)

// Where the extraction of a video's frames has got to.  `available` is the full coalesced list when this is a snapshot (SessionInfo, and the first
// ProgressEvent a Processing.StreamProgress subscriber gets), and empty in the throttled updates, which are followed by FramesAvailable.
message FrameExtraction {
  int32  extracted         = 1;
  int32  total             = 2;
  double frames_per_second = 3;   // 0 = not known yet
  bool   complete          = 4;
  bool   seekable          = 5;   // any frame can be had cheaply: a request for one moves the extractor, at any priority
  repeated FrameRange available = 6;
  string error             = 7;   // non-empty: extraction failed, and the frames that are not there will not come
  double eta_seconds       = 8;   // for the rest; 0 with eta_known false when there is no rate yet
  bool   eta_known         = 9;
  bool   active            = 10;  // true while frames are still being extracted (false for a sequence that was never extracting)
}

message FramesAvailable { repeated FrameRange ranges = 1; }

// Frame.Prioritize: what the user is looking at, so the extractor fetches it first (where the video allows it).  Cheap to call on every
// move; the daemon collapses a scrub that is still moving.
message PrioritizeFramesRequest  { string session_id = 1; int32 viewing = 2; repeated FrameRange nearby = 3; }
message PrioritizeFramesResponse {}

// Frame.GetEta: how long until a frame that is not extracted yet is, for the wait panel.
message FrameEtaRequest  { string session_id = 1; int32 frame_index = 2; }
message FrameEtaResponse {
  bool   available = 1;   // the frame is there already
  double seconds   = 2;
  bool   known     = 3;   // false: no estimate yet (show an indeterminate indicator)
  double fraction  = 4;   // 0..1 of the way there, for a determinate bar
  bool   jump      = 5;   // a jump to this frame is running (so "extracting it now"), rather than waiting for the in-order extraction
  int32  sweep_head = 6;  // where the in-order extraction is
  string error     = 7;   // non-empty: it will not come
}

message CloseSessionRequest  { string session_id = 1; }
message CloseSessionResponse {}
message ListSessionsRequest  {}
message ListSessionsResponse { repeated SessionInfo sessions = 1; }
message SessionRef           { string session_id = 1; }

// ---- Config ----

message UpdateConfigRequest { string session_id = 1; Config config = 2; }

// What applying a proposed config would do to the work already on disk, asked before it is applied (macOS settings sheet: the red "already
// processed frames have different settings" line, and Process Now becoming Update). Compared against the settings the last run began with (the
// session's snapshot; the config as it stood when this was first asked if none has run).
message ConfigChangePreview {
  repeated string stale_stages = 1;           // the cached stages the change would invalidate: horizon, mergedHorizon, keypoints, alignment, outliers, output
  bool contradicts_finished_work = 2;         // some stage is stale AND there is finished work for it to contradict (StarCore SettingsChangeState)
}

message Config {
  string        output_path                              = 1;
  string        temp_output_path                         = 2;
  CleanMethod   clean_method                             = 3;
  DetectionType detection_type                           = 4;
  bool          horizon_detection_enabled                = 5;
  bool          tripod_head_was_moving                   = 6;
  int32         number_of_frames_to_process_concurrently = 7;
  int32         ignore_lower_pixels                      = 8;   // -1 = unset
  map<int32, CleanMethod> pixel_replacement_overrides    = 9;
  map<int32, int32>       static_neighbor_frame_overrides   = 10;
  map<int32, int32>       aligned_neighbor_frame_overrides  = 11;
  bool                    write_outlier_group_files          = 12;
  bool                    write_frame_preview_files          = 13;
  VideoEncodeSettings     video                             = 14;  // persisted encode settings
  string                  star_version                      = 15;  // engine version that wrote this config; compare to HelloResponse.daemon_version

  // Expert settings (StarCore Config). All `optional` so an unset field keeps StarCore's (non-zero)
  // default instead of being clobbered by a proto3 zero. The daemon applies only present fields.
  optional int32  number_aligned_neighbor_frames                       = 16;
  optional int32  number_static_neighbor_frames                        = 17;
  optional double homography_smoothing_epsilon                         = 18;
  optional int32  keypoint_memory_multiplier                           = 19;
  optional int32  outlier_memory_multiplier                            = 20;
  optional int32  merge_memory_multiplier                              = 21;
  optional bool   use_reference_horizon_smoothing                      = 22;
  optional int32  reference_horizon_smoothing_max_distance             = 23;
  optional bool   use_reference_horizon_brightness_refinement          = 24;
  optional int32  reference_horizon_brightness_refinement_search_radius = 25;
  optional int32  reference_horizon_brightness_refinement_hist_buckets  = 26;
  optional int32  reference_horizon_neighborhood_size                  = 27;
  optional bool   horizon_spike_removal_enabled                        = 28;
  optional int32  horizon_spike_max_width                              = 29;
  optional double horizon_spike_max_deviation_fraction                 = 30;
  optional int32  horizon_spike_window_half                            = 31;
  // 32 was horizon_strip_width, which sized the strips that the Otsu horizon pass
  // thresholded separately. That step went when the whole bottom crop started being
  // thresholded at once, leaving the field read by nobody and a control in two
  // clients that did nothing. Reserved so no future field can reuse the number and
  // be misread by a client built against the old schema.
  reserved 32;
  optional bool   use_canny_for_horizon_detection                      = 33;
  optional double canny_min_threshold                                  = 34;
  optional double canny_max_threshold                                  = 35;
  optional bool   canny_use_l2_gradient                                = 36;
  // 37 was horizon_vertical_shift_amount, a hand-entered number of pixels the
  // horizon mask was scooted up by before compositing the star-aligned sky over the
  // earth image, to hide the ground smear the merge's warps land above the horizon.
  // The composite now derives the exact envelope from the merge's own homographies
  // (StarAlignedHorizonMask), so the knob went away.  Reserved so no future field can
  // reuse the number and be misread by a client built against the old schema.
  reserved 37;
  optional bool   allow_earth_alignment                                = 38;
  optional int32  alignment_max_keypoints                              = 39;
  optional bool   alignment_write_debug_images                         = 40;
  optional int32  alignment_ground_horizon_extension                   = 41;
  optional int32  alignment_sky_horizon_extension                      = 42;
  optional int32  alignment_base_image_dilate_size                     = 43;
  optional int32  alignment_base_image_threshold_value                 = 44;
  optional int32  horizon_memory_multiplier                            = 45;
  // Least bytes to reserve for one horizon op, whatever the multiplier works out to.
  // A horizon op's cost is mostly fixed rather than per-pixel, so the multiplier alone
  // under-reserves on small frames. 0 = no floor.
  optional int32  horizon_reservation_floor_mb                         = 46;
  // 47 was alignment_half_resolution_keypoints, a bool that could only express a
  // divisor of 1 or 2. Replaced by alignment_keypoint_detection_divisor below; the
  // number stays reserved so no future field can reuse it and be misread by a client
  // built against the old schema.
  reserved 47;
  // Divide each frame's dimensions by this before detecting keypoints. 1 = full
  // resolution, 2 = half size, 1.5 = two thirds. Detection time and peak memory both
  // fall as 1/divisor^2; what it costs is keypoint localisation precision, which shows
  // up as softness in the merged result. Values <= 1 mean full resolution.
  optional double alignment_keypoint_detection_divisor                 = 50;
  // Explicit cap on concurrent keypoint ops. A cap, so it can only lower the limit the
  // memory budget already implies, never raise it. 0 = no explicit cap.
  optional int32  max_concurrent_keypoint_ops                          = 48;
  // Above this many megabytes of source frames, a median merge streams them from
  // scratch files instead of holding them all. Output is identical either way.
  // 0 = always keep everything resident.
  optional int32  merge_streaming_threshold_mb                         = 49;
  // Recorded state rather than a setting, and so not in the expert dialog: the frames the
  // user chose to hand paint reference horizons on during the startup prompts, and how far
  // through that list they got. An empty list means there is nothing unfinished. A client
  // re-opening a session with one left over puts the painter back on
  // startup_horizon_frame_indices[startup_horizon_frame_position] rather than going on to
  // process, which would run the frames the user never reached with the automatic horizon
  // detection they had already declined.
  //
  // The two are applied together and gated on the *position* being present. A repeated
  // field cannot be `optional`, so an empty list is indistinguishable from an unset one —
  // without the gate, any client that sent a config back without knowing about these would
  // wipe the record.
  repeated int32  startup_horizon_frame_indices                        = 51;
  optional int32  startup_horizon_frame_position                       = 52;
  // Whether to use GPU acceleration (Metal, on supported Macs) for the alignment
  // warp and median-merge kernels ONLY -- keypoint detection (SIFT/AKAZE) has its
  // own separate, cli-only flags on the StarCore side and is unaffected by this
  // one. On by default; StarCore.GPUCapability still gates every call site, so
  // this alone does not mean GPU work is actually happening on the machine
  // running the daemon -- see gpu_hardware_available. Maps to StarCore
  // Config.useGPUForMerge; the field keeps its original wire name (renaming a
  // proto field is a needless break) even though the Swift property was renamed
  // from the equally generic-sounding `useGPU`.
  optional bool   use_gpu_acceleration                                 = 53;
  // Read-only: whether the daemon's own machine has hardware use_gpu_acceleration
  // can actually use. Always sent by the daemon, computed fresh each time (it is
  // not a Config field on the StarCore side); a client applying a Config back
  // must never send this on, since there is nothing on the StarCore side for it
  // to set.
  optional bool   gpu_hardware_available                               = 54;
  // Whether to use GPU acceleration for SIFT / AKAZE keypoint detection,
  // respectively. Both off by default, and independent of use_gpu_acceleration
  // and of each other -- see StarCore Config.useGPUForSIFT / .useGPUForAKAZE.
  // Also still gated by gpu_hardware_available.
  optional bool   use_gpu_for_sift                                     = 55;
  optional bool   use_gpu_for_akaze                                    = 56;
  // How much of this Mac star may use: "full" (the default), "balanced", "light" or
  // "custom". Maps to StarCore Config.resourceProfile. Unset keeps whatever the session's
  // config already has. For "custom" the limits are number_of_frames_to_process_concurrently
  // (the pipeline depth cap) and the editable fields StarCore keeps beside it.
  optional string resource_profile                                     = 57;
  // Whether a settings change that contradicts frames already processed throws away what it invalidated and builds it again (true, the default),
  // or keeps it and applies the new settings only to the frames still to do. StarCore Config.reprocessOnSettingsChange; the answer to the
  // "reprocess already processed frames?" question (see Sequence.PreviewConfigChange).
  optional bool   reprocess_on_settings_change                         = 58;
  // The fraction of this machine's physical memory star may reserve for operations in flight (StarCore Config.maxMatMemoryFraction), 0.1 to 0.95;
  // the default 0.85 leaves the rest of the machine about 15%. Lower it on a machine shared with other heavy programs. Applied as given only under
  // the Custom resource profile; the other profiles bring their own. A value outside the range is clamped.
  optional double max_mat_memory_fraction                              = 59;
  // Read-only: the name of the GPU the daemon's machine offers (Metal's device name on a Mac), for saying which one the GPU toggles would use. Absent
  // where there is none; a client applying a Config back must not send it on.
  optional string gpu_device_name                                      = 60;
  // Read-only: the name of the folder the image sequence is in (StarCore Config.imageSequenceDirname), for a window to be titled by; for a video it is
  // the name the daemon gave the frames it took out of it. A client applying a Config back must not send it on.
  string          image_sequence_dirname                               = 61;
  // Whether the star aligned merge also runs its cloud-aware stage: a second merge aligned to the motion of the clouds, blended in where it
  // explains the frame better, with the stars put back, so fast-moving clouds are not banded and repeated. StarCore Config.cloudAwareMerge, off
  // unless asked for. Changing it throws away the alignment stage's results for frames already processed (see Sequence.PreviewConfigChange).
  optional bool   cloud_aware_merge                                    = 62;
}

enum CleanMethod {
  CLEAN_AUTOMATIC      = 0;
  CLEAN_AUTOMATIC_TRUE = 1;
  CLEAN_SELECTIVE      = 2;
}

enum DetectionType {
  DETECTION_MILD      = 0;
  DETECTION_STRONG    = 1;
  DETECTION_STRONGER  = 2;
  DETECTION_EXCESSIVE = 3;
  DETECTION_CUSTOM    = 4;
}

// ---- Blob processing (macOS Window ▸ Blob Processing, a developer tool) ----
//
// The blob processors are process-wide, not a session's: a detection type has the same steps in every session, and the custom type is the one
// that can be changed. Changes to it are kept by StarCore in `~/.star_custom_processor_steps.json`, as the macOS window does.

// One parameter of a step. `name` is StarCore's own name for it; `description` is StarCore's, in English.
message BlobStepArg {
  string name        = 1;
  bool   value_present = 2;
  double value       = 3;
  bool   is_integer  = 4;
  bool   is_optional = 5;
  string description = 6;
}

message BlobStep {
  // The step's kind, as StarCore names it: findBlobs, smallBlobRemover, linearBlobConnector, linearBlobExtender, blobLineTrim,
  // houghLineMatrixBlobConnector, applyUserSlices, compactBlobIds, blobDupeCheck, save or frameState.
  string   kind        = 1;
  string   title       = 2;   // in the language of Daemon.Hello
  string   description = 3;   // what it does, or for a step with nothing to configure what it carries (the image it saves, the state it sets)
  repeated BlobStepArg args = 4;
  bool     can_disable = 5;   // the custom processor can be told to skip it: a step with parameters, other than the first
  bool     disabled    = 6;   // and it has been
}

message GetBlobStepsRequest { DetectionType detection_type = 1; }

message BlobStepsResponse {
  DetectionType    detection_type = 1;
  repeated BlobStep steps         = 2;
  string           description    = 3;   // what the detection type is, in the language of Daemon.Hello
  bool             editable       = 4;   // only the custom type is
}

message BlobStepArgChange      { int32 step_index = 1; string arg_name = 2; double value = 3; }
message BlobStepDisabledChange { int32 step_index = 1; bool disabled = 2; }

// Change the custom detection type: replace its steps with a copy of another type's, set one parameter of one step (an integer parameter is
// rounded), or tell a step to be skipped or not. The answer is the custom type's steps as they now are.
message SetCustomBlobStepsRequest {
  oneof change {
    DetectionType          copy_from = 1;
    BlobStepArgChange      arg       = 2;
    BlobStepDisabledChange disabled  = 3;
  }
}

// ---- Frame ----

message FrameRef { string session_id = 1; int32 frame_index = 2; }

message FrameInfo {
  int32                frame_index             = 1;
  FrameProcessingState state                   = 2;
  int32                num_positive_outliers   = 3;
  int32                num_negative_outliers   = 4;
  int32                num_undecided_outliers  = 5;
  CleanMethod          clean_method            = 6;
  int32                num_trash_outliers      = 7;
  // True when this frame's outlier groups are in memory, which is when the three counts above mean
  // anything.  A frame whose groups are still purged to disk reports 0/0/0, which is "unknown", not
  // "none"; Frame.Get does not load them (a grid scroll would load every frame).
  bool                 outliers_loaded         = 8;
  // This frame is waiting for horizon refinement, because a reference horizon it interpolates from was
  // repainted and the work has not run yet (drawn in orange).  See Horizon.ReferenceUpdated.
  bool                 refinement_pending      = 9;
  // The images this frame has on disk right now, as the client can ask for them (Frame.GetPreview): VIEW_ORIGINAL is always there.
  // What the view-mode pickers offer, and grey out.
  repeated FrameViewMode available_modes       = 10;
  // The file name of this frame's original image (without its directory): what the grid's frame panel shows.  Empty if there is none.
  string               filename                = 11;
  // This frame's own settings, which the sequence's defaults give way to once they are set for it (macOS's Custom / Default):
  // the clean method, and the number of neighbour frames it is star aligned against and merged with (static neighbours) --
  // the count in effect for this frame, and whether it is the frame's own.
  bool                 clean_method_overridden       = 12;
  int32                aligned_neighbor_count        = 13;
  bool                 aligned_neighbor_overridden   = 14;
  int32                static_neighbor_count         = 15;
  bool                 static_neighbor_overridden    = 16;
  // This frame's original has not been extracted from the video yet (so there is nothing to show for it, and tools that need it are off).
  bool                 not_extracted                 = 17;
}

message GetFramePreviewRequest {
  string        session_id  = 1;
  int32         frame_index = 2;
  FrameViewMode view_mode   = 3;
  PreviewSize   size        = 4;   // default: the preview
}

// How large an image Frame.GetPreview returns.  THUMBNAIL is the small one the filmstrip draws (a view mode that has none
// returns the preview); ORIGINAL is an 8-bit JPEG copy of the full-size image, made on demand (it can be tens of megapixels).
enum PreviewSize {
  PREVIEW_SIZE_PREVIEW   = 0;
  PREVIEW_SIZE_THUMBNAIL = 1;
  PREVIEW_SIZE_ORIGINAL  = 2;
}

// Every image the pipeline keeps for a frame (StarCore `FrameViewMode`).  VIEW_PROCESSED is the finished image, whichever clean
// method made it.
enum FrameViewMode {
  VIEW_ORIGINAL    = 0;
  VIEW_PROCESSED   = 1;
  VIEW_SUBTRACTION = 2;
  VIEW_VALIDATION  = 3;
  VIEW_HORIZON                 = 4;    // computed horizon mask
  VIEW_MERGED_HORIZON          = 5;    // the horizon mask merged from the neighbours
  VIEW_USER_HORIZON            = 6;    // the horizon painted by the user
  VIEW_STAR_ALIGNED            = 7;
  VIEW_FAILED_STAR_ALIGNED     = 8;
  VIEW_EARTH_ALIGNED           = 9;
  VIEW_FAILED_EARTH_ALIGNED    = 10;
  VIEW_BLOBS                   = 11;   // blobs found in the subtraction
  VIEW_REMOVE_MASK             = 12;
  VIEW_AUTO_PROCESSED          = 13;   // the output of each clean method, before it is linked as the final one
  VIEW_AUTO_SELECTIVE_PROCESSED = 14;
  VIEW_SELECTIVE_PROCESSED     = 15;
  VIEW_CONSENSUS_HORIZON       = 16;   // a moving sequence's horizon consensus, drawn as a mask
}

// not_extracted: the frame's original is not extracted from its video yet, so there is no image (path is empty).  A result, not an error: the
// client shows its "not extracted" placeholder, and asks Frame.GetEta how long it will be.
message ImageRef { string path = 1; int32 width = 2; int32 height = 3; string format = 4; bool not_extracted = 5; }

enum NeighborKind {
  NEIGHBOR_ALIGNED = 0;   // how many neighbours the frame is star aligned against
  NEIGHBOR_STATIC  = 1;   // how many it is merged with for the horizon (a fixed camera)
}

// Set this frame's own neighbour count, or take it away so the sequence's applies again (`clear`), and do what that changes: a new
// aligned count throws away the frame's star alignment and processes the frame again (`processing_started`), a new static count
// builds its merged horizon again if there was one.  The new count must be at least 1.  Answered with the frame as it is now.
message SetNeighborOverrideRequest {
  string       session_id  = 1;
  int32        frame_index = 2;
  NeighborKind kind        = 3;
  oneof change {
    int32 count = 4;
    bool  clear = 5;
  }
}
message SetNeighborOverrideResponse {
  FrameInfo frame              = 1;
  bool      processing_started = 2;
}

message SetFrameCleanMethodRequest {
  string      session_id  = 1;
  int32       frame_index = 2;
  CleanMethod clean_method = 3;
}

enum FrameProcessingState {
  FPS_UNPROCESSED                 = 0;
  FPS_HORIZON_DETECTION           = 1;
  FPS_HORIZON_DETECTED            = 2;
  FPS_MERGING_HORIZON             = 3;
  FPS_EARTH_ALIGNMENT_START       = 4;
  FPS_EARTH_ALIGNMENT_BASE_KP     = 5;
  FPS_EARTH_ALIGNMENT_BASE_KP_DONE = 6;
  FPS_EARTH_ALIGNMENT_ALIGNING    = 7;
  FPS_EARTH_ALIGNMENT_LOADING     = 8;
  FPS_EARTH_ALIGNMENT_COMPLETE    = 9;
  FPS_CREATING_EARTH_ALIGNED      = 10;
  FPS_STAR_KEYPOINTS              = 11;
  FPS_EARTH_KEYPOINTS             = 12;
  FPS_STAR_KEYPOINTS_FOUND        = 13;
  FPS_EARTH_KEYPOINTS_FOUND       = 14;
  FPS_STAR_ALIGNMENT_START        = 15;
  FPS_STAR_ALIGNMENT_BASE_KP      = 16;
  FPS_STAR_ALIGNMENT_BASE_KP_DONE = 17;
  FPS_STAR_ALIGNMENT_ALIGNING     = 18;
  FPS_STAR_ALIGNMENT_LOADING      = 19;
  FPS_STAR_ALIGNMENT_COMPLETE     = 20;
  FPS_STAR_ALIGNMENT_FAILED       = 21;
  FPS_CREATING_STAR_ALIGNED       = 22;
  FPS_SUBTRACTING_NEIGHBOR        = 23;
  FPS_ASSEMBLING_PIXELS           = 24;
  FPS_SORTING_PIXELS              = 25;
  FPS_DETECTING_BLOBS             = 26;
  FPS_FILTER_1                    = 27;
  FPS_FILTER_2                    = 28;
  FPS_FILTER_3                    = 29;
  FPS_FILTER_4                    = 30;
  FPS_FILTER_5                    = 31;
  FPS_FILTER_6                    = 32;
  FPS_FILTER_7                    = 33;
  FPS_FILTER_8                    = 34;
  FPS_FIRST_CLASSIFICATION        = 35;
  FPS_READY_FOR_INTER_FRAME       = 36;
  FPS_SECOND_CLASSIFICATION       = 37;
  FPS_OUTLIER_PROCESSING_COMPLETE = 38;
  FPS_FINISHING                   = 39;
  FPS_USER_MODIFIED               = 40;
  FPS_WRITING_OUTLIER_VALUES      = 41;
  FPS_WAITING_TO_LOAD_IMAGES      = 42;
  FPS_LOADING_IMAGES              = 43;
  FPS_LOADING_IMAGES_1            = 44;
  FPS_CREATING_REMOVAL_MASK       = 45;
  FPS_ASSEMBLING_PROCESSED_FRAME  = 46;
  FPS_WRITING_OUTPUT_FILE         = 47;
  FPS_COMPLETE                    = 48;
}

// ---- Outlier ----

message OutlierGroupList { repeated OutlierGroup groups = 1; }

message OutlierGroup {
  uint32      id                   = 1;
  uint64      size                 = 2;
  BoundingBox bounds               = 3;
  uint64      brightness           = 4;
  RemoveReason should_remove       = 5;
  double      classification_score = 6;
  Line        line                 = 7;
}

message BoundingBox { int32 min_x = 1; int32 min_y = 2; int32 max_x = 3; int32 max_y = 4; }
message Line        { double theta = 1; double rho = 2; int32 votes = 3; }

enum RemoveReason {
  RR_UNDECIDED         = 0;
  RR_USER_REMOVE       = 1;
  RR_USER_KEEP         = 2;
  RR_CLASSIFIER_REMOVE = 3;
  RR_CLASSIFIER_KEEP   = 4;
}

message SetOutlierDecisionsRequest {
  string                  session_id  = 1;
  int32                   frame_index = 2;
  repeated OutlierDecision decisions  = 3;
  bool                    rerender    = 4;
}

message OutlierDecision  { uint32 group_id = 1; RemoveReason decision = 2; }
message SetOutlierDecisionsResponse { FrameInfo frame = 1; ImageRef preview = 2; }

// Re-run the StarCore decision-tree classifier over a frame's outlier groups.
message ApplyDecisionTreeRequest {
  string session_id     = 1;
  int32  frame_index    = 2;
  bool   overwrite      = 3;   // false = keep existing user/classifier decisions; true = reclassify all
  bool   auto_only      = 4;   // true => applyDecisionTreeToAutoSelectedOutliers; false => ...ToAllOutliers
  bool   including_trash = 5;  // auto_only path: also promote+classify trashed groups
  int32  minimum_size   = 6;   // 0 => no minimum (nil)
  bool   rerender       = 7;
}
message ApplyDecisionTreeResponse { FrameInfo frame = 1; ImageRef preview = 2; }

// Set every outlier of one frame at once (Keep All / Remove All / Clear Undecided): `should_remove` is the decision to set,
// `undecided_only` limits it to groups nobody has decided about, `including_trash` also takes the trashed groups, promoting
// them out of the trash as macOS does.  Answered with the frame's new counts.
message SetAllOutliersRequest {
  string session_id      = 1;
  int32  frame_index     = 2;
  bool   should_remove   = 3;
  bool   undecided_only  = 4;
  bool   including_trash = 5;
}

message ApplyDecisionTreeAllFramesRequest {
  string session_id   = 1;
  bool   overwrite    = 2;
  int32  minimum_size = 3;   // 0 => no minimum (nil)
}
message ApplyDecisionTreeAllFramesResponse { repeated FrameInfo frames = 1; }

// Bulk decisions across a frame range (multi-choice / multi-select sheets). Locations are image pixels.
message Point { double x = 1; double y = 2; }

message SetOutlierDecisionsInAreaRequest {
  string session_id      = 1;
  int32  start_index     = 2;   // inclusive
  int32  end_index       = 3;   // inclusive
  bool   should_remove   = 4;
  Point  start_location  = 5;   // rect corner (image px)
  Point  end_location    = 6;   // opposite corner (image px)
  bool   including_trash = 7;
  bool   rerender        = 8;
  bool   overlapping     = 9;   // true → also mark groups overlapping each group in the area (macOS removeOverlaps)
}

message SetOutlierDecisionsOverlappingRequest {
  string session_id         = 1;
  int32  start_index        = 2;   // inclusive
  int32  end_index          = 3;   // inclusive
  bool   should_remove      = 4;
  int32  reference_frame    = 5;   // frame the reference group lives in
  uint32 reference_group_id = 6;
  bool   rerender           = 7;
}

message MultiFrameDecisionsResponse {
  repeated FrameInfo frames   = 1;
  repeated ImageRef  previews = 2;   // populated when rerender = true (parallel to frames)
}

// Single-frame area editing tools (macOS razor / shovel / trash / get-from-trash), applied to a drag
// rectangle on the current frame. Each maps to an existing StarCore op; see the daemon handler.
enum OutlierAreaTool {
  AREA_TOOL_UNSPECIFIED   = 0;
  AREA_TOOL_RAZOR         = 1;   // applyRazor(in:includingTrash:) — cut groups crossing the rectangle
  AREA_TOOL_SHOVEL        = 2;   // findOutliers(within:) — re-detect outliers inside the rectangle, then mark complete
  AREA_TOOL_TRASH         = 3;   // move groups fully inside the rectangle into the trash
  AREA_TOOL_EXTRACT_TRASH = 4;   // promote trashed groups inside the rectangle back into view (promoteDust)
}

message ApplyOutlierAreaToolRequest {
  string          session_id      = 1;
  int32           frame_index     = 2;
  OutlierAreaTool tool            = 3;
  Point           start_location  = 4;   // rect corner (image px)
  Point           end_location    = 5;   // opposite corner (image px)
  bool            including_trash = 6;   // razor: also cut trashed groups (mirrors macOS shouldShowTrash)
  bool            rerender        = 7;
  uint32          group_id        = 8;   // TRASH only: when > 0, dump exactly this group (single-tap, macOS dumpInTrash(_:)); 0 = use the rectangle
}
message ApplyOutlierAreaToolResponse { FrameInfo frame = 1; ImageRef preview = 2; }

// What the outlier window tabulates (macOS OutlierGroupTableRow): for each requested group of one frame, its value for every
// decision-tree feature (keyed by the feature's name, `OutlierGroupFeature.rawValue`: "size", "width", "aspectRatio", …) and the
// "all frames" classifier's score for it (-1 … +1; 0 when no classifier is set).  `group_ids` empty means every group of the frame.
// Groups that are not in the frame are left out.  Rows come back in group id order.
message GetOutlierFeaturesRequest {
  string          session_id  = 1;
  int32           frame_index = 2;
  repeated uint32 group_ids   = 3;
}
message OutlierFeatureRow {
  uint32              group_id       = 1;
  map<string, double> features       = 2;
  double              classification = 3;
}
message OutlierFeaturesResponse { repeated OutlierFeatureRow rows = 1; }

// ---- Outlier lines: the outlier window's Hough-line panel (macOS HoughLinesTableView) ----

// One line the Hough finder proposes for a group, with how well it fits the group's pixels.  `line` is measured from the corner of the
// group's bounding box, as `OutlierGroup.line` is.  `border` is the padding the finder ran with (-1, -2: the box's two diagonals).
message LineCandidate {
  Line   line            = 1;
  double intensity_score = 2;
  double pixel_score     = 3;
  int32  border          = 4;
}

// The lines the finder proposes for one group with the finder's arguments as they are now, best fit (intensity score) first.
message GetLineCandidatesRequest {
  string session_id  = 1;
  int32  frame_index = 2;
  uint32 group_id    = 3;
}
message LineCandidatesResponse { repeated LineCandidate candidates = 1; }

// Make `candidate` the line of one group (in memory, as macOS does: lines are worked out on demand and not saved).  Answered with the
// group as it is now.
message SetLineRequest {
  string        session_id  = 1;
  int32         frame_index = 2;
  uint32        group_id    = 3;
  LineCandidate candidate   = 4;
}
message SetLineResponse { OutlierGroup group = 1; }

// The Hough line finder's arguments (macOS Argable): process-wide, and read by every line worked out after they change.
message HoughLineFinderArg {
  string name        = 1;   // "imageDataBorderSize", "maxLineConstant"
  double value       = 2;
  bool   is_integer  = 3;
  string description = 4;   // English, from StarCore
}
message GetHoughLineFinderArgsRequest {}
message HoughLineFinderArgs { repeated HoughLineFinderArg args = 1; }
message SetHoughLineFinderArgRequest {
  string name  = 1;
  double value = 2;
}

// ---- Processing / Export ----

// start_index/end_index are inclusive frame indices.  A negative end_index (clients send -1) means
// "to the end of the sequence"; end_index 0 is the first frame, so start=end=0 processes frame 0 only.
message StartProcessingRequest  { string session_id = 1; int32 start_index = 2; int32 end_index = 3; bool force = 4; }
message StartProcessingResponse {}

// Granular per-frame reprocess (grid context menu).
enum ReprocessingType {
  REPROCESS_NONE         = 0;
  REPROCESS_EVERYTHING   = 1;
  REPROCESS_ALIGNMENT    = 2;
  REPROCESS_OUTLIERS     = 3;
  REPROCESS_HORIZONS     = 4;
  REPROCESS_ALL_HORIZONS = 5;
}
message ReprocessFramesRequest  { string session_id = 1; repeated int32 frame_indices = 2; ReprocessingType type = 3; }
message ReprocessFramesResponse {}
message CancelResponse          {}

message ProgressEvent {
  oneof kind {
    FrameStateEvent    frame_state         = 1;
    FrameSavingEvent   frame_saving_state  = 2;
    int32              frame_existing      = 3;
    OutliersLoaded     outliers_loaded     = 4;
    IoProgress         io_progress         = 5;
    SequenceStateEvent sequence_state      = 6;
    VideoExportedEvent video_exported      = 7;
    ImageSaved         image_saved         = 8;
    int32              horizon_updated     = 9;   // frame index: its horizon lines changed (a mask written or deleted, a reference painted or cleared, a refinement finished)
    StepProgress       step_progress       = 10;
    FrameExtraction    frame_extraction    = 11;   // throttled to about four a second; the first one a subscriber gets is a full snapshot
    FramesAvailable    frames_available    = 12;   // batched
  }
}

// How far each step of the run in progress has got (macOS ProcessingStepsView), sent about four times a second while it changes.
// Counted in operations, since that is what there is to count: most steps have one per frame, but the frames whose work is already on
// disk have none (`already_done`), and a static camera merges every horizon in one.  Measured from when the run started.
message StepCount {
  string type         = 1;   // OperationType's case: horizon, mergedHorizon, starKeypoints, earthKeypoints, starHomography, earthHomography, horizonConsensus, outliers, merge
  int32  queued       = 2;
  int32  running      = 3;
  int32  done         = 4;   // this run's
  int32  already_done = 5;   // frames of this step finished before the run started, which belong at the done end of the bar
}
message StepProgress {
  repeated StepCount steps = 1;   // in the order the modal stacks them
  bool   graph_built       = 2;   // the run's plan is complete, so a step with nothing to do has been left out; until then every step is listed
  string status            = 3;   // what the run is doing when it cannot be counted in operations (a horizon refinement); empty otherwise
}

// How far a previous run got on the open sequence, read off what it left on disk at the time of the call (macOS SequenceProgressSurvey,
// shown when a sequence is reopened).  Every step this configuration takes has a row, even at zero, with the frames whose artifact is
// already written as `already_done` and the rest `queued`: nothing here is a run's own work, since none is going.
message SequenceProgress {
  string sequence_name   = 1;
  int32  frame_count     = 2;
  int32  frames_complete = 3;   // frames whose finished output is written: what decides whether there is anything left to do
  repeated StepCount steps = 4;
  bool   is_untouched    = 5;   // no step has a single frame done, so the sequence has never been processed
  bool   is_complete     = 6;   // every frame has its output written, so a run would have nothing to merge
  // Work on disk was made by other settings or an older version of star's code, so the next run makes it again (and the output with it):
  // those steps are counted as not done, and the panel says why.
  bool   needs_rebuild   = 7;
}

// Whether this machine can keep its cores busy detecting keypoints on the open sequence at full resolution, and what to suggest when it
// cannot (StarCore's Config.keypointDivisorAdvice, behind the "Speed vs. Sharpness" choice on the last startup prompt).
message KeypointDivisorAdvice {
  bool   available                   = 1;   // false until the sequence's frame size is known: say nothing, do not recommend anything
  bool   reduce_recommended          = 2;   // memory, not the core count, limits full resolution concurrency
  double recommended_divisor         = 3;   // 1.5 when reduce_recommended, else 1
  int64  threshold_pixels            = 4;   // the largest frame this machine can detect on at full resolution without throttling
  int64  image_pixels                = 5;   // this sequence's frame
  int32  full_resolution_concurrency = 6;   // how many keypoint ops run at once at full resolution...
  int32  frame_concurrency           = 7;   // ...against how many the pipeline would run if memory were free
  uint64 physical_memory_bytes       = 8;   // this machine's, for saying so out loud
}

message FrameStateEvent    { int32 frame_index = 1; FrameProcessingState state = 2; }
message FrameSavingEvent   { int32 frame_index = 1; int32 old_state = 2; int32 new_state = 3; }
message OutliersLoaded     { int32 frame_index = 1; int32 state = 2; }
message IoProgress         { int32 current = 1; int32 total = 2; string output_dir = 3; }
// A preview of this frame was written (or replaced in place): a client that cached the old picture should
// drop it.  Every image the pipeline keeps has a view mode a client can ask for.
message ImageSaved         { int32 frame_index = 1; FrameViewMode view_mode = 2; }
// state: "done" | "cancelled" | "error". "error" ends a run that finished with failed operations,
// with message = the failures joined one per line; "done" is only sent for a clean run.
message SequenceStateEvent { string state = 1; string message = 2; }
// Export.Video sends one of these after it has written the video and before the stream ends. The
// request may not have named the file (an empty output_video_path), so this is how a client learns
// where the video went.
message VideoExportedEvent { string output_video_path = 1; }  // absolute

message ExportVideoRequest {
  string              session_id        = 1;
  string              output_video_path = 2;  // empty → daemon derives "<basename>.<muxer>" beside the frames; the VideoExportedEvent says where it went
  VideoEncodeSettings settings          = 3;  // defaults to the session config's persisted settings
}

// Drives the Render Video dialog's cascading pickers. Built from StarCore's enum relationships.
message GetVideoCapabilitiesRequest {}
message VideoCapabilities {
  repeated double     frame_rates = 1;  // FrameRate.allCases rawValues (the standard ones, not Custom)
  repeated CodecCaps  codecs      = 2;
  // The same rates with what each is for, and then Custom as a choice of its own (custom = true; its value is only where the field starts).
  repeated FrameRateCaps frame_rate_caps = 3;
}
// `description` is StarCore's own (English) sentence, which the Mac app's dialog shows too.
message CodecCaps   {
  string codec    = 1;
  repeated EncoderCaps encoders = 2;
  string description = 3;
}
message EncoderCaps {
  string encoder  = 1;
  repeated string pixel_formats = 2;   // names only; the same order as pixel_format_caps
  repeated string muxers = 3;          // names only; the same order as muxer_caps
  string description = 4;
  repeated PixelFormatCaps pixel_format_caps = 5;
  repeated MuxerCaps       muxer_caps        = 6;
}
message FrameRateCaps   { double value = 1; string description = 2; bool custom = 3; }
message PixelFormatCaps { string name = 1; int32 components = 2; int32 bits_per_pixel = 3; string bit_depths = 4; }
// `file_extension` is the file extension of the container, without the dot: Matroska's muxer is "matroska" and its files are ".mkv".
message MuxerCaps       { string name = 1; string description = 2; string file_extension = 3; }

// Where Export.Video would write its video for this container, before any render: the default name the Render Video dialog shows. `muxer` is a
// container name from the capabilities, or empty for the session's own.
message GetDefaultVideoPathRequest  { string session_id = 1; string muxer = 2; }
message GetDefaultVideoPathResponse { string output_video_path = 1; }  // absolute

// ---- Alignment (read-only diagnostics for the Alignment window) ----

message GetAlignmentRequest { string session_id = 1; int32 frame_index = 2; }

// One unary call returns the whole sequence (the window needs all frames at once).
// include_* gate the heavier payloads (homography matrices / aligned-image preview paths).
message GetAlignmentSequenceRequest {
  string session_id        = 1;
  bool   include_homography = 2;
  bool   include_previews   = 3;
}
message AlignmentSequence { repeated AlignmentInfo frames = 1; }  // length = frame_count

message AlignmentInfo {
  int32 frame_index                      = 1;
  bool  has_star_results                 = 2;   // gate star charts
  bool  has_earth_results                = 3;   // gate earth charts
  bool  allow_earth_alignment            = 4;   // Config.allowEarthAlignment
  int32 num_sky_keypoints                = 5;   // -1 = unknown (features not loaded)
  int32 num_earth_keypoints              = 6;   // -1 = unknown
  repeated int32 alignment_frame_indices = 7;   // neighbor indices used
  HomographyResults star                 = 8;   // set iff has_star_results
  HomographyResults earth                = 9;   // set iff has_earth_results
}

// Mirrors StarCore.HomographyResultsCodable.
message HomographyResults {
  int32 frame_index                     = 1;
  repeated NeighborHomography neighbors = 2;   // sorted by neighbor frame_index
  double composite_deviation            = 3;
  bool   alignment_looks_ok             = 4;   // server-side quality (fixes macOS isGood stub)
}

// Mirrors StarCore.AlignmentWarpInfoCodable.
message NeighborHomography {
  int32          frame_index     = 1;   // neighbor frame index; offset = frame_index - base
  double         deviation       = 2;
  AlignmentState state           = 3;
  repeated double homography     = 4;   // row-major 3x3 (len 9); empty when alignment failed/absent
  ImageRef       aligned_preview = 5;   // .starAligned/.failedStarAligned (.preview); set iff include_previews & on disk
  // The per-frame heuristics distrust this warp (StarCore's HomographyResultsCodable.partitionWarps): drawn red on the charts.  Distrusted is not
  // the same as unused: the frame's set is kept whole while enough of it stands up.  Always false for the frame's own entry.
  bool           suspect         = 6;
}

// Mirrors StarCore.AlignmentState rawValues 0..6 exactly.
enum AlignmentState {
  ALIGN_UNABLE_TO_DETECT_KEYPOINTS = 0;
  ALIGN_NOT_ENOUGH_KEYPOINTS       = 1;
  ALIGN_NO_HOMOGRAPHY_FOUND        = 2;
  ALIGN_HOMOGRAPHY_SUCCESS         = 3;
  ALIGN_USED_EXISTING_HOMOGRAPHY   = 4;
  ALIGN_NO_ALIGNMENT               = 5;
  ALIGN_UNKNOWN                    = 6;
}

// ---- Horizon (reference-horizon painting) ----

// Per-column horizon-Y in space_width x space_height coordinates; StarCore scales+interpolates to
// image space. horizon_y length == space_width; -1 = unpainted/all-sky column.
message HorizonColumns {
  int32 space_width      = 1;
  int32 space_height     = 2;
  repeated int32 horizon_y = 3;
}

message SetReferenceHorizonRequest {
  string session_id  = 1;
  int32  frame_index = 2;
  oneof source {
    HorizonColumns columns = 3;   // preferred: per-column horizon line
    string         mask_path = 4; // alt: client wrote a CV_8UC1 {0,255} mask to a scratch path
  }
  bool set_static_reference = 5;  // set config.hasStaticReferenceHorizon (static sequences)
}
message SetReferenceHorizonResponse {
  ImageRef reference_mask = 1;    // path to the written reference mask (for display)
  bool     is_global      = 2;    // true → global reference.tiff; false → per-frame
}

message GetReferenceHorizonRequest { string session_id = 1; int32 frame_index = 2; }
message GetReferenceHorizonResponse {
  bool           exists         = 1;
  ImageRef       reference_mask = 2;   // empty if !exists
  HorizonColumns columns        = 3;   // decoded per-column Y in IMAGE space (for re-painting); empty if !exists
}

message ClearReferenceHorizonRequest { string session_id = 1; int32 frame_index = 2; bool clear_global = 3; }
message ClearReferenceHorizonResponse {}

// Reprocess after a reference-horizon change; streams ProgressEvent like Processing.StreamProgress.
// Deprecated: asks for what Horizon.ReferenceUpdated + Horizon.RunRefinement do, for each edited frame, and
// streams the run's events.  Kept for old clients.
message ReprocessHorizonsRequest { string session_id = 1; repeated int32 edited_frame_indices = 2; }

// ---- Horizon refinement: the work owed after a reference horizon is repainted ----
//
// Repainting a reference changes the horizon of every frame that interpolates from it, so their merged horizon
// masks, and the output rendered through them, are stale.  The daemon keeps the record of which frames are owed
// what (StarCore's HorizonRefinementPlan, the same record the macOS app keeps); the client asks the user whether
// to redo it now or later.

// The reference of `frame_index` was saved.  With apply_to_nearby, the frames that interpolate from it become
// pending (FrameInfo.refinement_pending); without, nothing is recorded.
message HorizonReferenceUpdatedRequest  { string session_id = 1; int32 frame_index = 2; bool apply_to_nearby = 3; }
// How much a re-run would touch, for the "now or later?" question.  Both 0: there is nothing to ask about (and
// nothing was left running).
message HorizonReferenceUpdatedResponse {
  int32 affected_frame_count = 1;   // frames the run would touch
  int32 render_count         = 2;   // of those, the ones it would render again
}
// How far below the reference-derived line the brightness refinement may put the horizon: the horizon painter's
// "↓Npx" stepper.  One value for the whole sequence (horizonReference/tuned_parameters.json).  0 stored means
// "derive it from the refinement search radius", so the effective value, the one in force, is returned beside it.
message TunedHorizonParametersResponse {
  int32 max_downward_extension           = 1;   // as stored; 0 = derive
  int32 effective_max_downward_extension = 2;   // what is actually in force
}
message SetTunedHorizonParametersRequest {
  string session_id = 1;
  int32  max_downward_extension = 2;
}

// Whether any horizon refinement is waiting: what enables "Re-run Horizon Refinement".  Not just the marked
// frames: a reference painted beside another has no frames in between, and still has its own output to render again.
message RefinementStatusResponse {
  bool  pending             = 1;
  int32 pending_frame_count = 2;   // frames marked pending (FrameInfo.refinement_pending)
}
// "Later": keep the work pending, but take away what the old horizon was baked into (merged horizon masks, the
// output rendered through them), so the sequence does not look finished.
message DeferRefinementResponse {}
// "Now": claim the pending work and queue it.  Answered once it is queued; progress and the end of the run are
// reported on the progress stream like any processing run (sequence_state), and Processing.Cancel stops it and
// gives the work back.
message RunRefinementResponse {
  bool started = 1;   // false when there was nothing to run, or a run was already going
}

// Per-frame horizon overlay for the grid (kind drives color: initial=white, merged=blue, reference=green,
// consensus=purple).  A frame has up to one line of each kind, all in `lines`; the single line in `kind`/`y_per_column` is the one
// the final composite reads, so a client that draws one line draws that.
// `isPendingHorizonRefinement` is NOT engine-derived — the client tracks it from edited reference frames.
enum HorizonOverlayKind {
  HORIZON_OVERLAY_KIND_UNSPECIFIED = 0;  // no horizon computed (overlay nil)
  HORIZON_OVERLAY_KIND_INITIAL     = 1;
  HORIZON_OVERLAY_KIND_MERGED      = 2;
  HORIZON_OVERLAY_KIND_REFERENCE   = 3;
  HORIZON_OVERLAY_KIND_CONSENSUS   = 4;  // a moving sequence's horizon consensus, which the composite uses
}
message GetHorizonOverlayRequest  { string session_id = 1; int32 frame_index = 2; int32 width = 3; int32 height = 4; }
message GetHorizonOverlayResponse {
  bool               exists       = 1;
  HorizonOverlayKind kind         = 2;
  repeated int32     y_per_column = 3;   // draw-space Y, length == width
  int32              height       = 4;   // height the overlay was computed at (scaleY divisor)
  bool               refinement_pending = 5;   // see FrameInfo.refinement_pending
  repeated HorizonOverlayLine lines = 6;   // every horizon line the frame has, one per kind, in drawing order (the composite's on top)
}
message HorizonOverlayLine {
  HorizonOverlayKind kind         = 1;
  repeated int32     y_per_column = 2;   // draw-space Y, length == width
  int32              height       = 3;   // height the line was computed at (scaleY divisor)
}

// ---- Horizon: interactive band detection (the live painter) ----

// Which StarCore detector to run on the painted band:
//   COMBINED_SIOX = computeCombinedHorizonInBand (initial detect once the band spans the frame)
//   RANDOM_WALKER = computeRandomWalkerHorizon   (edge-aware sky/ground refinement)
enum HorizonBandMethod {
  HORIZON_BAND_METHOD_UNSPECIFIED   = 0;
  HORIZON_BAND_METHOD_COMBINED_SIOX = 1;
  HORIZON_BAND_METHOD_RANDOM_WALKER = 2;
}

// Run a horizon detector over a user-painted band. All per-column arrays are in
// space_width x space_height coords, length == space_width; -1 = unset/unpainted column.
// top/bottom_boundary_y are required; known_*_y are optional (leave empty to pass nil).
message ComputeHorizonInBandRequest {
  string            session_id  = 1;
  int32             frame_index = 2;
  HorizonBandMethod method      = 3;
  int32             space_width  = 4;
  int32             space_height = 5;
  repeated int32    top_boundary_y         = 6;
  repeated int32    bottom_boundary_y      = 7;
  repeated int32    known_sky_floor_y      = 8;  // empty => nil
  repeated int32    known_ground_ceiling_y = 9;  // empty => nil
  double            beta = 10;                   // RANDOM_WALKER edge sensitivity; <= 0 => engine default (90)
}
message ComputeHorizonInBandResponse {
  HorizonColumns columns = 1;   // per-column horizon Y in the same coords; -1 = column with no result
}

// Best existing horizon (user reference > merged > raw) as a per-column line, for seeding the
// painter when re-opening a frame that already has a (possibly auto-computed) horizon.
message GetBestHorizonRequest  { string session_id = 1; int32 frame_index = 2; int32 space_width = 3; int32 space_height = 4; }
message GetBestHorizonResponse {
  bool           exists  = 1;
  HorizonColumns columns = 2;   // empty if !exists
}
