name: pr-gate

# The fast check every PR must pass before the pipeline merges it (plans/PIPELINE.md §8.5, §15).
# Target: 30 minutes. No path filter on the workflow, so there is always a result for the head SHA.
# When a PR changes only paths that cannot affect the star program, the `changes` job says so and
# the heavy `linux` and `macos` jobs are skipped (a skipped job counts as green); `static` always runs.
# The slow workflows (Gherkin smoke, the installers, wgpu) are not part of this gate; they block a merge only
# when they fail on a PR where develop passes them. The full Gherkin matrix is post-merge only.
#
# Not in this first version: a Windows job (cli.yml's windows job needs ~190 lines of MSVC/SDK
# pinning and is red on develop today). It joins once that is fixed.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  # a newer push to develop supersedes the older develop runs still going; the pipeline's develop watch skips cancelled
  # runs, so the CI judge's baseline stays the last run that ended success or failure.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

jobs:
  # ─── does the change touch the program at all? The one place that decides ─────────
  # The list mirrors paths-ignore in cli.yml (glob syntax there, `case` syntax here: `*` crosses `/`).
  # Only pull_request is narrowed: a push to develop or a manual run always builds, because develop's
  # result is the baseline the pipeline's CI judge compares PRs with.
  # ─── OpenCV: built once per OS per key by opencv.yml (cache, then the opencv-prebuilt release, then a build) ───
  opencv-linux:
    name: OpenCV (linux)
    needs: changes
    if: needs.changes.outputs.program == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/opencv.yml
    with:
      platforms: linux

  opencv-macos:
    name: OpenCV (macos)
    needs: changes
    if: needs.changes.outputs.program == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/opencv.yml
    with:
      platforms: macos

  changes:
    name: changed paths
    runs-on: ubuntu-24.04
    outputs:
      program: ${{ steps.decide.outputs.program }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Does the change touch the program?
        id: decide
        run: |
          program=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            # the checkout is the PR's merge commit: HEAD^1 is the base tip, so this is the PR's own files.
            # --no-renames lists both sides of a move, so a file moved out of a program path still counts
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            echo "Changed files:"; echo "$files"
            if [ -n "$files" ]; then
              program=false
              while IFS= read -r f; do
                case "$f" in
                  pipeline/*|plans/*|docs/*|.claude/*|*.md|.github/ISSUE_TEMPLATE/*) ;;
                  *) program=true; echo "Touches the program: $f"; break ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "program=$program"
          echo "program=$program" >> "$GITHUB_OUTPUT"

  # ─── static checks and the pipeline's own tests: seconds, no OpenCV ─────────────
  static:
    name: static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localization catalogue
        run: python3 i18n/check.py

      - name: Set up Swift (for the Gherkin generator)
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.0'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install the Gherkin parser
        run: gem install cucumber-gherkin -v 42.0.1 --no-document

      - name: Generated Gherkin files are current
        run: |
          gherkin/generate.sh
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date: run gherkin/generate.sh and commit the result"
            git --no-pager diff
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
          cache-cleanup: on-success

      # Plugin resolution from plugins.gradle.org fails transiently ("Could not parse POM"); try once more before going red.
      - name: Proto is in sync with the daemon
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 20
          shell: bash
          command: cd star-desktop && ./gradlew checkProtoSync --no-daemon

      - uses: astral-sh/setup-uv@v5

      - name: Pipeline lint, types and tests
        working-directory: pipeline
        run: |
          uv run ruff check .
          uv run pyright
          uv run pytest -q

  # ─── Linux ───────────────────────────────────────────────────────────────────
  linux:
    name: Linux build + tests (ubuntu-24.04)
    needs: [changes, opencv-linux]
    if: needs.changes.outputs.program == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install apt prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make git pkg-config perl \
            libeigen3-dev zlib1g-dev libpng-dev libtiff-dev libjpeg-dev \
            libcurl4-openssl-dev

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.0'

      - name: Download OpenCV
        uses: actions/download-artifact@v4
        with:
          name: opencv-linux
          path: opencv

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/linux
            StarDecisionTrees/include/release/linux
          key: dt-linux-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/linux/libStarDecisionTrees.a ]; then
            cd StarDecisionTrees && bash release.sh
          fi

      - name: Build cli and daemon
        run: |
          swift build --package-path cli
          swift build --package-path daemon

      # `tee` would hide swift test's exit status without pipefail; bash -e -o pipefail is the default shell here
      - name: StarCore tests
        run: swift test --package-path StarCore 2>&1 | tee starcore-test.log

      - name: Daemon tests
        run: swift test --package-path daemon 2>&1 | tee daemon-test.log

      - name: Prove tests ran (not a vacuous green)
        run: |
          for log in starcore-test.log daemon-test.log; do
            n=$(grep -Eo 'Executed [0-9]+ tests' "$log" | tail -1 | grep -Eo '[0-9]+' || echo 0)
            echo "$log: $n tests"
            [ "$n" -ge 1 ] || { echo "::error::$log executed no tests"; exit 1; }
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-linux-logs
          path: '*-test.log'

  # ─── macOS ───────────────────────────────────────────────────────────────────
  # macos-15, not macos-14: GitHub retires the macos-14 image on 2026-11-02 and its brownouts already cancel
  # this job (https://github.com/actions/runner-images/issues/13518). OpenCV comes from opencv.yml (its
  # macos15 key leaves the macos-14 jobs' opencv-macos- caches alone). The StarDecisionTrees cache below has its
  # own macos15 key: its .swiftmodule only imports under the compiler that built it (see gherkin.yml), so it must
  # not restore what cli.yml's macos-14 jobs saved under the plain key.
  macos:
    name: macOS build + tests (macos-15)
    needs: [changes, opencv-macos]
    if: needs.changes.outputs.program == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Eigen3 via Homebrew
        run: brew install eigen

      - name: Download OpenCV
        uses: actions/download-artifact@v4
        with:
          name: opencv-macos
          path: opencv

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/macos
            StarDecisionTrees/include/release/macos
          key: dt-macos15-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/macos/libStarDecisionTrees.a ]; then
            cd StarDecisionTrees && ./release.sh
          fi

      - name: Build cli and daemon
        run: |
          swift build --package-path cli
          swift build --package-path daemon

      - name: StarCore tests
        run: swift test --package-path StarCore 2>&1 | tee starcore-test.log

      - name: Prove tests ran (not a vacuous green)
        run: |
          n=$(grep -Eo 'Executed [0-9]+ tests' starcore-test.log | tail -1 | grep -Eo '[0-9]+' || echo 0)
          echo "StarCore: $n tests"
          [ "$n" -ge 1 ] || { echo "::error::StarCore executed no tests"; exit 1; }

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-macos-log
          path: starcore-test.log
