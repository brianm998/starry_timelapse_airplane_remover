name: Gherkin

# Scenario features (gherkin/features/*.feature) driven through three Star clients. ONE JOB PER (client, OS, feature):
# the matrix of each client is generated (gherkin/generated/features-<client>.json) and every job runs exactly one feature
# and fetches only the datasets it needs (gherkin/generated/feature-datasets-<client>.json), EXCEPT the @ui features (uiXxx, a
# few clicks each and no datasets) of the mac-gui and desktop legs: those share ONE job per leg, the matrix entry `ui`, because a
# job apiece paid for a full build of the app, stard or Star.app to run a few clicks.  Legs:
#   cli-linux, cli-windows, cli-macos  XCTest running the built `star` binary as a subprocess
#   mac-gui                       XCUITest against Star.app (hosted macOS runners ship with UI automation
#                                 mode enabled: no `automationmodetool` step here)
#   desktop-linux/-windows/-macos runComposeUiTest against a real stard, offscreen (no Xvfb)
# plus generate-check, which regenerates every generated file and fails on a diff.
#
# Test data is fetched from the `test-data` release (test_data/datasets.json) into .test-data by every job, and is NOT cached:
# one actions/cache entry per (client, feature) held 7.6 GiB of the ~9.9 GiB in use against the repository's 10 GB Actions cache limit
# (the same dataset stored once per feature that uses it), so every save evicted something that was expensive to rebuild (the
# macOS and Windows ffmpeg, the Windows OpenCV and StarDecisionTrees) and those rebuilt on every run.  A release download is seconds; see
# https://docs.github.com/actions/using-workflows/caching-dependencies-to-speed-up-workflows#usage-limits-and-eviction-policy
#
# Every leg ends with a "vacuous green" check: it fails the job unless the log (or the Gradle XML) shows
# exactly one test that ran, passed and was not skipped. Exit codes alone are not proof: xcodebuild
# -only-testing matching nothing exits 0 having run nothing.
#
# The trail-removal features (removeAirplanes, autoPreservation…, selectiveRemovesOnlyTrails) also run trail_tools'
# `star-removal-verify` as a subprocess, so those jobs (and only those: the list is the `if:` of the "trail verifier" steps) build
# trail_tools in release first. Its reports and crops ride on each job's gherkin-artifacts upload. See gherkin/README.md.
#
# DUPLICATED ON PURPOSE (collapse into reusable workflows later, see gherkin/README.md): the apt/Eigen/
# Swift/MSVC/OpenCV/StarDecisionTrees setup of cli.yml's `linux`/`macos`/`windows` jobs, the stard build
# steps of kotlin-client.yml's linux-package/windows-package/macos-signed jobs, and cli.yml's
# ci-assets fetch for the GUI. Their cache keys are shared with those jobs.

on:
  push:
    branches: [main, develop]
    paths:
      - 'gherkin/**'
      - 'test_data/**'
      - 'cli/**'
      - 'gui/**'
      - 'star-desktop/**'
      - 'daemon/**'
      - 'StarCore/**'
      - 'StarCpp/**'
      - 'trail_tools/**'
      - '.github/workflows/gherkin.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'gherkin/**'
      - 'test_data/**'
      - 'cli/**'
      - 'gui/**'
      - 'star-desktop/**'
      - 'daemon/**'
      - 'StarCore/**'
      - 'StarCpp/**'
      - 'trail_tools/**'
      - '.github/workflows/gherkin.yml'
  workflow_dispatch:
    inputs:
      features:
        description: 'Comma-separated feature names to run (default: all), e.g. autoHorizonJpeg,selectiveHorizonTiff16'
        required: false
        default: ''

concurrency:
  group: gherkin-${{ github.workflow }}-${{ github.ref }}
  # a newer push to develop supersedes the older develop runs still going, so a burst of pushes does not queue several
  # long runs; release tags have their own group and are never cancelled. The pipeline's develop watch skips cancelled
  # runs, so the CI judge's baseline stays the last run that ended success or failure.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

jobs:
  # ─── The matrix: which features each client runs ─────────────────────────────
  # From the generated lists, optionally narrowed by the workflow_dispatch `features` input.
  features:
    name: feature matrix
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.m.outputs.cli }}
      macgui: ${{ steps.m.outputs.macgui }}
      macgui_ui: ${{ steps.m.outputs.macgui_ui }}
      desktop: ${{ steps.m.outputs.desktop }}
      desktop_ui: ${{ steps.m.outputs.desktop_ui }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          ONLY: ${{ inputs.features }}
        run: |
          for c in cli mac-gui desktop; do
            if [ -n "$ONLY" ]; then
              arr=$(jq -c --arg only "$ONLY" '[ .[] | select(. as $f | ($only | split(",") | map(gsub("[ ]";"")) | index($f)) != null) ]' "gherkin/generated/features-$c.json")
            else
              arr=$(jq -c . "gherkin/generated/features-$c.json")
            fi
            # The @ui features of the mac-gui and desktop legs run as one job each, the entry `ui` of that leg's matrix (<leg>_ui lists them).
            # Every other feature, and every cli feature, stays a job of its own.
            if [ "$c" != cli ]; then
              ui=$(jq -c '[ .[] | select(startswith("ui")) ]' <<<"$arr")
              arr=$(jq -c --argjson ui "$ui" '[ .[] | select(startswith("ui") | not) ] + (if ($ui | length) > 0 then ["ui"] else [] end)' <<<"$arr")
              echo "${c//-/}_ui=$ui" >> "$GITHUB_OUTPUT"
            fi
            echo "$c: $arr"
            echo "${c//-/}=$arr" >> "$GITHUB_OUTPUT"
          done

  # ─── Generated files are in sync ─────────────────────────────────────────────
  # A real regeneration with the CURRENT cucumber-gherkin, diffed against what is committed. Safe because
  # the generator keeps only feature/scenario names, tags and step keyword + text, so gherkin 9.0.0 (the
  # iMac's) and this gem produce byte-identical output.
  generate-check:
    name: generated files are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.0'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install the Gherkin parser
        run: gem install cucumber-gherkin -v 42.0.1 --no-document

      - name: Regenerate
        run: gherkin/generate.sh

      - name: Fail if anything changed
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date: run gherkin/generate.sh and commit the result"
            git --no-pager diff
            exit 1
          fi

  # ─── cli, Linux ──────────────────────────────────────────────────────────────
  cli-linux:
    name: cli (ubuntu-24.04) · ${{ matrix.feature }}
    runs-on: ubuntu-24.04
    needs: [features, ffmpeg-linux]
    if: needs.features.outputs.cli != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.features.outputs.cli) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Name of this feature's test
        id: t
        shell: bash
        run: |
          f="${{ matrix.feature }}"
          echo "name=test$(echo "${f:0:1}" | tr a-z A-Z)${f:1}Feature" >> "$GITHUB_OUTPUT"

      # Test data comes from the `test-data` release via test_data/datasets.json (see test_data/README.md); the list of what
      # this client needs is generated (gherkin/generated/datasets-cli.txt), never maintained by hand.
      - name: Fetch test data
        run: test_data/fetch.sh $(jq -r '.["${{ matrix.feature }}"][]' gherkin/generated/feature-datasets-cli.json)

      - name: Install apt prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make git pkg-config perl dpkg-dev zip \
            libeigen3-dev zlib1g-dev libpng-dev libtiff-dev libjpeg-dev \
            libcurl4-openssl-dev

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.0'

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/linux
            opencv/include
          key: opencv-linux-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/linux
            StarDecisionTrees/include/release/linux
          key: dt-linux-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/linux/libopencv2.a ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/linux/libStarDecisionTrees.a ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      # ffmpeg/ffprobe for video import, the output video and the validator: the ffmpeg-gpu.yml artifact of this OS.
      - name: Fetch ffmpeg/ffprobe
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-linux-x64
          path: external_binaries/bin

      - name: Make ffmpeg/ffprobe executable and point STAR_FFMPEG_DIR at them
        shell: bash
        run: |
          chmod +x external_binaries/bin/ffmpeg external_binaries/bin/ffprobe || true
          echo "STAR_FFMPEG_DIR=$GITHUB_WORKSPACE/external_binaries/bin" >> "$GITHUB_ENV"

      # removal_tools/star-output-verify: every client's runner calls it for the validation steps.
      - name: Build the output validator
        shell: bash
        run: swift build -c release --package-path removal_tools

      # trail_tools/star-removal-verify: the trail-removal features' Then steps run it as a subprocess (the output validator above is unrelated).
      - name: Build the trail verifier (release)
        if: ${{ contains(fromJSON('["removeAirplanes","autoPreservationKeepsAirplanesOutJpeg","autoPreservationKeepsAirplanesOutBit16","selectiveRemovesOnlyTrails","syntheticSatellites","syntheticAirplanes"]'), matrix.feature) }}
        shell: bash
        run: |
          swift build -c release --package-path trail_tools
          echo "STAR_REMOVAL_REPORTS=${{ runner.temp }}/gherkin-artifacts/removal" >> "$GITHUB_ENV"

      - name: Run the Gherkin features against the built star
        # Release: the debug star took 22 min on this sequence. -enable-testing because the cli's other test target
        # is `@testable import star` and --filter still compiles every test target. One release compile.
        # --disable-swift-testing: without it, swift test runs a second (Swift Testing) pass that starts the `star` executable
        # inside the test binary, which parses `-c release` as star's own -c flag and exits 1 after the XCTest pass.
        run: swift test -c release -Xswiftc -enable-testing --disable-swift-testing --package-path cli --filter "GherkinTests.GeneratedFeatureTests/${{ steps.t.outputs.name }}" 2>&1 | tee gherkin-cli.log

      - name: Prove the scenario ran (not a vacuous green)
        run: |
          grep -E "${{ steps.t.outputs.name }}.*passed" gherkin-cli.log
          grep -E "Executed 1 test, with 0 failures" gherkin-cli.log
          ! grep -E "${{ steps.t.outputs.name }}.*skipped" gherkin-cli.log

  # ─── cli, Windows ────────────────────────────────────────────────────────────
  # Same toolchain pinning and cache keys as cli.yml's `windows` job and desktop-windows below, so the three share caches.
  # Packaging and DLL bundling are not under test here (cli.yml's windows / windows-e2e cover them): star.exe runs from the
  # build tree with the toolchain on PATH.

      - name: Upload the validator reports and run configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-cli-linux-${{ matrix.feature }}-artifacts
          path: ${{ runner.temp }}/gherkin-artifacts
          if-no-files-found: warn

  cli-windows:
    name: cli (windows-2022) · ${{ matrix.feature }}
    runs-on: windows-2022
    needs: [features, ffmpeg-windows]
    if: needs.features.outputs.cli != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.features.outputs.cli) }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash  # Git Bash; matches cli.yml's `windows` job
    steps:
      - uses: actions/checkout@v4

      - name: Name of this feature's test
        id: t
        shell: bash
        run: |
          f="${{ matrix.feature }}"
          echo "name=test$(echo "${f:0:1}" | tr a-z A-Z)${f:1}Feature" >> "$GITHUB_OUTPUT"

      - name: Fetch test data
        run: test_data/fetch.sh $(jq -r '.["${{ matrix.feature }}"][]' gherkin/generated/feature-datasets-cli.json)

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE

      - name: Install Eigen3 to C:/eigen3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest `
            -Uri 'https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip' `
            -OutFile "$env:RUNNER_TEMP\eigen.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\eigen.zip" -DestinationPath C:\
          Move-Item C:\eigen-3.4.0 C:\eigen3

      - name: Install MSVC 14.40 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $vsPath    = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $proc = Start-Process -FilePath $installer -ArgumentList @(
              'modify',
              '--installPath', "`"$vsPath`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.14.40.17.10.x86.x64',
              '--quiet', '--norestart', '--nocache'
          ) -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -notin 0,3010) {
              throw "VS Installer failed (exit code $($proc.ExitCode))"
          }
          $toolsetDir = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory `
              | Where-Object { $_.Name -like '14.40.*' } | Select-Object -First 1
          if (-not $toolsetDir) {
              throw "MSVC 14.40 toolset not found under $vsPath\VC\Tools\MSVC after install"
          }

      - name: Pin MSVC dev env to 14.40 + Windows SDK 10.0.22621.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          $output = & cmd /c "`"$vcvars`" 10.0.22621.0 -vcvars_ver=14.40 && set"
          $wanted = @(
              'INCLUDE','LIB','LIBPATH','PATH',
              'VCINSTALLDIR','VCToolsInstallDir','VCToolsVersion',
              'VSINSTALLDIR','WindowsSdkDir','WindowsSDKVersion','UCRTVersion'
          )
          foreach ($line in $output) {
              if ($line -match '^([A-Za-z_][A-Za-z0-9_(\)]*)=(.*)$') {
                  $name = $matches[1]; $value = $matches[2]
                  if ($wanted -contains $name) {
                      "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  }
              }
          }

      - name: Install Swift modulemaps into the pinned SDK and MSVC toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $share = Join-Path $env:SDKROOT 'usr\share'
          if (-not (Test-Path $share)) {
              throw "Swift SDK share dir not found at $share (SDKROOT=$env:SDKROOT)"
          }
          $sdkVer = $env:WindowsSDKVersion.TrimEnd('\')
          $sdkInc = Join-Path $env:WindowsSdkDir "Include\$sdkVer"
          $vcInc  = Join-Path $env:VCToolsInstallDir 'include'
          $copies = @(
              @{ src='ucrt.modulemap';     dst=(Join-Path $sdkInc 'ucrt\module.modulemap') },
              @{ src='winsdk.modulemap';   dst=(Join-Path $sdkInc 'um\module.modulemap')   },
              @{ src='visualc.modulemap';  dst=(Join-Path $vcInc  'module.modulemap')      },
              @{ src='visualc.apinotes';   dst=(Join-Path $vcInc  'visualc.apinotes')      }
          )
          foreach ($c in $copies) {
              $src = Join-Path $share $c.src
              if (Test-Path $src) {
                  $dstDir = Split-Path $c.dst -Parent
                  New-Item -ItemType Directory -Force -Path $dstDir | Out-Null
                  Copy-Item -Force $src $c.dst
              }
          }

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/windows
            opencv/include
          key: opencv-windows-msvc14.40-sdk22621-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/windows
            StarDecisionTrees/include/release/windows
          key: dt-windows-msvc14.40-sdk22621-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/windows/opencv2.lib ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/windows/StarDecisionTrees.lib ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      - name: Build star (release)
        # Do not set CL=/D... globally, it breaks OpenCV's CMake compiler probe (see release_windows.sh).
        run: |
          swift build -c release --package-path cli
          BIN="$(swift build -c release --package-path cli --show-bin-path)"
          ls "$BIN"/star.exe
          # Windows-style paths for the test process, which does not understand Git Bash's /d/a/...
          echo "STAR_CLI_PATH=$(cygpath -w "$BIN/star.exe")" >> "$GITHUB_ENV"
          echo "STAR_TEST_DATA=$(cygpath -w "$GITHUB_WORKSPACE/.test-data")" >> "$GITHUB_ENV"

      # ffmpeg/ffprobe for video import, the output video and the validator: the ffmpeg-gpu.yml artifact of this OS.
      - name: Fetch ffmpeg/ffprobe
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows-x64
          path: external_binaries/bin

      - name: Make ffmpeg/ffprobe executable and point STAR_FFMPEG_DIR at them
        shell: bash
        run: |
          chmod +x external_binaries/bin/ffmpeg.exe external_binaries/bin/ffprobe.exe || true
          echo "STAR_FFMPEG_DIR=$GITHUB_WORKSPACE/external_binaries/bin" >> "$GITHUB_ENV"

      # removal_tools/star-output-verify: every client's runner calls it for the validation steps.
      - name: Build the output validator
        shell: bash
        run: swift build -c release --package-path removal_tools

      # trail_tools/star-removal-verify: the trail-removal features' Then steps run it as a subprocess (the output validator above is unrelated).
      - name: Build the trail verifier (release)
        if: ${{ contains(fromJSON('["removeAirplanes","autoPreservationKeepsAirplanesOutJpeg","autoPreservationKeepsAirplanesOutBit16","selectiveRemovesOnlyTrails","syntheticSatellites","syntheticAirplanes"]'), matrix.feature) }}
        shell: bash
        run: |
          swift build -c release --package-path trail_tools
          BIN="$(swift build -c release --package-path trail_tools --show-bin-path)"
          ls "$BIN"/star-removal-verify.exe
          echo "STAR_REMOVAL_VERIFY=$(cygpath -w "$BIN/star-removal-verify.exe")" >> "$GITHUB_ENV"
          echo "STAR_REMOVAL_REPORTS=$(cygpath -w "$RUNNER_TEMP/gherkin-artifacts/removal")" >> "$GITHUB_ENV"

      - name: Run the Gherkin features against the built star
        # Flags as in cli-linux (release, -enable-testing for the other test target, --disable-swift-testing).
        run: swift test -c release -Xswiftc -enable-testing --disable-swift-testing --package-path cli --filter "GherkinTests.GeneratedFeatureTests/${{ steps.t.outputs.name }}" 2>&1 | tee gherkin-cli.log

      - name: Prove the scenario ran (not a vacuous green)
        run: |
          grep -E "${{ steps.t.outputs.name }}.*passed" gherkin-cli.log
          grep -E "Executed 1 test, with 0 failures" gherkin-cli.log
          ! grep -E "${{ steps.t.outputs.name }}.*skipped" gherkin-cli.log

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-cli-windows-${{ matrix.feature }}-log
          path: gherkin-cli.log
          if-no-files-found: warn

  # ─── cli, macOS ──────────────────────────────────────────────────────────────

      - name: Upload the validator reports and run configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-cli-windows-${{ matrix.feature }}-artifacts
          path: ${{ runner.temp }}/gherkin-artifacts
          if-no-files-found: warn

  cli-macos:
    name: cli (macos-15) · ${{ matrix.feature }}
    runs-on: macos-15
    needs: [features, ffmpeg-macos]
    if: needs.features.outputs.cli != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.features.outputs.cli) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Name of this feature's test
        id: t
        shell: bash
        run: |
          f="${{ matrix.feature }}"
          echo "name=test$(echo "${f:0:1}" | tr a-z A-Z)${f:1}Feature" >> "$GITHUB_OUTPUT"

      # Test data comes from the `test-data` release via test_data/datasets.json (see test_data/README.md); the list of what
      # this client needs is generated (gherkin/generated/datasets-cli.txt), never maintained by hand.
      - name: Fetch test data
        run: test_data/fetch.sh $(jq -r '.["${{ matrix.feature }}"][]' gherkin/generated/feature-datasets-cli.json)

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The StarDecisionTrees .swiftmodule only imports under the compiler that built it, and cli.yml's macos-14 jobs share the plain
      # dt-macos key with a different Swift: key this one on the toolchain.
      - name: Toolchain id for the cache key
        id: toolchain
        run: echo "id=$(xcodebuild -version | tr -c 'A-Za-z0-9.\n' _ | tr '\n' - | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      - name: Install Eigen3 via Homebrew
        run: brew install eigen

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/macos
            opencv/include
          key: opencv-macos-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/macos
            StarDecisionTrees/include/release/macos
          key: dt-macos-${{ steps.toolchain.outputs.id }}-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/macos/libopencv2.a ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/macos/libStarDecisionTrees.a ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      # ffmpeg/ffprobe for video import, the output video and the validator: the ffmpeg-gpu.yml artifact of this OS.
      - name: Fetch ffmpeg/ffprobe
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-macos-universal
          path: external_binaries/bin

      - name: Make ffmpeg/ffprobe executable and point STAR_FFMPEG_DIR at them
        shell: bash
        run: |
          chmod +x external_binaries/bin/ffmpeg external_binaries/bin/ffprobe || true
          echo "STAR_FFMPEG_DIR=$GITHUB_WORKSPACE/external_binaries/bin" >> "$GITHUB_ENV"

      # removal_tools/star-output-verify: every client's runner calls it for the validation steps.
      - name: Build the output validator
        shell: bash
        run: swift build -c release --package-path removal_tools

      # trail_tools/star-removal-verify: the trail-removal features' Then steps run it as a subprocess (the output validator above is unrelated).
      - name: Build the trail verifier (release)
        if: ${{ contains(fromJSON('["removeAirplanes","autoPreservationKeepsAirplanesOutJpeg","autoPreservationKeepsAirplanesOutBit16","selectiveRemovesOnlyTrails","syntheticSatellites","syntheticAirplanes"]'), matrix.feature) }}
        shell: bash
        run: |
          swift build -c release --package-path trail_tools
          echo "STAR_REMOVAL_REPORTS=${{ runner.temp }}/gherkin-artifacts/removal" >> "$GITHUB_ENV"

      - name: Run the Gherkin features against the built star
        # Release: the debug star took 22 min on this sequence. -enable-testing because the cli's other test target
        # is `@testable import star` and --filter still compiles every test target. One release compile.
        # --disable-swift-testing: without it, swift test runs a second (Swift Testing) pass that starts the `star` executable
        # inside the test binary, which parses `-c release` as star's own -c flag and exits 1 after the XCTest pass.
        run: swift test -c release -Xswiftc -enable-testing --disable-swift-testing --package-path cli --filter "GherkinTests.GeneratedFeatureTests/${{ steps.t.outputs.name }}" 2>&1 | tee gherkin-cli.log

      - name: Prove the scenario ran (not a vacuous green)
        run: |
          grep -E "${{ steps.t.outputs.name }}.*passed" gherkin-cli.log
          grep -E "Executed 1 test, with 0 failures" gherkin-cli.log
          ! grep -E "${{ steps.t.outputs.name }}.*skipped" gherkin-cli.log

  # ─── macOS gui ───────────────────────────────────────────────────────────────
  # ffmpeg/ffprobe are bundled into Star.app by the Xcode project, so the build needs them (cli.yml's
  # macos-signed-release job fetches the same artifact the same way).

      - name: Upload the validator reports and run configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-cli-macos-${{ matrix.feature }}-artifacts
          path: ${{ runner.temp }}/gherkin-artifacts
          if-no-files-found: warn

  # ffmpeg-gpu.yml once per OS, so a leg waits for the ffmpeg of its own OS only.  One call for all three made every job wait for
  # the slowest build, and when the macOS or Windows cache was cold (20+ minutes) the Linux jobs sat behind it.
  ffmpeg-linux:
    uses: ./.github/workflows/ffmpeg-gpu.yml
    with:
      platforms: linux

  ffmpeg-macos:
    uses: ./.github/workflows/ffmpeg-gpu.yml
    with:
      platforms: macos

  ffmpeg-windows:
    uses: ./.github/workflows/ffmpeg-gpu.yml
    with:
      platforms: windows

  mac-gui:
    name: mac gui (macos-15) · ${{ matrix.feature }}
    runs-on: macos-15
    needs: [features, ffmpeg-macos]
    if: needs.features.outputs.macgui != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.features.outputs.macgui) }}
    # the `ui` job runs every @ui feature one after the other in the one build
    timeout-minutes: ${{ matrix.feature == 'ui' && 120 || 90 }}
    steps:
      - uses: actions/checkout@v4

      # The matrix entry `ui` is every @ui feature of this client in one job (see the top of this file); any other entry is one feature.
      # Either way this lists what the job runs.
      - name: Which features this job runs
        id: t
        shell: bash
        env:
          UI: ${{ needs.features.outputs.macgui_ui }}
        run: |
          f="${{ matrix.feature }}"
          if [ "$f" = ui ]; then features=$(jq -r 'join(" ")' <<<"$UI"); else features=$f; fi
          only=""; count=0
          for n in $features; do
            only="$only -only-testing:starUITests/GeneratedFeatureUITests/test$(echo "${n:0:1}" | tr a-z A-Z)${n:1}Feature"
            count=$((count + 1))
          done
          { echo "features=$features"; echo "only=$only"; echo "count=$count"; } >> "$GITHUB_OUTPUT"

      # Test data comes from the `test-data` release via test_data/datasets.json (see test_data/README.md); the list of what
      # this client needs is generated (gherkin/generated/datasets-mac-gui.txt), never maintained by hand.
      - name: Fetch test data
        env:
          FEATURES: ${{ steps.t.outputs.features }}
        run: |
          names=$(for f in $FEATURES; do jq -r --arg f "$f" '.[$f][]' gherkin/generated/feature-datasets-mac-gui.json; done | sort -u)
          test_data/fetch.sh $names gui_splash_video

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The StarDecisionTrees .swiftmodule only imports under the compiler that built it, and cli.yml's macos-14 jobs share the plain
      # dt-macos key with a different Swift: key this one on the toolchain.
      - name: Toolchain id for the cache key
        id: toolchain
        run: echo "id=$(xcodebuild -version | tr -c 'A-Za-z0-9.\n' _ | tr '\n' - | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      - name: Install Eigen3 via Homebrew
        run: brew install eigen

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/macos
            opencv/include
          key: opencv-macos-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/macos
            StarDecisionTrees/include/release/macos
          key: dt-macos-${{ steps.toolchain.outputs.id }}-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/macos/libopencv2.a ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/macos/libStarDecisionTrees.a ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      # The GUI's Xcode project bundles gui/videos/*.mp4 (too big for git). The splash video comes from the same
      # checksum-verified manifest as the test data, fetched above.
      - name: Put the splash video where the Xcode project expects it
        run: |
          mkdir -p gui/videos
          cp .test-data/gui_splash_video/*.mp4 gui/videos/
          ls -lh gui/videos

      # ffmpeg/ffprobe for video import, the output video and the validator: the ffmpeg-gpu.yml artifact of this OS.
      - name: Fetch ffmpeg/ffprobe
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-macos-universal
          path: external_binaries/bin

      - name: Make ffmpeg/ffprobe executable and point STAR_FFMPEG_DIR at them
        shell: bash
        run: |
          chmod +x external_binaries/bin/ffmpeg external_binaries/bin/ffprobe || true
          echo "STAR_FFMPEG_DIR=$GITHUB_WORKSPACE/external_binaries/bin" >> "$GITHUB_ENV"

      # removal_tools/star-output-verify: every client's runner calls it for the validation steps.  The @ui features (uiXxx) have none,
      # and it links all of StarCore: 3 to 6 minutes of building for a job that goes on to run a few clicks.
      - name: Build the output validator
        if: ${{ !startsWith(matrix.feature, 'ui') }}
        shell: bash
        run: swift build -c release --package-path removal_tools

      # trail_tools/star-removal-verify: the trail-removal features' Then steps run it as a subprocess (the output validator above is unrelated).
      - name: Build the trail verifier (release)
        if: ${{ contains(fromJSON('["removeAirplanes","autoPreservationKeepsAirplanesOutJpeg","autoPreservationKeepsAirplanesOutBit16","selectiveRemovesOnlyTrails","syntheticSatellites","syntheticAirplanes"]'), matrix.feature) }}
        shell: bash
        run: |
          swift build -c release --package-path trail_tools

      # Release, but ENABLE_TESTABILITY=YES: the scheme's other test target (starTests) is `@testable import Star`, and Release
      # builds every test target even under -only-testing.
      # Never -target Star (bogus module errors) and no -destination (errors on this scheme): see gherkin/README.md.
      # Signed ad hoc ("-"): the UI-test runner has to be signed to run, but there is no identity on a hosted runner.
      - name: Run the Gherkin features in Star.app (XCUITest)
        env:
          # xcodebuild strips TEST_RUNNER_ and hands STAR_TEST_DATA to the UI-test runner
          TEST_RUNNER_STAR_TEST_DATA: ${{ github.workspace }}/.test-data
          # A hosted macOS VM can have under 2GB free, below star's default memory floor, so it admits nothing; the runner forwards this to the app
          STAR_SYSTEM_FLOOR_MB: 512
          TEST_RUNNER_STAR_SYSTEM_FLOOR_MB: 512
          TEST_RUNNER_STAR_FFMPEG_DIR: ${{ github.workspace }}/external_binaries/bin
        run: |
          set -o pipefail
          xcodebuild test \
            -project gui/star.xcodeproj \
            -scheme star \
            -configuration Release \
            ENABLE_TESTABILITY=YES \
            ${{ steps.t.outputs.only }} \
            -resultBundlePath "$RUNNER_TEMP/gherkin-gui.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee gherkin-gui.log

      - name: Prove the scenarios ran (not a vacuous green)
        env:
          FEATURES: ${{ steps.t.outputs.features }}
          COUNT: ${{ steps.t.outputs.count }}
        run: |
          if [ "$COUNT" = 1 ]; then ran="Executed 1 test, with 0 failures"; else ran="Executed $COUNT tests, with 0 failures"; fi
          grep -E "$ran" gherkin-gui.log
          # every "Executed N tests" line must be that one: nothing else ran, nothing was skipped
          ! grep -E "Executed [0-9]+ tests?" gherkin-gui.log | grep -v "$ran"
          for n in $FEATURES; do
            grep -E "Test [Cc]ase '.*test$(echo "${n:0:1}" | tr a-z A-Z)${n:1}Feature.*' passed" gherkin-gui.log
          done

      # The screenshots in here are the only evidence of a GUI failure.
      - name: Upload the xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-gui-${{ matrix.feature }}-xcresult
          path: ${{ runner.temp }}/gherkin-gui.xcresult
          if-no-files-found: warn

  # ─── desktop, Linux ──────────────────────────────────────────────────────────

      - name: Upload the validator reports and run configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-gui-${{ matrix.feature }}-artifacts
          # the sandboxed UI-test runner writes into its own container
          path: ~/Library/Containers/com.star-guiUITests.xctrunner/Data/tmp/gherkin-artifacts
          if-no-files-found: warn

  desktop-linux:
    name: desktop (ubuntu-24.04) · ${{ matrix.feature }}
    runs-on: ubuntu-24.04
    needs: [features, ffmpeg-linux]
    if: needs.features.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.features.outputs.desktop) }}
    # the `ui` job runs every @ui feature one after the other in the one build
    timeout-minutes: ${{ matrix.feature == 'ui' && 120 || 75 }}
    steps:
      - uses: actions/checkout@v4

      # The matrix entry `ui` is every @ui feature of this client in one job (see the top of this file); any other entry is one feature.
      # Either way this lists what the job runs.
      - name: Which features this job runs
        id: t
        shell: bash
        env:
          UI: ${{ needs.features.outputs.desktop_ui }}
        run: |
          f="${{ matrix.feature }}"
          if [ "$f" = ui ]; then features=$(jq -r 'join(" ")' <<<"$UI"); else features=$f; fi
          echo "features=$features" >> "$GITHUB_OUTPUT"

      # Test data comes from the `test-data` release via test_data/datasets.json (see test_data/README.md); the list of what
      # this client needs is generated (gherkin/generated/datasets-desktop.txt), never maintained by hand.
      # A @ui feature needs no dataset, and fetch.sh with no names is a usage error, not a no-op.
      - name: Fetch test data
        env:
          FEATURES: ${{ steps.t.outputs.features }}
        run: |
          names=$(for f in $FEATURES; do jq -r --arg f "$f" '.[$f][]' gherkin/generated/feature-datasets-desktop.json; done | sort -u)
          if [ -n "$names" ]; then test_data/fetch.sh $names; else echo "$FEATURES needs no test data"; fi

      - name: Install apt prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make git pkg-config perl dpkg-dev zip \
            libeigen3-dev zlib1g-dev libpng-dev libtiff-dev libjpeg-dev \
            libcurl4-openssl-dev

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.0'

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/linux
            opencv/include
          key: opencv-linux-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/linux
            StarDecisionTrees/include/release/linux
          key: dt-linux-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/linux/libopencv2.a ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/linux/libStarDecisionTrees.a ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      - name: Build stard (release)
        working-directory: daemon
        run: swift build -c release -Xswiftc -static-stdlib

      # ffmpeg/ffprobe for video import, the output video and the validator: the ffmpeg-gpu.yml artifact of this OS.
      - name: Fetch ffmpeg/ffprobe
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-linux-x64
          path: external_binaries/bin

      - name: Make ffmpeg/ffprobe executable and point STAR_FFMPEG_DIR at them
        shell: bash
        run: |
          chmod +x external_binaries/bin/ffmpeg external_binaries/bin/ffprobe || true
          echo "STAR_FFMPEG_DIR=$GITHUB_WORKSPACE/external_binaries/bin" >> "$GITHUB_ENV"

      # removal_tools/star-output-verify: every client's runner calls it for the validation steps.  The @ui features (uiXxx) have none,
      # and it links all of StarCore: 3 to 6 minutes of building for a job that goes on to run a few clicks.
      - name: Build the output validator
        if: ${{ !startsWith(matrix.feature, 'ui') }}
        shell: bash
        run: swift build -c release --package-path removal_tools

      # trail_tools/star-removal-verify: the trail-removal features' Then steps run it as a subprocess (the output validator above is unrelated).
      - name: Build the trail verifier (release)
        if: ${{ contains(fromJSON('["removeAirplanes","autoPreservationKeepsAirplanesOutJpeg","autoPreservationKeepsAirplanesOutBit16","selectiveRemovesOnlyTrails","syntheticSatellites","syntheticAirplanes"]'), matrix.feature) }}
        shell: bash
        run: |
          swift build -c release --package-path trail_tools

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # release.sh cloned OpenCV above, and its Android sample wrapper jar is not one setup-gradle recognises.
      - name: Drop OpenCV's vendored Android Gradle wrapper
        run: rm -rf opencv/opencv/platforms/android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gherkin/run-desktop-features.sh runs each feature in a Gradle run of its own (the runner allows one per JVM) and applies the
      # "not a vacuous green" check to each one's XML: exactly one test, it ran, was not skipped, and nothing failed.
      # stard intermittently wedges outright after frame 0's alignment (no governor line for the rest of the run, so it is stuck, not slow;
      # autoHorizonVideo, about 3 runs in 14), and the whole 50 minutes of the test timeout go by. A passing autoHorizonVideo leg takes
      # 8-13 minutes, so cut an attempt off at 25 and try once more; the retry kills any stard left behind. Root cause: filed as a follow-up.
      - name: Run the Gherkin features in the Compose UI
        env:
          STAR_GHERKIN_ARTIFACTS: ${{ runner.temp }}/gherkin-artifacts
        uses: nick-fields/retry@v3
        with:
          # an attempt of the `ui` job is all its features; a retry runs only those that failed (the script keeps what passed)
          timeout_minutes: ${{ matrix.feature == 'ui' && 75 || 25 }}
          max_attempts: 2
          retry_wait_seconds: 20
          polling_interval_seconds: 5
          warning_on_retry: true
          # The killed run's marker would make the next stard report a crashed run and cover the UI with an alert.
          on_retry_command: pkill -x stard || true; rm -rf star-desktop/build/run-markers
          shell: bash
          command: gherkin/run-desktop-features.sh "$GITHUB_WORKSPACE/daemon/.build/release/stard" ${{ steps.t.outputs.features }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-desktop-linux-reports-${{ matrix.feature }}
          path: star-desktop/build/gherkin-each
          if-no-files-found: warn

  # ─── desktop, Windows ────────────────────────────────────────────────────────
  # The slowest leg: stard is built from scratch on Windows (cache permitting). Same toolchain pinning as
  # cli.yml's `windows` job and kotlin-client.yml's `windows-package` job.

      - name: Upload the validator reports and run configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-desktop-linux-${{ matrix.feature }}-artifacts
          path: ${{ runner.temp }}/gherkin-artifacts
          if-no-files-found: warn

  desktop-windows:
    name: desktop (windows-2022) · ${{ matrix.feature }}
    runs-on: windows-2022
    needs: [features, ffmpeg-windows]
    if: needs.features.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.features.outputs.desktop) }}
    # the `ui` job runs every @ui feature one after the other in the one build
    timeout-minutes: ${{ matrix.feature == 'ui' && 150 || 90 }}
    defaults:
      run:
        shell: bash  # Git Bash; matches cli.yml's `windows` job
    steps:
      - uses: actions/checkout@v4

      # The matrix entry `ui` is every @ui feature of this client in one job (see the top of this file); any other entry is one feature.
      # Either way this lists what the job runs.
      - name: Which features this job runs
        id: t
        shell: bash
        env:
          UI: ${{ needs.features.outputs.desktop_ui }}
        run: |
          f="${{ matrix.feature }}"
          if [ "$f" = ui ]; then features=$(jq -r 'join(" ")' <<<"$UI"); else features=$f; fi
          echo "features=$features" >> "$GITHUB_OUTPUT"

      # Test data comes from the `test-data` release via test_data/datasets.json (see test_data/README.md); the list of what
      # this client needs is generated (gherkin/generated/datasets-desktop.txt), never maintained by hand.
      # A @ui feature needs no dataset, and fetch.sh with no names is a usage error, not a no-op.
      - name: Fetch test data
        env:
          FEATURES: ${{ steps.t.outputs.features }}
        run: |
          names=$(for f in $FEATURES; do jq -r --arg f "$f" '.[$f][]' gherkin/generated/feature-datasets-desktop.json; done | sort -u)
          if [ -n "$names" ]; then test_data/fetch.sh $names; else echo "$FEATURES needs no test data"; fi

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE

      - name: Install Eigen3 to C:/eigen3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest `
            -Uri 'https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip' `
            -OutFile "$env:RUNNER_TEMP\eigen.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\eigen.zip" -DestinationPath C:\
          Move-Item C:\eigen-3.4.0 C:\eigen3

      - name: Install MSVC 14.40 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $vsPath    = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $proc = Start-Process -FilePath $installer -ArgumentList @(
              'modify',
              '--installPath', "`"$vsPath`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.14.40.17.10.x86.x64',
              '--quiet', '--norestart', '--nocache'
          ) -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -notin 0,3010) {
              throw "VS Installer failed (exit code $($proc.ExitCode))"
          }
          $toolsetDir = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory `
              | Where-Object { $_.Name -like '14.40.*' } | Select-Object -First 1
          if (-not $toolsetDir) {
              throw "MSVC 14.40 toolset not found under $vsPath\VC\Tools\MSVC after install"
          }

      - name: Pin MSVC dev env to 14.40 + Windows SDK 10.0.22621.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          $output = & cmd /c "`"$vcvars`" 10.0.22621.0 -vcvars_ver=14.40 && set"
          $wanted = @(
              'INCLUDE','LIB','LIBPATH','PATH',
              'VCINSTALLDIR','VCToolsInstallDir','VCToolsVersion',
              'VSINSTALLDIR','WindowsSdkDir','WindowsSDKVersion','UCRTVersion'
          )
          foreach ($line in $output) {
              if ($line -match '^([A-Za-z_][A-Za-z0-9_(\)]*)=(.*)$') {
                  $name = $matches[1]; $value = $matches[2]
                  if ($wanted -contains $name) {
                      "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  }
              }
          }

      - name: Install Swift modulemaps into the pinned SDK and MSVC toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $share = Join-Path $env:SDKROOT 'usr\share'
          if (-not (Test-Path $share)) {
              throw "Swift SDK share dir not found at $share (SDKROOT=$env:SDKROOT)"
          }
          $sdkVer = $env:WindowsSDKVersion.TrimEnd('\')
          $sdkInc = Join-Path $env:WindowsSdkDir "Include\$sdkVer"
          $vcInc  = Join-Path $env:VCToolsInstallDir 'include'
          $copies = @(
              @{ src='ucrt.modulemap';     dst=(Join-Path $sdkInc 'ucrt\module.modulemap') },
              @{ src='winsdk.modulemap';   dst=(Join-Path $sdkInc 'um\module.modulemap')   },
              @{ src='visualc.modulemap';  dst=(Join-Path $vcInc  'module.modulemap')      },
              @{ src='visualc.apinotes';   dst=(Join-Path $vcInc  'visualc.apinotes')      }
          )
          foreach ($c in $copies) {
              $src = Join-Path $share $c.src
              if (Test-Path $src) {
                  $dstDir = Split-Path $c.dst -Parent
                  New-Item -ItemType Directory -Force -Path $dstDir | Out-Null
                  Copy-Item -Force $src $c.dst
              }
          }

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/windows
            opencv/include
          key: opencv-windows-msvc14.40-sdk22621-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/windows
            StarDecisionTrees/include/release/windows
          key: dt-windows-msvc14.40-sdk22621-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/windows/opencv2.lib ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/windows/StarDecisionTrees.lib ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      - name: Build stard (release)
        working-directory: daemon
        # Do not set CL=/D... globally, it breaks OpenCV's CMake compiler probe (see release_windows.sh).
        run: swift build -c release

      # ffmpeg/ffprobe for video import, the output video and the validator: the ffmpeg-gpu.yml artifact of this OS.
      - name: Fetch ffmpeg/ffprobe
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows-x64
          path: external_binaries/bin

      - name: Make ffmpeg/ffprobe executable and point STAR_FFMPEG_DIR at them
        shell: bash
        run: |
          chmod +x external_binaries/bin/ffmpeg.exe external_binaries/bin/ffprobe.exe || true
          echo "STAR_FFMPEG_DIR=$GITHUB_WORKSPACE/external_binaries/bin" >> "$GITHUB_ENV"

      # removal_tools/star-output-verify: every client's runner calls it for the validation steps.  The @ui features (uiXxx) have none,
      # and it links all of StarCore: 3 to 6 minutes of building for a job that goes on to run a few clicks.
      - name: Build the output validator
        if: ${{ !startsWith(matrix.feature, 'ui') }}
        shell: bash
        run: swift build -c release --package-path removal_tools

      # trail_tools/star-removal-verify: the trail-removal features' Then steps run it as a subprocess (the output validator above is unrelated).
      - name: Build the trail verifier (release)
        if: ${{ contains(fromJSON('["removeAirplanes","autoPreservationKeepsAirplanesOutJpeg","autoPreservationKeepsAirplanesOutBit16","selectiveRemovesOnlyTrails","syntheticSatellites","syntheticAirplanes"]'), matrix.feature) }}
        shell: bash
        run: |
          swift build -c release --package-path trail_tools

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Drop OpenCV's vendored Android Gradle wrapper
        run: rm -rf opencv/opencv/platforms/android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gherkin/run-desktop-features.sh runs each feature in a Gradle run of its own (the runner allows one per JVM) and applies the
      # "not a vacuous green" check to each one's XML: exactly one test, it ran, was not skipped, and nothing failed.
      - name: Run the Gherkin features in the Compose UI
        env:
          STAR_GHERKIN_ARTIFACTS: ${{ runner.temp }}/gherkin-artifacts
        # cygpath -m: the JVM wants C:/... , not Git Bash's /d/a/...
        run: gherkin/run-desktop-features.sh "$(cygpath -m "$GITHUB_WORKSPACE/daemon/.build/release/stard.exe")" ${{ steps.t.outputs.features }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-desktop-windows-reports-${{ matrix.feature }}
          path: star-desktop/build/gherkin-each
          if-no-files-found: warn

  # ─── desktop, macOS ──────────────────────────────────────────────────────────

      - name: Upload the validator reports and run configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-desktop-windows-${{ matrix.feature }}-artifacts
          path: ${{ runner.temp }}/gherkin-artifacts
          if-no-files-found: warn

  desktop-macos:
    name: desktop (macos-15) · ${{ matrix.feature }}
    runs-on: macos-15
    needs: [features, ffmpeg-macos]
    if: needs.features.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.features.outputs.desktop) }}
    # the `ui` job runs every @ui feature one after the other in the one build
    timeout-minutes: ${{ matrix.feature == 'ui' && 150 || 100 }}
    steps:
      - uses: actions/checkout@v4

      # The matrix entry `ui` is every @ui feature of this client in one job (see the top of this file); any other entry is one feature.
      # Either way this lists what the job runs.
      - name: Which features this job runs
        id: t
        shell: bash
        env:
          UI: ${{ needs.features.outputs.desktop_ui }}
        run: |
          f="${{ matrix.feature }}"
          if [ "$f" = ui ]; then features=$(jq -r 'join(" ")' <<<"$UI"); else features=$f; fi
          echo "features=$features" >> "$GITHUB_OUTPUT"

      # Test data comes from the `test-data` release via test_data/datasets.json (see test_data/README.md); the list of what
      # this client needs is generated (gherkin/generated/datasets-desktop.txt), never maintained by hand.
      # A @ui feature needs no dataset, and fetch.sh with no names is a usage error, not a no-op.
      - name: Fetch test data
        env:
          FEATURES: ${{ steps.t.outputs.features }}
        run: |
          names=$(for f in $FEATURES; do jq -r --arg f "$f" '.[$f][]' gherkin/generated/feature-datasets-desktop.json; done | sort -u)
          if [ -n "$names" ]; then test_data/fetch.sh $names; else echo "$FEATURES needs no test data"; fi

      - name: Select latest Xcode (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The StarDecisionTrees .swiftmodule only imports under the compiler that built it, and cli.yml's macos-14 jobs share the plain
      # dt-macos key with a different Swift: key this one on the toolchain.
      - name: Toolchain id for the cache key
        id: toolchain
        run: echo "id=$(xcodebuild -version | tr -c 'A-Za-z0-9.\n' _ | tr '\n' - | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      - name: Install Eigen3 via Homebrew
        run: brew install eigen

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/macos
            opencv/include
          key: opencv-macos-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/macos
            StarDecisionTrees/include/release/macos
          key: dt-macos-${{ steps.toolchain.outputs.id }}-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/macos/libopencv2.a ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/macos/libStarDecisionTrees.a ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      - name: Build stard (release)
        working-directory: daemon
        run: swift build -c release

      # ffmpeg/ffprobe for video import, the output video and the validator: the ffmpeg-gpu.yml artifact of this OS.
      - name: Fetch ffmpeg/ffprobe
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-macos-universal
          path: external_binaries/bin

      - name: Make ffmpeg/ffprobe executable and point STAR_FFMPEG_DIR at them
        shell: bash
        run: |
          chmod +x external_binaries/bin/ffmpeg external_binaries/bin/ffprobe || true
          echo "STAR_FFMPEG_DIR=$GITHUB_WORKSPACE/external_binaries/bin" >> "$GITHUB_ENV"

      # removal_tools/star-output-verify: every client's runner calls it for the validation steps.  The @ui features (uiXxx) have none,
      # and it links all of StarCore: 3 to 6 minutes of building for a job that goes on to run a few clicks.
      - name: Build the output validator
        if: ${{ !startsWith(matrix.feature, 'ui') }}
        shell: bash
        run: swift build -c release --package-path removal_tools

      # trail_tools/star-removal-verify: the trail-removal features' Then steps run it as a subprocess (the output validator above is unrelated).
      - name: Build the trail verifier (release)
        if: ${{ contains(fromJSON('["removeAirplanes","autoPreservationKeepsAirplanesOutJpeg","autoPreservationKeepsAirplanesOutBit16","selectiveRemovesOnlyTrails","syntheticSatellites","syntheticAirplanes"]'), matrix.feature) }}
        shell: bash
        run: |
          swift build -c release --package-path trail_tools

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Drop OpenCV's vendored Android Gradle wrapper
        run: rm -rf opencv/opencv/platforms/android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gherkin/run-desktop-features.sh runs each feature in a Gradle run of its own (the runner allows one per JVM) and applies the
      # "not a vacuous green" check to each one's XML: exactly one test, it ran, was not skipped, and nothing failed.
      # Hosted macOS VMs vary: one run had ~2GB free, so stard's memory gate admitted a frame every few minutes and nothing finished in 45
      # (the same leg passes in minutes on a healthier VM). Fail fast per attempt and try once more; the retry kills any stard left behind.
      - name: Run the Gherkin features in the Compose UI
        env:
          STAR_GHERKIN_ARTIFACTS: ${{ runner.temp }}/gherkin-artifacts
        uses: nick-fields/retry@v3
        with:
          # an attempt of the `ui` job is all its features; a retry runs only those that failed (the script keeps what passed)
          timeout_minutes: ${{ matrix.feature == 'ui' && 75 || 45 }}
          max_attempts: 2
          retry_wait_seconds: 20
          polling_interval_seconds: 5
          warning_on_retry: true
          # The killed run's marker would make the next stard report a crashed run and cover the UI with an alert.
          on_retry_command: pkill -x stard || true; rm -rf star-desktop/build/run-markers
          shell: bash
          # A 7GB VM with ~2-3GB free: at full resolution one frame's keypoint reservation (2.2GB) exceeds stard's narrowed memory budget, so
          # frames wait minutes each. stard itself defaults to 1.5 on such a machine; pin it so a roomier moment on the VM cannot pick 1.
          # Not coarser: 1.8 and 2 find no usable star alignment on this runner. The cli, gui and other desktop legs run the default.
          command: STAR_SYSTEM_FLOOR_MB=512 STAR_GHERKIN_DESKTOP_KEYPOINT_DIVISOR=1.5 gherkin/run-desktop-features.sh "$GITHUB_WORKSPACE/daemon/.build/release/stard" ${{ steps.t.outputs.features }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-desktop-macos-reports-${{ matrix.feature }}
          path: star-desktop/build/gherkin-each
          if-no-files-found: warn

      - name: Upload the validator reports and run configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-desktop-macos-${{ matrix.feature }}-artifacts
          path: ${{ runner.temp }}/gherkin-artifacts
          if-no-files-found: warn

