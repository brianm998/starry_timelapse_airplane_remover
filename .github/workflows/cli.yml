name: CLI Build

on:
  push:
    branches: [main, develop]
    # release/* tags also trigger the workflow so the macos-signed-release job
    # (gated below with `if:`) runs. The standard per-platform smoke builds run
    # on tag pushes too, which is fine — they're cached and cheap.
    tags: ['release/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Linux ───────────────────────────────────────────────────────────────────
  linux:
    name: Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install apt prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make git pkg-config perl dpkg-dev zip \
            libeigen3-dev zlib1g-dev libpng-dev libtiff-dev libjpeg-dev \
            libcurl4-openssl-dev

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.0'

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/linux
            opencv/include
          key: opencv-linux-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/linux
            StarDecisionTrees/include/release/linux
          key: dt-linux-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build CLI (.deb)
        run: bash release_linux.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-linux-deb
          path: cli/.build/*.deb
          if-no-files-found: error
          # SPM builds into .build, which upload-artifact@v4 treats as hidden
          # and skips by default. Opt in to including it.
          include-hidden-files: true

  # ─── macOS ───────────────────────────────────────────────────────────────────
  # NOTE: release_darwin.sh also builds the GUI and cli/release.sh runs Apple
  # notarization (which requires secrets), so we replicate the CLI-only path
  # inline using the same sub-scripts the macOS release uses.
  macos:
    name: macOS (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install Eigen3 via Homebrew
        # macos-14 runners don't ship Eigen pre-installed. StarCpp/Package.swift
        # expects headers at /opt/homebrew/include/eigen3 (Apple Silicon prefix,
        # which the macos-14 runner uses).
        run: brew install eigen

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/macos
            opencv/include
          key: opencv-macos-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/macos
            StarDecisionTrees/include/release/macos
          key: dt-macos-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/macos/libopencv2.a ]; then
            cd opencv && ./release.sh
          else
            echo "OpenCV: restored from cache"
          fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/macos/libStarDecisionTrees.a ]; then
            cd StarDecisionTrees && ./release.sh
          else
            echo "StarDecisionTrees: restored from cache"
          fi

      - name: Build CLI
        working-directory: cli
        run: |
          swift build -c release
          strip .build/release/star

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: star-macos
          path: cli/.build/release/star
          if-no-files-found: error
          # cli/.build is hidden; upload-artifact@v4 skips hidden paths by default.
          include-hidden-files: true

  # ─── macOS (signed + notarized release) ──────────────────────────────────────
  # Runs only on `release/*` tag pushes. Builds the CLI and GUI via the same
  # release scripts used locally on Brian's Mac, signs them with the Developer
  # ID cert from the APPLE_CERTIFICATE_P12_BASE64 secret, notarizes via the App
  # Store Connect API key, and uploads the stapled .pkg artifacts.
  #
  # Prerequisites in repo Settings -> Secrets and variables -> Actions:
  #   APPLE_CERTIFICATE_P12_BASE64  — base64 of a .p12 containing BOTH
  #                                   "Developer ID Application" and
  #                                   "Developer ID Installer" identities
  #                                   plus their private keys
  #   APPLE_CERTIFICATE_PASSWORD    — password used when exporting the .p12
  #   KEYCHAIN_PASSWORD             — any random string; used for the throwaway
  #                                   keychain we create on the runner
  #   APPLE_API_KEY_P8_BASE64       — base64 of the App Store Connect API .p8
  #   APPLE_API_KEY_ID              — 10-char key ID
  #   APPLE_API_ISSUER_ID           — issuer UUID
  #   APPLE_TEAM_ID                 — G3L75S65V9
  macos-signed-release:
    name: macOS signed release (macos-14)
    runs-on: macos-14
    # Fires on release/* tag pushes, and on manual "Run workflow" button
    # clicks from the Actions UI (workflow_dispatch). The dispatch path is
    # how you test the signing flow without cutting a real release tag.
    if: startsWith(github.ref, 'refs/tags/release/') || github.event_name == 'workflow_dispatch'
    needs: [macos]  # don't burn notary quota if the smoke build already failed
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Eigen3 via Homebrew
        run: brew install eigen

      # Share caches with the unsigned macos smoke job — same keys.
      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/macos
            opencv/include
          key: opencv-macos-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/macos
            StarDecisionTrees/include/release/macos
          key: dt-macos-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Import Developer ID certificate into a temporary keychain
        # We create a throwaway keychain rather than touching the runner's
        # login.keychain — cleaner teardown, and codesign/pkgbuild/productsign
        # are explicitly listed via -T so they can use the imported private
        # keys without a UI prompt.
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KC="$RUNNER_TEMP/build.keychain"
          P12="$RUNNER_TEMP/certs.p12"
          echo "$P12_B64" | base64 --decode > "$P12"

          security create-keychain -p "$KC_PASS" "$KC"
          # 6h lifetime — well over the expected build duration, auto-cleaned
          # when the runner is recycled regardless.
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          security import "$P12" -k "$KC" -P "$P12_PASS" \
              -T /usr/bin/codesign \
              -T /usr/bin/pkgbuild \
              -T /usr/bin/productsign \
              -T /usr/bin/security
          # set-key-partition-list is required on macOS 10.12+ for non-UI
          # access to the imported private keys.
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"

          # Prepend our temp keychain to the user search list so codesign and
          # xcodebuild find the Developer ID identities.
          security list-keychains -d user -s "$KC" \
              $(security list-keychains -d user | tr -d '"')

          # Verify both expected identities are present — fail fast otherwise.
          # NOTE: do NOT use `-p codesigning` here. The Developer ID *Installer*
          # cert isn't classified under macOS's `codesigning` trust policy
          # (it has its own "Developer ID Installer Signing" policy), so the
          # codesigning filter hides it — making it look like the .p12 is
          # missing the cert when it isn't. `pkgbuild` looks up identities
          # without that filter too, which is why local releases work.
          # Without -p we get all identities across all policies.
          security find-identity -v "$KC"
          TEAM_ID='${{ secrets.APPLE_TEAM_ID }}'
          APP_FOUND=$(security find-identity -v "$KC" \
              | grep -c "Developer ID Application:.*${TEAM_ID}" || true)
          INST_FOUND=$(security find-identity -v "$KC" \
              | grep -c "Developer ID Installer:.*${TEAM_ID}" || true)
          if [ "$APP_FOUND" -lt 1 ] || [ "$INST_FOUND" -lt 1 ]; then
              echo "::error::Missing Developer ID identities for team ${TEAM_ID}." \
                   "Found: Application=${APP_FOUND}, Installer=${INST_FOUND} (need 1 of each)."
              echo "Check that APPLE_CERTIFICATE_P12_BASE64 was exported from 'My Certificates'" \
                   "in Keychain Access with BOTH 'Developer ID Application: Brian Martin (${TEAM_ID})'" \
                   "and 'Developer ID Installer: Brian Martin (${TEAM_ID})' selected, including their" \
                   "child private-key rows."
              exit 1
          fi

      - name: Stage App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/private_keys"
          # notarytool looks for ~/private_keys/AuthKey_<id>.p8 by convention,
          # but we pass the path explicitly via --key so any location works.
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/macos/libopencv2.a ]; then
            cd opencv && ./release.sh
          else
            echo "OpenCV: restored from cache"
          fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/macos/libStarDecisionTrees.a ]; then
            cd StarDecisionTrees && ./release.sh
          else
            echo "StarDecisionTrees: restored from cache"
          fi

      - name: Build, sign, notarize, staple CLI
        working-directory: cli
        env:
          SIGN_APP: "Developer ID Application: Brian Martin (${{ secrets.APPLE_TEAM_ID }})"
          SIGN_PKG: "Developer ID Installer: Brian Martin (${{ secrets.APPLE_TEAM_ID }})"
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash release.sh

      - name: Fetch large GUI assets from ci-assets release
        # The GUI's Xcode project bundles gui/videos/11_30_2024-fx3-aurora-topaz-star.mp4
        # (~386 MB) as a splash-screen resource. That file is too big to keep
        # in git, so it lives in a dedicated `ci-assets` GitHub Release on
        # this repo. Re-upload with `--clobber` from a local Mac whenever the
        # asset changes:
        #   gh release upload ci-assets gui/videos/*.mp4 --clobber
        # First-time setup (run once, locally):
        #   gh release create ci-assets gui/videos/*.mp4 \
        #     --title "CI build assets" \
        #     --notes "Bulky non-code resources needed by macOS GUI builds." \
        #     --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p gui/videos
          gh release download ci-assets \
              --repo "${{ github.repository }}" \
              --pattern '*.mp4' \
              --dir gui/videos
          ls -lh gui/videos

      - name: Build, sign, notarize, staple GUI
        working-directory: gui
        env:
          # SIGN_APP is required in CI: the GUI's Xcode project ships with
          # CODE_SIGN_STYLE=Automatic, and release.sh switches to manual
          # signing when APPLE_API_KEY_PATH is set, naming this identity
          # explicitly on the xcodebuild command line (CI runners don't have
          # an Apple ID logged into Xcode, so automatic signing fails).
          SIGN_APP: "Developer ID Application: Brian Martin (${{ secrets.APPLE_TEAM_ID }})"
          SIGN_PKG: "Developer ID Installer: Brian Martin (${{ secrets.APPLE_TEAM_ID }})"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash release.sh

      - name: Upload signed CLI .pkg
        uses: actions/upload-artifact@v4
        with:
          name: star-cli-macos-pkg
          path: cli/.build/star_cli_*.pkg
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload signed GUI .pkg
        uses: actions/upload-artifact@v4
        with:
          name: star-gui-macos-pkg
          path: gui/.build/star_app_*.pkg
          if-no-files-found: error
          include-hidden-files: true

      - name: Clean up keychain + secrets
        # Keychain is in $RUNNER_TEMP which the runner wipes anyway, but be
        # explicit so a self-hosted runner doesn't leak the cert.
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP/certs.p12"
          rm -rf "$RUNNER_TEMP/private_keys"

  # ─── Windows ─────────────────────────────────────────────────────────────────
  windows:
    name: Windows (windows-2022)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash  # Git Bash; release_windows.sh requires it
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          # Bumped from 6.0 to 6.1: Swift 6.0 on Windows has a swift-driver
          # bug that deterministically aborts the StarCore module compile
          # with
          #   <unknown>:0: error: supplementary output file map
          #   '…\supplementaryOutputs-N' is missing an entry for
          #   '…\StarCore\Sources\StarCore\AbstractBlobProcessor.swift'
          # No build-config flag (-wmo, -disable-batch-mode, -j 1,
          # SWIFTPM_USE_INTEGRATED_DRIVER=0) avoided it on 6.0. Hoping the
          # newer driver in 6.1 has the fix.
          #
          # Watch for two earlier-known 6.1 gotchas:
          #   1. The 6.1 installer no longer leaves an MSVC dev env that
          #      OpenCV's CMake can auto-discover. The "Pin MSVC dev env"
          #      step below explicitly runs vcvars64.bat afterwards and
          #      exports INCLUDE/LIB/PATH to GITHUB_ENV, which should
          #      satisfy CMake — but if CMake still says "No CMAKE_CXX_COMPILER
          #      could be found" we'll need to also force the Visual Studio
          #      generator with -G "Visual Studio 17 2022" -A x64 in
          #      opencv/build.sh.
          #   2. The 6.1 Clang version may not trip the MSVC 14.44 STL
          #      static_assert the way 6.0's Clang 17 did. If StarCpp now
          #      compiles cleanly we can drop the
          #      _ALLOW_COMPILER_AND_STL_VERSION_MISMATCH workaround in
          #      StarCpp/Package.swift later.
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE

      - name: Install Eigen3 to C:/eigen3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest `
            -Uri 'https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip' `
            -OutFile "$env:RUNNER_TEMP\eigen.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\eigen.zip" -DestinationPath C:\
          Move-Item C:\eigen-3.4.0 C:\eigen3

      - name: Show toolchain
        run: |
          swift --version
          cmake --version
          perl --version | head -2

      - name: Install MSVC 14.40 toolset
        # The windows-2022 runner only ships the latest MSVC toolset, which is
        # 14.44 as of image 20260518. Swift 6.0's bundled Clang 17 has two
        # incompatibilities with the 14.44 headers:
        #   1. <wchar.h> now #includes <intrin.h>, creating a Clang module
        #      cycle (ucrt -> _visualc_intrinsics -> ucrt via <malloc.h> in
        #      <xmmintrin.h>). Breaks every Swift compile, including
        #      third-party packages like Semaphore.
        #   2. The STL static_asserts on Clang version >= 19 (the
        #      _ALLOW_COMPILER_AND_STL_VERSION_MISMATCH workaround in
        #      StarCpp/Package.swift covers this for the C++ compile, but not
        #      for the Swift Clang importer).
        # The 14.40 LTSC toolset predates both regressions. Installing it here
        # so the "Pin MSVC dev env" step below can switch vcvars to it.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $vsPath    = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          Write-Host "Adding MSVC 14.40 toolset to $vsPath"
          # The path contains spaces ("Program Files", "Visual Studio").
          # PowerShell's Start-Process -ArgumentList does NOT auto-quote array
          # elements that contain spaces — passing $vsPath bare results in the
          # installer parsing --installPath as just "C:\Program" and silently
          # ignoring the rest. Wrap in literal double quotes so the path stays
          # intact across the process boundary.
          $proc = Start-Process -FilePath $installer -ArgumentList @(
              'modify',
              '--installPath', "`"$vsPath`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.14.40.17.10.x86.x64',
              '--quiet', '--norestart', '--nocache'
          ) -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -notin 0,3010) {
              throw "VS Installer failed (exit code $($proc.ExitCode))"
          }
          # Verify the toolset is actually present so we fail fast if the
          # component ID drifts.
          $toolsetDir = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory `
              | Where-Object { $_.Name -like '14.40.*' } | Select-Object -First 1
          if (-not $toolsetDir) {
              throw "MSVC 14.40 toolset not found under $vsPath\VC\Tools\MSVC after install"
          }
          Write-Host "Installed: $($toolsetDir.Name)"

      - name: Pin MSVC dev env to 14.40 + Windows SDK 10.0.22621.0
        # gha-setup-swift activates the latest toolset + SDK via vcvars64. We
        # need to override BOTH:
        #
        #   * MSVC 14.40 (not 14.44) — see install step above.
        #
        #   * Windows SDK 10.0.22621.0 (not the current default 10.0.26100.0).
        #     The 26100 ucrt's <wchar.h> unconditionally `#include <intrin.h>`,
        #     which makes Clang build the _visualc_intrinsics module while
        #     building the ucrt module — and _visualc_intrinsics transitively
        #     includes <malloc.h> from ucrt, producing
        #         cyclic dependency in module 'ucrt':
        #             ucrt -> _visualc_intrinsics -> ucrt
        #     The cycle kills every Swift compile. SDK 22621 predates that
        #     wchar.h change. windows-2022 has it preinstalled alongside 26100.
        #
        # vcvars64.bat positional arg #1 is the SDK version; -vcvars_ver=
        # pins the MSVC toolset. Capture the resulting env and push it through
        # GITHUB_ENV so subsequent steps inherit it.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          $output = & cmd /c "`"$vcvars`" 10.0.22621.0 -vcvars_ver=14.40 && set"
          $wanted = @(
              'INCLUDE','LIB','LIBPATH','PATH',
              'VCINSTALLDIR','VCToolsInstallDir','VCToolsVersion',
              'VSINSTALLDIR','WindowsSdkDir','WindowsSDKVersion','UCRTVersion'
          )
          foreach ($line in $output) {
              if ($line -match '^([A-Za-z_][A-Za-z0-9_(\)]*)=(.*)$') {
                  $name = $matches[1]; $value = $matches[2]
                  if ($wanted -contains $name) {
                      "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  }
              }
          }
          $ver    = ($output | Where-Object { $_ -match '^VCToolsVersion='     }) -replace '^VCToolsVersion=', ''
          $sdkVer = ($output | Where-Object { $_ -match '^WindowsSDKVersion='  }) -replace '^WindowsSDKVersion=', ''
          $ucrt   = ($output | Where-Object { $_ -match '^UCRTVersion='        }) -replace '^UCRTVersion=', ''
          Write-Host "Active VCToolsVersion:    $ver"
          Write-Host "Active WindowsSDKVersion: $sdkVer"
          Write-Host "Active UCRTVersion:       $ucrt"

      - name: Install Swift modulemaps into the pinned SDK and MSVC toolset
        # Swift's Windows installer copies four modulemap/apinotes files from
        # $SDKROOT\usr\share\ into the Windows SDK and the MSVC toolset it
        # detected at install time. Since we just switched both SDK and MSVC
        # to non-default versions, the active include directories don't have
        # those files — which makes Swift's Clang importer fail with
        #     <unknown>:0: error: missing required module 'ucrt'
        # the moment any Swift file imports anything that pulls in ucrt.
        #
        # Replicate the installer's copy step for the active SDK + toolset.
        # Files are tolerant: if a source is missing on this Swift version,
        # we skip it rather than fail.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $share = Join-Path $env:SDKROOT 'usr\share'
          if (-not (Test-Path $share)) {
              throw "Swift SDK share dir not found at $share (SDKROOT=$env:SDKROOT)"
          }

          # Normalise WindowsSDKVersion (vcvars emits it with a trailing '\').
          $sdkVer = $env:WindowsSDKVersion.TrimEnd('\')
          $sdkInc = Join-Path $env:WindowsSdkDir "Include\$sdkVer"
          $vcInc  = Join-Path $env:VCToolsInstallDir 'include'

          $copies = @(
              @{ src='ucrt.modulemap';     dst=(Join-Path $sdkInc 'ucrt\module.modulemap') },
              @{ src='winsdk.modulemap';   dst=(Join-Path $sdkInc 'um\module.modulemap')   },
              @{ src='visualc.modulemap';  dst=(Join-Path $vcInc  'module.modulemap')      },
              @{ src='visualc.apinotes';   dst=(Join-Path $vcInc  'visualc.apinotes')      }
          )
          foreach ($c in $copies) {
              $src = Join-Path $share $c.src
              if (Test-Path $src) {
                  $dstDir = Split-Path $c.dst -Parent
                  New-Item -ItemType Directory -Force -Path $dstDir | Out-Null
                  Copy-Item -Force $src $c.dst
                  Write-Host "Copied $($c.src) -> $($c.dst)"
              } else {
                  Write-Host "Skipped (missing in this Swift toolchain): $src"
              }
          }

      # NOTE: cache keys include "msvc14.40" so changing the toolset pin
      # above invalidates these caches automatically (otherwise an older
      # toolset's libs could get linked against a newer toolset's code).
      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/windows
            opencv/include
          key: opencv-windows-msvc14.40-sdk22621-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/windows
            StarDecisionTrees/include/release/windows
          key: dt-windows-msvc14.40-sdk22621-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build CLI (.zip)
        # NOTE: do not set CL=/D... here. It propagates to every cl.exe invocation
        # including OpenCV's CMake compiler-identification probe, which then
        # silently fails ("No CMAKE_CXX_COMPILER could be found"). The
        # _ALLOW_COMPILER_AND_STL_VERSION_MISMATCH macro is applied surgically
        # in StarCpp/Package.swift instead, where it only affects StarCpp's
        # C++ files (which include the MSVC STL headers that need the bypass).
        run: bash release_windows.sh

      - name: Upload .zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-windows-zip
          path: cli/.build/*.zip
          if-no-files-found: error
          # cli/.build is hidden; upload-artifact@v4 skips hidden paths by default.
          include-hidden-files: true
