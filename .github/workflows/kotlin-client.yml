name: Kotlin Client

# Builds and tests the Kotlin/Compose desktop client (star-desktop) on Linux and Windows.
# This covers §8.2's "CI on Linux and Windows": proto generation, compile, and the transport unit
# tests run on both OSes. The integration tests (InteropIntegrationTest) self-skip here because no
# -Dstar.it.* fixture / stard binary is provided — they're for local runs against a real daemon.

on:
  push:
    branches: [main, develop]
    paths: ['star-desktop/**', 'daemon/proto/**', 'ffmpeg/**', '.github/workflows/kotlin-client.yml']
    # release/* tags build the installers and attach them to the release (see release-upload).
    # No paths filter applies to tag pushes.
    tags: ['release/*']
  pull_request:
    branches: [main, develop]
    paths: ['star-desktop/**', 'daemon/proto/**', 'ffmpeg/**', '.github/workflows/kotlin-client.yml']
  workflow_dispatch:

concurrency:
  group: kotlin-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: star-desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check proto is in sync with the daemon
        run: ./gradlew checkProtoSync --no-daemon

      - name: Build + unit tests
        run: ./gradlew test --no-daemon --stacktrace

  # ─── ffmpeg / ffprobe from source (Linux + Windows) ──────────────────────────
  # macOS bundles the binaries committed in external_binaries/bin; Linux and Windows have none, so
  # build static ones with ffmpeg/build_ci.sh. Cached on the script hash: after the first run this
  # job only restores the cache and re-uploads it.
  ffmpeg-linux:
    name: ffmpeg (Linux, from source)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-linux-${{ hashFiles('ffmpeg/build_ci.sh') }}
      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm pkg-config \
            libx264-dev libx265-dev libvpx-dev libmp3lame-dev libopus-dev libnuma-dev
      - name: Build ffmpeg + ffprobe
        if: steps.cache.outputs.cache-hit != 'true'
        run: ffmpeg/build_ci.sh "$PWD/ffmpeg-out"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: ffmpeg-out/*
          if-no-files-found: error

  ffmpeg-windows:
    name: ffmpeg (Windows, from source)
    runs-on: windows-2022
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-windows-${{ hashFiles('ffmpeg/build_ci.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-x264 mingw-w64-x86_64-x265 mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-lame mingw-w64-x86_64-opus
      - name: Build ffmpeg + ffprobe
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ffmpeg/build_ci.sh "$(cygpath -u "$GITHUB_WORKSPACE")/ffmpeg-out"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg-out/*
          if-no-files-found: error

  # ─── Linux installer (.deb) ───────────────────────────────────────────────────
  # Builds stard for Linux (same OpenCV/StarDecisionTrees caches as cli.yml's
  # `linux` job, so a warm cache there means nothing is rebuilt here either),
  # then packages the Compose Desktop app via stageAppResources + gradlew
  # packageDeb — the beta-distribution counterpart to macos-signed's .dmg, just
  # unsigned (no Linux equivalent of Developer ID / notarization).
  #
  # Runs on push (to develop/main) and manual dispatch, but not on pull_request:
  # building stard from scratch takes 15-30 minutes even with warm caches.
  linux-package:
    name: Linux installer (.deb)
    runs-on: ubuntu-24.04
    needs: ffmpeg-linux
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install apt prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make git pkg-config perl dpkg-dev zip \
            libeigen3-dev zlib1g-dev libpng-dev libtiff-dev libjpeg-dev \
            libcurl4-openssl-dev

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.0'

      # Same cache keys as cli.yml's `linux` job so the OpenCV / StarDecisionTrees
      # builds are shared instead of rebuilt.
      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/linux
            opencv/include
          key: opencv-linux-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/linux
            StarDecisionTrees/include/release/linux
          key: dt-linux-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/linux/libopencv2.a ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/linux/libStarDecisionTrees.a ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      - name: Build stard (release)
        working-directory: daemon
        # -static-stdlib, as release_linux.sh does for the CLI: a user's machine has no Swift
        # toolchain, so a stard linked against the toolchain's libswiftCore.so would not start.
        run: swift build -c release -Xswiftc -static-stdlib

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download source-built ffmpeg/ffprobe
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-linux
          path: ffmpeg-bin

      - name: Build .deb
        working-directory: star-desktop
        # stageAppResources picks up ../daemon/.build/release/stard automatically;
        # packageDeb depends on it. ffmpeg/ffprobe come from the ffmpeg-linux job.
        run: |
          chmod +x ../ffmpeg-bin/*
          ./gradlew packageDeb -Pffmpegdir="$PWD/../ffmpeg-bin" --no-daemon --stacktrace
          packaging/name-installers.sh build/compose/binaries/main/deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-desktop-linux-deb
          path: star-desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      # The installed app's contents, for linux-e2e to run on a fresh runner. A tar, because
      # upload-artifact drops the execute bits.
      - name: Pack the app image for the end-to-end test
        working-directory: star-desktop
        run: |
          ./gradlew createDistributable -Pffmpegdir="$PWD/../ffmpeg-bin" --no-daemon --stacktrace
          tar -C build/compose/binaries/main/app -cf ../star-desktop-app.tar .

      - uses: actions/upload-artifact@v4
        with:
          name: app-image-linux
          path: star-desktop-app.tar
          retention-days: 3
          if-no-files-found: error

  # ─── Windows installer (.exe) ─────────────────────────────────────────────────
  # Same idea as linux-package, but for Windows — reusing cli.yml's `windows`
  # job's MSVC/SDK pinning (needed for the Swift/Clang toolchain, same reasons
  # documented there) and OpenCV/StarDecisionTrees cache keys.
  windows-package:
    name: Windows installer (.exe)
    runs-on: windows-2022
    needs: ffmpeg-windows
    if: github.event_name != 'pull_request'
    defaults:
      run:
        shell: bash  # Git Bash; matches cli.yml's `windows` job
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          # See cli.yml's `windows` job for why 6.1 (not 6.0) and why the MSVC/SDK
          # pin below is needed — same toolchain, same StarCore/StarCpp sources.
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE

      - name: Install Eigen3 to C:/eigen3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest `
            -Uri 'https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip' `
            -OutFile "$env:RUNNER_TEMP\eigen.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\eigen.zip" -DestinationPath C:\
          Move-Item C:\eigen-3.4.0 C:\eigen3

      - name: Install MSVC 14.40 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $vsPath    = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $proc = Start-Process -FilePath $installer -ArgumentList @(
              'modify',
              '--installPath', "`"$vsPath`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.14.40.17.10.x86.x64',
              '--quiet', '--norestart', '--nocache'
          ) -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -notin 0,3010) {
              throw "VS Installer failed (exit code $($proc.ExitCode))"
          }
          $toolsetDir = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory `
              | Where-Object { $_.Name -like '14.40.*' } | Select-Object -First 1
          if (-not $toolsetDir) {
              throw "MSVC 14.40 toolset not found under $vsPath\VC\Tools\MSVC after install"
          }

      - name: Pin MSVC dev env to 14.40 + Windows SDK 10.0.22621.0
        # See cli.yml's `windows` job for the full explanation of why both pins
        # are needed (a Clang module cycle on the default SDK, an STL
        # static_assert on the default toolset).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          $output = & cmd /c "`"$vcvars`" 10.0.22621.0 -vcvars_ver=14.40 && set"
          $wanted = @(
              'INCLUDE','LIB','LIBPATH','PATH',
              'VCINSTALLDIR','VCToolsInstallDir','VCToolsVersion',
              'VSINSTALLDIR','WindowsSdkDir','WindowsSDKVersion','UCRTVersion'
          )
          foreach ($line in $output) {
              if ($line -match '^([A-Za-z_][A-Za-z0-9_(\)]*)=(.*)$') {
                  $name = $matches[1]; $value = $matches[2]
                  if ($wanted -contains $name) {
                      "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  }
              }
          }

      - name: Install Swift modulemaps into the pinned SDK and MSVC toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $share = Join-Path $env:SDKROOT 'usr\share'
          if (-not (Test-Path $share)) {
              throw "Swift SDK share dir not found at $share (SDKROOT=$env:SDKROOT)"
          }
          $sdkVer = $env:WindowsSDKVersion.TrimEnd('\')
          $sdkInc = Join-Path $env:WindowsSdkDir "Include\$sdkVer"
          $vcInc  = Join-Path $env:VCToolsInstallDir 'include'
          $copies = @(
              @{ src='ucrt.modulemap';     dst=(Join-Path $sdkInc 'ucrt\module.modulemap') },
              @{ src='winsdk.modulemap';   dst=(Join-Path $sdkInc 'um\module.modulemap')   },
              @{ src='visualc.modulemap';  dst=(Join-Path $vcInc  'module.modulemap')      },
              @{ src='visualc.apinotes';   dst=(Join-Path $vcInc  'visualc.apinotes')      }
          )
          foreach ($c in $copies) {
              $src = Join-Path $share $c.src
              if (Test-Path $src) {
                  $dstDir = Split-Path $c.dst -Parent
                  New-Item -ItemType Directory -Force -Path $dstDir | Out-Null
                  Copy-Item -Force $src $c.dst
              }
          }

      # Same cache keys as cli.yml's `windows` job (including the toolset/SDK
      # pin in the key, so changing that pin invalidates these automatically).
      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/windows
            opencv/include
          key: opencv-windows-msvc14.40-sdk22621-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/windows
            StarDecisionTrees/include/release/windows
          key: dt-windows-msvc14.40-sdk22621-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/windows/opencv2.lib ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/windows/StarDecisionTrees.lib ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      - name: Build stard (release)
        working-directory: daemon
        # See release_windows.sh's CL note (cli.yml `windows` job): do not set
        # CL=/D... globally, it breaks OpenCV's CMake compiler probe.
        run: swift build -c release

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download source-built ffmpeg/ffprobe
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg-bin

      - name: Build .exe
        working-directory: star-desktop
        run: |
          ./gradlew packageExe -Pffmpegdir="$PWD/../ffmpeg-bin" --no-daemon --stacktrace
          packaging/name-installers.sh build/compose/binaries/main/exe

      # Regression check for issue #3 ("engine stopped" on a machine without Swift): the installer
      # shipped stard.exe without the Swift/MSVC runtime DLLs, so Windows killed it at startup. Run
      # the bundled stard.exe from the app image with PATH reduced to System32 — i.e. with the Swift
      # toolchain this runner has NOT reachable — and require that it starts.
      - name: Verify bundled stard.exe starts without a Swift toolchain
        working-directory: star-desktop
        run: |
          # packageExe doesn't leave the app image behind (the previous run found no
          # build/compose/binaries/main/app); createDistributable produces it, and is cheap now.
          ./gradlew createDistributable -Pffmpegdir="$PWD/../ffmpeg-bin" --no-daemon --stacktrace
          APP=build/compose/binaries/main/app
          STARD=$(find "$APP" -name stard.exe | head -1)
          [ -n "$STARD" ] || { echo "::error::stard.exe not in the app image"; exit 1; }
          DIR=$(dirname "$STARD")
          echo "Bundled files in $DIR:"; ls "$DIR"
          for f in swiftCore.dll Foundation.dll ffmpeg.exe ffprobe.exe; do
            [ -f "$DIR/$f" ] || { echo "::error::$f missing from the bundle"; exit 1; }
          done
          set +e
          env -i SystemRoot="$SYSTEMROOT" PATH="/c/Windows/System32:/c/Windows" "$STARD" --help
          code=$?
          echo "stard.exe --help exit code: $code"
          [ "$code" -eq 0 ] || { echo "::error::stard.exe failed to start (exit $code; -1073741515 = missing DLL)"; exit 1; }
          for t in ffmpeg ffprobe; do
            out=$(env -i SystemRoot="$SYSTEMROOT" PATH="/c/Windows/System32:/c/Windows" "$DIR/$t.exe" -version 2>&1)
            code=$?
            echo "$t.exe -version exit code: $code"; echo "$out" | head -3
            [ "$code" -eq 0 ] || { echo "::error::bundled $t.exe failed to run (exit $code)"; ls -la "$DIR/$t.exe"; exit 1; }
          done

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-desktop-windows-exe
          path: star-desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      # The app image the step above built, for windows-e2e to run on a fresh runner.
      - name: Pack the app image for the end-to-end test
        run: tar -C star-desktop/build/compose/binaries/main/app -cf star-desktop-app.tar .

      - uses: actions/upload-artifact@v4
        with:
          name: app-image-windows
          path: star-desktop-app.tar
          retention-days: 3
          if-no-files-found: error

  # ─── macOS signed + notarized installer ──────────────────────────────────────
  # Builds the Compose Desktop app, bundles a natively-built stard + ffmpeg/ffprobe,
  # signs with Developer ID (hardened runtime), then notarizes + staples the .dmg —
  # reusing the same Apple secrets as cli.yml. Apple Silicon runner (macos-14) with
  # Xcode's Swift 6 (the proven cli.yml toolchain); the app + stard are arm64. Intel
  # is built/tested locally and is not produced here. NOTE: the ffmpeg/ffprobe in
  # external_binaries/ are x86_64-only, so video export needs Rosetta on this arm64
  # build (the app itself launches + drives the daemon natively); swap in an arm64/
  # universal ffmpeg later if native video export matters.
  #
  # Runs on push (to develop/main) and manual dispatch, but NOT on pull_request —
  # PRs (esp. from forks) can't read the signing secrets, and notarization is costly.
  #
  # Secrets (same as cli.yml): APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
  # KEYCHAIN_PASSWORD, APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_TEAM_ID.
  macos-signed:
    name: macOS signed + notarized installer (macos-14)
    runs-on: macos-14
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Eigen3 via Homebrew
        run: brew install eigen

      - name: Set up JDK 21 (Temurin — bundles jpackage; non-Homebrew vendor)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same cache keys as cli.yml's macos jobs (also macos-14) so the universal
      # OpenCV / StarDecisionTrees builds are shared instead of rebuilt.
      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/macos
            opencv/include
          key: opencv-macos-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/macos
            StarDecisionTrees/include/release/macos
          key: dt-macos-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/macos/libopencv2.a ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/macos/libStarDecisionTrees.a ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      - name: Build stard (release)
        working-directory: daemon
        run: swift build -c release

      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KC="$RUNNER_TEMP/build.keychain"; P12="$RUNNER_TEMP/certs.p12"
          echo "$P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          TEAM_ID='${{ secrets.APPLE_TEAM_ID }}'
          security find-identity -v "$KC"
          security find-identity -v "$KC" | grep -q "Developer ID Application:.*${TEAM_ID}" \
            || { echo "::error::Missing 'Developer ID Application' for team ${TEAM_ID} in the imported .p12"; exit 1; }

      - name: Stage App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Build signed .dmg
        working-directory: star-desktop
        env:
          # Drives the opt-in signing in build.gradle.kts. JAVA_HOME (Temurin 21, set by setup-java) is used
          # for both the Gradle JVM and jpackage — Temurin bundles jpackage and is a non-Homebrew vendor, so no
          # STAR_JPACKAGE_JDK / checkJdkVendor override is needed. stageAppResources picks up
          # ../daemon/.build/release/stard and ../external_binaries/bin automatically.
          STAR_SIGN_IDENTITY: "Developer ID Application: Brian Martin (${{ secrets.APPLE_TEAM_ID }})"
        run: |
          ./gradlew packageDmg --no-daemon --stacktrace
          packaging/name-installers.sh build/compose/binaries/main/dmg

      - name: Notarize + staple the .dmg
        working-directory: star-desktop
        env:
          KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          KEY_ID:   ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER:   ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -e
          DMG=$(ls build/compose/binaries/main/dmg/*.dmg | head -1)
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait --output-format json | tee "$RUNNER_TEMP/notary.json"
          STATUS=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary.json'))['status'])")
          SUB=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary.json'))['id'])")
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::notarization status=$STATUS"
            xcrun notarytool log "$SUB" --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER" || true
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "Notarized + stapled: $DMG"

      - name: Verify Gatekeeper acceptance of the notarized app
        working-directory: star-desktop
        run: |
          set -e
          DMG=$(ls build/compose/binaries/main/dmg/*.dmg | head -1)
          MNT=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          codesign --verify --deep --strict --verbose=2 "$MNT/Star.app"
          spctl -a -vvv -t exec "$MNT/Star.app"   # must now be 'accepted' (source=Notarized Developer ID)
          hdiutil detach "$MNT"

      - name: Upload notarized .dmg
        uses: actions/upload-artifact@v4
        with:
          name: star-desktop-macos-dmg
          path: star-desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

      # The signed .app, for macos-e2e to run on a fresh runner. createDistributable is
      # up to date after packageDmg; running it guarantees the .app is on disk.
      - name: Pack the app image for the end-to-end test
        working-directory: star-desktop
        env:
          STAR_SIGN_IDENTITY: "Developer ID Application: Brian Martin (${{ secrets.APPLE_TEAM_ID }})"
        run: |
          ./gradlew createDistributable --no-daemon --stacktrace
          tar -C build/compose/binaries/main/app -cf ../star-desktop-app.tar .

      - uses: actions/upload-artifact@v4
        with:
          name: app-image-macos
          path: star-desktop-app.tar
          retention-days: 3
          if-no-files-found: error

      - name: Clean up keychain + secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP/certs.p12"
          rm -rf "$RUNNER_TEMP/private_keys"

  # ─── End-to-end: the installed app drives its engine ─────────────────────────
  # Each runs the packaged app's own launcher with --self-test (EngineSelfTest.kt, via
  # packaging/self-test.sh): it starts the bundled engine, does the Daemon.Hello handshake,
  # checks the engine can read its localization tables, opens and processes a 16-bit TIFF
  # sequence, and imports a video through the bundled ffprobe/ffmpeg.
  #
  # On a FRESH runner, deliberately: no Swift toolchain and no build tree. The Windows
  # "connecting… engine stopped" bug was a stard.exe shipped without its resources, which
  # worked on every machine that still had the build directory — including the build job —
  # and nowhere else. These jobs are what would have caught it.
  windows-e2e:
    name: Windows end-to-end (installed app)
    runs-on: windows-2022
    needs: windows-package
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            star-desktop/packaging
            cli/packaging
            test_data/test_a7sii_10
      - uses: actions/download-artifact@v4
        with:
          name: app-image-windows
      - name: Unpack the app image
        # Workspace-relative paths: on Windows, $RUNNER_TEMP is a D:\ path, and GNU tar reads
        # a colon in a path as host:path.
        run: mkdir -p e2e-app && tar -C e2e-app -xf star-desktop-app.tar
      - name: stard.exe, ffmpeg.exe and ffprobe.exe DLL dependencies
        # dumpbin /dependents, from Visual Studio on the runner (cli/packaging, shared with cli.yml's
        # windows-e2e): every DLL each of them needs must be in the app image or be part of Windows.
        # The self-test below cannot prove the Visual C++ runtime is bundled, because this runner
        # has it installed and a user's machine may not, and it names only the first missing DLL.
        # (ffmpeg/build_ci.sh checks the ffmpeg binaries' imports against an allow-list when it builds
        # them; this checks what actually ships.) All three run, so one run reports every problem.
        run: |
          status=0
          for exe in stard ffmpeg ffprobe; do
            echo "::group::$exe.exe"
            bash cli/packaging/check-windows-dependencies.sh "e2e-app/Star/app/resources/$exe.exe" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Star --self-test
        run: bash star-desktop/packaging/self-test.sh e2e-app e2e-work
      - name: Keep the report and engine log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-report
          path: |
            e2e-work/self-test.txt
            e2e-work/scratch/logs/
          retention-days: 14
          if-no-files-found: ignore

  linux-e2e:
    name: Linux end-to-end (installed app)
    runs-on: ubuntu-24.04
    needs: linux-package
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            star-desktop/packaging
            test_data/test_a7sii_10
      - uses: actions/download-artifact@v4
        with:
          name: app-image-linux
      - name: Unpack the app image
        # Workspace-relative paths: on Windows, $RUNNER_TEMP is a D:\ path, and GNU tar reads
        # a colon in a path as host:path.
        run: mkdir -p e2e-app && tar -C e2e-app -xf star-desktop-app.tar
      - name: Star --self-test
        run: bash star-desktop/packaging/self-test.sh e2e-app e2e-work
      - name: Keep the report and engine log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linux-report
          path: |
            e2e-work/self-test.txt
            e2e-work/scratch/logs/
          retention-days: 14
          if-no-files-found: ignore

  macos-e2e:
    name: macOS end-to-end (installed app)
    runs-on: macos-14
    needs: macos-signed
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            star-desktop/packaging
            test_data/test_a7sii_10
      - uses: actions/download-artifact@v4
        with:
          name: app-image-macos
      # The bundled ffmpeg/ffprobe are x86_64-only (see macos-signed), so on this arm64 runner
      # they need Rosetta — as they do on a user's Apple Silicon Mac. Installing it here keeps
      # this job about the install, not about that known limitation.
      - name: Ensure Rosetta
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: Unpack the app image
        # Workspace-relative paths: on Windows, $RUNNER_TEMP is a D:\ path, and GNU tar reads
        # a colon in a path as host:path.
        run: mkdir -p e2e-app && tar -C e2e-app -xf star-desktop-app.tar
      - name: Star --self-test
        run: bash star-desktop/packaging/self-test.sh e2e-app e2e-work
      - name: Keep the report and engine log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-macos-report
          path: |
            e2e-work/self-test.txt
            e2e-work/scratch/logs/
          retention-days: 14
          if-no-files-found: ignore

  # ─── Attach installers to the GitHub release ─────────────────────────────────
  # On release/* tag pushes, adds the three desktop installers to the release for
  # that tag. cli.yml's release-publish job creates the draft release from the same
  # tag push; softprops/action-gh-release reuses an existing release for the tag
  # (drafts included) and creates a draft if this job gets there first. If both
  # create one simultaneously you can end up with two drafts: delete the duplicate.
  release-upload:
    name: Attach installers to release
    runs-on: ubuntu-latest
    # !cancelled() so one flaky installer job (a hosted runner dropping mid-build sank the whole
    # 0.12.1 upload) doesn't block the others; the check step below still fails this job loudly.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/release/') }}
    needs: [linux-package, windows-package, macos-signed, linux-e2e, windows-e2e, macos-e2e]
    permissions:
      contents: write
    steps:
      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: star-desktop-*   # the installers only (app images are app-image-*)
          path: release-artifacts/
          merge-multiple: true

      # An installer whose end-to-end test did not pass is not attached: 0.12.1 shipped a
      # Windows .exe whose engine could not start, and nothing stood between the build and
      # the release.
      - name: Drop installers that failed their end-to-end test
        env:
          LINUX_E2E: ${{ needs.linux-e2e.result }}
          WINDOWS_E2E: ${{ needs.windows-e2e.result }}
          MACOS_E2E: ${{ needs.macos-e2e.result }}
        run: |
          drop() { if [ "$2" != success ]; then echo "::error::$3 end-to-end test: $2 — not attaching the .$1"; rm -f release-artifacts/*.$1; fi; }
          drop deb "$LINUX_E2E" Linux
          drop exe "$WINDOWS_E2E" Windows
          drop dmg "$MACOS_E2E" macOS

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      # The upload below still happens with whatever was built; this marks the job failed so a
      # missing installer is not mistaken for a complete release.
      - name: Check all three installers were built
        id: complete
        continue-on-error: true
        run: |
          for ext in dmg deb exe; do
            ls release-artifacts/*.$ext >/dev/null 2>&1 || { echo "::error::no .$ext installer was built"; missing=1; }
          done
          exit ${missing:-0}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ github.ref_name }}
          name:                   "Star ${{ steps.ver.outputs.version }}"
          draft:                  true
          generate_release_notes: true
          files:                  release-artifacts/*

      - name: Fail if an installer is missing
        if: steps.complete.outcome == 'failure'
        run: exit 1
