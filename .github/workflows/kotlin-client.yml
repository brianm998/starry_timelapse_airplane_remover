name: Kotlin Client

# Builds and tests the Kotlin/Compose desktop client (star-desktop-v2) on Linux and Windows.
# This covers §8.2's "CI on Linux and Windows": proto generation, compile, and the transport unit
# tests run on both OSes. The integration tests (InteropIntegrationTest) self-skip here because no
# -Dstar.it.* fixture / stard binary is provided — they're for local runs against a real daemon.

on:
  push:
    branches: [main, develop]
    paths: ['star-desktop-v2/**', 'daemon/proto/**', '.github/workflows/kotlin-client.yml']
  pull_request:
    branches: [main, develop]
    paths: ['star-desktop-v2/**', 'daemon/proto/**', '.github/workflows/kotlin-client.yml']
  workflow_dispatch:

concurrency:
  group: kotlin-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: star-desktop-v2
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check proto is in sync with the daemon
        run: ./gradlew checkProtoSync --no-daemon

      - name: Build + unit tests
        run: ./gradlew test --no-daemon --stacktrace

  # ─── macOS signed + notarized installer ──────────────────────────────────────
  # Builds the Compose Desktop app, bundles a natively-built stard + the x86_64
  # ffmpeg/ffprobe from external_binaries/, signs with Developer ID (hardened
  # runtime), then notarizes + staples the .dmg — reusing the same Apple secrets
  # as cli.yml. Intel runner (macos-13): matches the x86_64 ffmpeg and produces an
  # installer that runs on Intel Macs without Rosetta. Runs only on manual dispatch
  # or release/* tags, so it never burns notary quota on a normal push.
  #
  # Secrets (same as cli.yml): APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
  # KEYCHAIN_PASSWORD, APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_TEAM_ID.
  macos-signed:
    name: macOS signed + notarized installer (macos-13)
    runs-on: macos-13
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/release/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift 6.0
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.0'

      - name: Install Eigen3 via Homebrew
        run: brew install eigen

      - name: Set up JDK 21 (Temurin — bundles jpackage; non-Homebrew vendor)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Separate cache keys from cli.yml's (those are arm64 from macos-14); these are x86_64.
      - name: Cache OpenCV (x86_64)
        uses: actions/cache@v4
        with:
          path: |
            opencv/lib/macos
            opencv/include
          key: opencv-macos-x64-${{ hashFiles('opencv/build.sh', 'opencv/release.sh') }}

      - name: Cache StarDecisionTrees (x86_64)
        uses: actions/cache@v4
        with:
          path: |
            StarDecisionTrees/lib/release/macos
            StarDecisionTrees/include/release/macos
          key: dt-macos-x64-${{ hashFiles('StarDecisionTrees/Package.swift', 'StarDecisionTrees/release.sh', 'StarDecisionTrees/makeList.pl', 'StarDecisionTrees/Sources/**/*.swift') }}

      - name: Build OpenCV (if not cached)
        run: |
          if [ ! -f opencv/lib/macos/libopencv2.a ]; then cd opencv && ./release.sh; else echo "OpenCV: restored from cache"; fi

      - name: Build StarDecisionTrees (if not cached)
        run: |
          if [ ! -f StarDecisionTrees/lib/release/macos/libStarDecisionTrees.a ]; then cd StarDecisionTrees && ./release.sh; else echo "StarDecisionTrees: restored from cache"; fi

      - name: Build stard (release)
        working-directory: daemon
        run: swift build -c release

      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KC="$RUNNER_TEMP/build.keychain"; P12="$RUNNER_TEMP/certs.p12"
          echo "$P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          TEAM_ID='${{ secrets.APPLE_TEAM_ID }}'
          security find-identity -v "$KC"
          security find-identity -v "$KC" | grep -q "Developer ID Application:.*${TEAM_ID}" \
            || { echo "::error::Missing 'Developer ID Application' for team ${TEAM_ID} in the imported .p12"; exit 1; }

      - name: Stage App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Build signed .dmg
        working-directory: star-desktop-v2
        env:
          # Drives the opt-in signing in build.gradle.kts. JAVA_HOME (Temurin 21, set by setup-java) is used
          # for both the Gradle JVM and jpackage — Temurin bundles jpackage and is a non-Homebrew vendor, so no
          # STAR_JPACKAGE_JDK / checkJdkVendor override is needed. stageAppResources picks up
          # ../daemon/.build/release/stard and ../external_binaries/bin automatically.
          STAR_SIGN_IDENTITY: "Developer ID Application: Brian Martin (${{ secrets.APPLE_TEAM_ID }})"
        run: ./gradlew packageDmg --no-daemon --stacktrace

      - name: Notarize + staple the .dmg
        working-directory: star-desktop-v2
        env:
          KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          KEY_ID:   ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER:   ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -e
          DMG=$(ls build/compose/binaries/main/dmg/*.dmg | head -1)
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait --output-format json | tee "$RUNNER_TEMP/notary.json"
          STATUS=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary.json'))['status'])")
          SUB=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary.json'))['id'])")
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::notarization status=$STATUS"
            xcrun notarytool log "$SUB" --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER" || true
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "Notarized + stapled: $DMG"

      - name: Verify Gatekeeper acceptance of the notarized app
        working-directory: star-desktop-v2
        run: |
          set -e
          DMG=$(ls build/compose/binaries/main/dmg/*.dmg | head -1)
          MNT=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          codesign --verify --deep --strict --verbose=2 "$MNT/Star.app"
          spctl -a -vvv -t exec "$MNT/Star.app"   # must now be 'accepted' (source=Notarized Developer ID)
          hdiutil detach "$MNT"

      - name: Upload notarized .dmg
        uses: actions/upload-artifact@v4
        with:
          name: star-desktop-v2-macos-dmg
          path: star-desktop-v2/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

      - name: Clean up keychain + secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP/certs.p12"
          rm -rf "$RUNNER_TEMP/private_keys"
